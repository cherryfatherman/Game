<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잊혀진 기사 키우기</title>
<style>
:root{
  --panel:#1c261b; --panel2:#2a2318; --box:#263324; --line:#5a5540; --hud:rgba(15,21,14,.68); --hudline:rgba(150,140,100,.42);
  --cream:#ece2c6; --dim:#aaa187; --acc:#e8943a; --red:#b9735f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a07;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
  color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:900px;height:1600px;transform-origin:center center;background:#0d120d;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:900px;height:1600px;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
.hidden{display:none!important}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hud{background:var(--hud);border:2px solid var(--hudline);border-radius:18px}
.coin{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3c777,#b9802f);border:3px solid #7a5420;flex:none}

/* 왼쪽 위: 기사 상태 */
#tl{position:absolute;left:14px;top:14px;width:430px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;z-index:5;pointer-events:none}
#status{width:100%;padding:12px 16px 14px}
#stTitle{font-size:24px;color:var(--acc);font-weight:600;line-height:30px}
#stName{font-size:34px;font-weight:700;line-height:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hpBar{height:38px;margin:6px 0 10px;background:#10160f;border:2px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#93ae69,#6b854a)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:34px;text-align:center;font-size:26px;font-weight:700;text-shadow:0 2px 3px #000}
#stRow{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700}
#stRow .sp{flex:1}
#stRow svg{font-size:34px;color:var(--dim)}
#lootTxt{font-size:30px;color:var(--cream)}
#stagePill{pointer-events:auto;height:84px;padding:0 22px;display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700;border-radius:42px}
#stagePill b{color:var(--acc)}
#stagePill svg{font-size:30px;color:var(--dim)}
#stagePill:active,.mBtn:active,.skill:active,#autoSk:active,#logBtn:active{filter:brightness(1.5)}

/* 오른쪽 위: 작은 지도와 메뉴 */
#tr{position:absolute;right:14px;top:14px;width:416px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:5;pointer-events:none}
#mini{width:144px;height:236px;padding:6px;border-radius:22px}
#mini canvas{width:128px;height:220px;display:block;border-radius:14px}
#menu,#menu2{display:grid;grid-template-columns:repeat(4,98px);gap:8px;pointer-events:auto;justify-content:end}
.mBtn{height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:25px;font-weight:600;border-radius:18px}
.mBtn svg{font-size:46px}
.mBtn.on{border-color:var(--acc);color:var(--acc)}

/* 오른쪽 아래: 스킬 */
#skills{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:124px 124px;gap:10px;z-index:5}
.skill{width:124px;height:124px;border-radius:26px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:23px;font-weight:600}
.skill svg{font-size:58px;color:var(--cream)}
.skill>span:not(.cd){white-space:nowrap;letter-spacing:-1.5px;font-size:22px}
.skill.cool svg{opacity:.22}
.skill .cd{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-size:46px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}
.skill.lock{color:var(--dim)} .skill.lock svg{color:var(--dim);opacity:.8}
.skill.ready{border-color:rgba(232,148,58,.8)}
#autoSk{position:absolute;right:14px;bottom:292px;width:104px;height:104px;border-radius:50%;z-index:5;font-size:28px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
#autoSk small{font-size:22px;font-weight:600;color:var(--dim)}
#autoSk.on{border-color:var(--acc);color:var(--acc)} #autoSk.on small{color:var(--acc)}

/* 아래: 기록 */
#log{position:absolute;left:14px;bottom:14px;width:596px;z-index:5;overflow:hidden;display:flex;flex-direction:column}
#progLine{height:8px;background:rgba(10,14,10,.7)} #progFill{height:100%;width:0;background:var(--acc)}
#logIn{display:flex;align-items:flex-start}
#logLines{flex:1;margin:8px 6px 8px 18px;height:84px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log.open #logLines{height:336px}
#logLines div{font-size:28px;line-height:42px;height:42px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
#logLines div.g{color:#e9c376} #logLines div.d{color:var(--dim)} #logLines div.a{color:var(--acc)} #logLines div.b{color:#d9907c}
#logBtn{width:84px;height:92px;margin:4px;border-radius:14px;font-size:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);pointer-events:auto}
#log.open #logBtn svg{transform:rotate(180deg)}
#toast{position:absolute;left:50%;bottom:470px;transform:translateX(-50%);padding:16px 30px;font-size:32px;font-weight:600;border-radius:40px;z-index:6;white-space:nowrap;pointer-events:none;transition:opacity .3s}

/* 아래에서 올라오는 판 */
#sheetWrap{position:absolute;inset:0;background:rgba(4,7,4,.4);z-index:10}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:1240px;display:flex;flex-direction:column;background:rgba(24,32,23,.97);
  border-top:3px solid var(--line);border-radius:30px 30px 0 0}
#sheetHead{display:flex;align-items:center;padding:18px 22px 14px 30px;flex:none}
#sheetHead h2{flex:1;margin:0;font-size:42px}
#sheetBody{overflow-y:auto;padding:6px 24px 40px;-webkit-overflow-scrolling:touch}
.btn{min-height:84px;padding:0 30px;font-size:32px;font-weight:600;background:var(--panel2);border:3px solid var(--line);border-radius:16px}
.btn:active{background:#463a26;transform:translateY(2px)}
.btn.acc{background:var(--acc);border-color:#a8641f;color:#22170a} .btn.acc:active{background:#c97a2a}
.btn:disabled{opacity:.35}
.up{display:flex;align-items:center;width:100%;height:116px;margin-top:12px;padding:0 24px;background:var(--panel2);border:3px solid var(--line);border-radius:18px;text-align:left}
.up:active{background:#463a26;transform:translateY(2px)}
.up .un{width:300px;font-size:36px;font-weight:700}
.up .un small{font-size:28px;font-weight:400;color:var(--dim);margin-left:10px}
.up .ue{flex:1;font-size:32px}
.up .upp{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700;color:var(--acc);min-width:170px;justify-content:flex-end}
.up.no{opacity:.45} .up.no .upp{color:var(--dim)}
.note{font-size:28px;line-height:1.5;color:var(--dim);margin:16px 6px 0}
.sec{margin:30px 0 12px;font-size:34px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:108px;padding:12px 20px;background:var(--panel);border:3px solid var(--line);border-radius:16px;text-align:left;display:flex;align-items:center;gap:16px}
.opt:active{background:#33432f}
.opt .on{font-size:33px;font-weight:700} .opt .oh{font-size:25px;color:var(--dim);margin-top:4px}
.opt.sel{border-color:var(--acc);background:#2c3a28} .opt.lock{opacity:.5}
.opt svg{font-size:36px;color:var(--dim)}
.dot{width:40px;height:40px;border-radius:50%;flex:none;border:3px solid #0008}
#cosTop{display:flex;gap:20px;align-items:stretch}
#cosPrev{width:340px;height:400px;border-radius:20px;border:3px solid var(--line);flex:none}
#cosNote{flex:1;font-size:28px;line-height:1.5;color:var(--dim);background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:22px}
#cosNote b{color:var(--cream);font-size:32px}
.dex{display:flex;gap:20px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.dex .pic{width:140px;height:140px;flex:none;background:#2f4230;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dex img{width:130px;height:130px;object-fit:contain}
.dex.un img{filter:brightness(0);opacity:.55}
.dex .dn{font-size:34px;font-weight:700} .dex .dn small{font-size:27px;color:var(--acc);margin-right:12px}
.dex .dt{font-size:28px;line-height:1.4;margin:6px 0} .dex .dl{font-size:27px;color:var(--dim)}
.toggle{display:flex;align-items:center;width:100%;min-height:96px;padding:0 24px;font-size:34px;font-weight:700;background:var(--panel2);border:3px solid var(--line);border-radius:18px}
.toggle span{flex:1;text-align:left} .toggle b{color:var(--dim)} .toggle.on{border-color:var(--acc)} .toggle.on b{color:var(--acc)}
.toggle:active{background:#463a26}

/* 가운데 뜨는 카드 */
.modal{position:absolute;inset:0;background:rgba(5,8,5,.78);display:flex;align-items:center;justify-content:center;z-index:20}
.card{width:740px;background:var(--panel2);border:4px solid var(--line);border-radius:24px;padding:46px 44px;text-align:center}
.card h3{margin:0 0 26px;font-size:44px;color:var(--acc)}
.card p{margin:14px 0;font-size:36px;line-height:1.5}
.card .small{font-size:30px;color:var(--dim)}
.card .btns{display:flex;gap:20px;justify-content:center;margin-top:36px}
.card .btn{font-size:36px;padding:0 44px}
#lowOv{position:absolute;inset:0;background:rgba(0,0,0,.74);z-index:30;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--dim);text-align:center;line-height:1.6}

/* 시작 화면 */
#start{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 30%,#2a3a27,#0e140e 75%)}
#start h1{margin:190px 0 14px;font-size:78px;letter-spacing:2px}
#start .sub{font-size:32px;color:var(--dim);margin-bottom:60px}
#gPick{display:flex;gap:36px}
.gBtn{width:300px;height:430px;background:var(--panel);border:4px solid var(--line);border-radius:22px;font-size:36px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px}
.gBtn canvas{width:260px;height:330px}
.gBtn.sel{border-color:var(--acc);background:#2c3a28}
.gBtn:active{filter:brightness(1.2)}
#start label{font-size:32px;color:var(--dim);margin:56px 0 14px}
#nameIn{width:460px;height:92px;font:inherit;font-size:44px;text-align:center;color:var(--cream);background:#10160f;
  border:4px solid var(--line);border-radius:16px;outline:none;user-select:text;-webkit-user-select:text}
#nameIn:focus{border-color:var(--acc)}
#goBtn{margin-top:60px;width:460px;height:110px;font-size:46px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="tl">
    <div id="status" class="hud">
      <div id="stTitle"></div>
      <div id="stName"></div>
      <div id="hpBar"><div id="hpFill"></div><div id="hpTxt"></div></div>
      <div id="stRow"><span class="coin"></span><span id="goldTxt">0</span><span class="sp"></span><span data-ic="bag"></span><span id="lootTxt">0</span></div>
    </div>
    <button id="stagePill" class="hud"><span id="pillName"></span><b id="pillProg"></b><span data-ic="down"></span></button>
  </div>

  <div id="tr">
    <div id="mini" class="hud"><canvas id="miniCv" width="256" height="440"></canvas></div>
    <div id="menu">
      <button class="mBtn hud" data-open="up"><span data-ic="up"></span>강화</button>
      <button class="mBtn hud" data-open="cos"><span data-ic="cloak"></span>꾸미기</button>
      <button class="mBtn hud" data-open="dex"><span data-ic="book"></span>도감</button>
      <button class="mBtn hud" id="bMore"><span data-ic="more"></span>더보기</button>
    </div>
    <div id="menu2" class="hidden">
      <span></span>
      <button class="mBtn hud" data-open="set"><span data-ic="gear"></span>설정</button>
      <button class="mBtn hud" id="bJournal"><span data-ic="page"></span>일지</button>
      <button class="mBtn hud" id="bLow"><span data-ic="moon"></span>절전</button>
    </div>
  </div>

  <button id="autoSk" class="hud">자동<small></small></button>
  <div id="skills"></div>

  <div id="log" class="hud">
    <div id="progLine"><div id="progFill"></div></div>
    <div id="logIn"><div id="logLines"></div><button id="logBtn"><span data-ic="upArrow"></span></button></div>
  </div>
  <div id="toast" class="hud" style="opacity:0"></div>

  <div id="sheetWrap" class="hidden">
    <div id="sheet">
      <div id="sheetHead"><h2 id="sheetTitle"></h2><button class="btn" id="sheetClose">닫기</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="start" class="hidden">
    <h1>잊혀진 기사 키우기</h1>
    <div class="sub">기사를 고르고 이름을 지어 주세요.</div>
    <div id="gPick">
      <button class="gBtn" data-g="m"><canvas width="520" height="660"></canvas>남자 기사</button>
      <button class="gBtn" data-g="f"><canvas width="520" height="660"></canvas>여자 기사</button>
    </div>
    <label for="nameIn">기사 이름</label>
    <input id="nameIn" maxlength="8" value="루" autocomplete="off" spellcheck="false">
    <button class="btn acc" id="goBtn">시작</button>
  </div>

  <div class="modal hidden" id="modal"><div class="card" id="cardBox"></div></div>
  <div id="lowOv" class="hidden">절전 중<br>화면을 누르면 풀립니다</div>
</div>

<script>
'use strict';
/* =====================================================================
   조정값 (TUNING) — 숫자는 전부 여기서 고친다.
   기준: 가이드라인.md 3장 "숫자" 표.
   ===================================================================== */
const TUNE = {
  // 기사 기본값 (가이드라인)
  KNIGHT_ATK: 10, KNIGHT_HP: 100, ATK_INTERVAL: 1.0, CRIT: 0.05, CRIT_MULT: 1.5, CRIT_CAP: 0.50,
  // 강화: 한 번에 오르는 양(step)과 첫 값(price). 값은 한 번에 7%씩 비싸진다 (가이드라인)
  UP: {
    atk:  { step: 1,    price: 32 },   // 공격력 +1
    hp:   { step: 15,   price: 22 },   // 체력 +15
    crit: { step: 0.01, price: 60 },   // 치명타 확률 +1%
  },
  PRICE_GROW: 1.07,
  // 몬스터 (가이드라인)
  MON_HP0: 20, MON_HP_GROW: 1.2, ZONE_MULT: 5,
  BOSS_HP_MULT: 10, BOSS_TIME: 30, BOSS_GOLD_MULT: 10,
  MON_ATK_RATIO: 0.1, GOLD_RATIO: 0.25,
  KILLS_TO_CLEAR: 10, ON_SCREEN: 6, DMG_CAP: 99990000,
  // 아래는 가이드라인에 없어서 이 파일에서 정한 값
  KNIGHT_SPEED: 230,        // 기사 걷는 빠르기 (px/초)
  REGEN: 0.01,              // 1초에 최대 체력의 1% 회복
  REVIVE: 3,                // 쓰러진 뒤 다시 일어나는 시간(초)
  MON_SPEED: 80,            // 몬스터 걷는 빠르기 (px/초)
  MON_ATK_INTERVAL: 1.6,    // 몬스터 공격 간격(초)
  BOSS_ATK_INTERVAL: 2.4,   // 보스 공격 간격(초)
  BOSS_ATK_MULT: 1.0,       // 보스 공격력 배수 (보스 체력의 10분의 1에 곱한다)
  MAX_ATTACKERS: 2,         // 한꺼번에 기사를 때릴 수 있는 몬스터 수 (기사 양옆에 선다)
  WAIT_RING: 2.3,           // 차례를 기다리는 몬스터가 물러서 있는 거리 (공격 거리의 배수)
  RESPAWN: [0.8, 2.0],      // 새 몬스터가 나타나기까지(초)
  LOOT_CHANCE: 0.12,        // 전리품이 나올 확률 (보스는 항상)
  SKILL_GAP: 0.5,           // 자동일 때 스킬과 스킬 사이 쉬는 시간(초)
  OFFLINE_CAP_MIN: 30,      // 쉬는 동안 보상은 최대 30분어치
  OFFLINE_SEC_PER_KILL: 30, // 쉬는 동안은 30초에 한 마리 잡은 것으로 친다
  SAVE_EVERY: 5,            // 자동 저장 간격(초)
};
/* 스킬 — mult는 공격력 배율(가이드라인: 120% ~ 300%), cd는 다시 쓰기까지(초), unlock은 열리는 스테이지
   kind: one = 눈앞의 한 마리, reach = 손 닿는 곳 전부, all = 화면 전부 */
const SKILLS = [
  { id:'smash', name:'내려치기',    mult:1.5, cd:4,  kind:'one',   unlock:1, icon:'skSmash', fx:'slash' },
  { id:'sweep', name:'휘두르기',    mult:1.2, cd:8,  kind:'reach', unlock:3, icon:'skSweep', fx:'ring' },
  { id:'flare', name:'등불 섬광',   mult:2.0, cd:20, kind:'all',   unlock:5, icon:'skFlare', fx:'flash' },
  { id:'shard', name:'기억의 일격', mult:3.0, cd:30, kind:'one',   unlock:8, icon:'skShard', fx:'strike' },
];

/* 1구역 몬스터 — 몬스터 도감.md 그대로. mult는 특징을 살리는 작은 배수 */
const ZONE = 1, ZONE_NAME = '이슬숲 길';
const MONSTERS = [
  { file:'1-01-냄비다람쥐', name:'냄비 쓴 다람쥐', short:'다람쥐', h:185, loot:'찌그러진 냄비',
    trait:'가장 약하다. 냄비를 투구처럼 쓰고 표정만 사납다.', mult:{}, bb:[205,119,880,952] },
  { file:'1-02-박쥐', name:'박쥐', short:'박쥐', h:200, fly:55, loot:'박쥐 날개',
    trait:'날아다녀서 성가시다. 등불을 보면 덮친다.', mult:{spd:1.2}, bb:[62,72,981,869] },
  { file:'1-03-여우', name:'여우', short:'여우', h:190, loot:'여우 꼬리',
    trait:'마르고 날래다. 움직임이 빠르다.', mult:{spd:1.45}, bb:[46,183,982,873] },
  { file:'1-04-사마귀', name:'거대 사마귀', short:'사마귀', h:235, loot:'사마귀 낫발',
    trait:'풀숲에서 기다리다 낫발로 내리친다. 한 방이 아프다.', mult:{atk:1.3}, bb:[49,56,991,983] },
  { file:'1-05-독버섯', name:'독버섯', short:'독버섯', h:206, loot:'독버섯 갓',
    trait:'뿌리로 걸어 다닌다. 느리지만 잘 버틴다.', mult:{hp:1.3, spd:0.7}, bb:[106,69,921,963] },
  { file:'1-06-멧돼지', name:'멧돼지', short:'멧돼지', h:200, loot:'굽은 엄니',

function bboxOf(img, fallback) {              // 투명하지 않은 부분만 잘라 쓴다
  try {
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    const c = mk(W, H), g = c.getContext('2d', { willReadFrequently:true });
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 >= 0) return [x0, y0, x1 + 1, y1 + 1];
  } catch (e) {}
  return fallback || [0, 0, img.naturalWidth || img.width, img.naturalHeight || img.height];
}
function removeWhite(img) {                   // 흰 배경 그림이면 가장자리에서부터 흰색을 지운다
  const c = mk(img.naturalWidth, img.naturalHeight), g = c.getContext('2d', { willReadFrequently:true });
  g.drawImage(img, 0, 0);
  try {
    const W = c.width, H = c.height, id = g.getImageData(0, 0, W, H), d = id.data;
    const white = i => d[i * 4 + 3] > 200 && d[i * 4] > 236 && d[i * 4 + 1] > 236 && d[i * 4 + 2] > 236;
    if (!white(0) || !white(W - 1)) return c;
    const seen = new Uint8Array(W * H), st = new Int32Array(W * H); let n = 0;
    const push = i => { if (!seen[i] && white(i)) { seen[i] = 1; st[n++] = i; } };
    for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (n) {
      const i = st[--n], x = i % W; d[i * 4 + 3] = 0;
      if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < W * (H - 1)) push(i + W);
    }
    g.putImageData(id, 0, 0);
  } catch (e) {}
  return c;
}
/* 화면 크기에 맞춘 그림 한 장 + 맞았을 때 번쩍이는 밝은 그림. ax는 발이 놓이는 x 자리(0~1) */
function makeSprite(h, aspect, paint, ax) {
  const w = h * aspect, c = mk(w * SPR_Q, h * SPR_Q), g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  paint(g, c.width, c.height);
  const f = mk(c.width, c.height), fg = f.getContext('2d');
  fg.drawImage(c, 0, 0); fg.globalCompositeOperation = 'source-atop'; fg.fillStyle = '#fff6e0'; fg.fillRect(0, 0, f.width, f.height);
  return { c, f, w, h, ax:ax == null ? 0.5 : ax };
}
const monSprites = {};     // 스테이지 번호 -> 그림
function loadMonster(st) {
  if (monSprites[st]) return;
  const def = MONSTERS[st - 1], img = new Image();
  monSprites[st] = { ready:false, w:def.h * (def.bb[2] - def.bb[0]) / (def.bb[3] - def.bb[1]), h:def.h };
  img.onload = () => {
    const b = bboxOf(img, def.bb), bw = b[2] - b[0], bh = b[3] - b[1];
    const sp = makeSprite(def.h, bw / bh, (g, W, H) => g.drawImage(img, b[0], b[1], bw, bh, 0, 0, W, H));
    sp.ready = true; monSprites[st] = sp;

  img.src = 'art/monsters/' + encodeURIComponent(def.file) + '.png';
}

function knightArt(gender, look) {
  const layers = []; let base = null;
  for (const [slot, list] of KNIGHT_LAYERS) {
    const it = list.find(c => c.id === look[slot]) || list[0], im = knightImgs[slot + '-' + it.id + '-' + gender];
    if (im && im !== 'none') { layers.push(im); if (slot === 'armor') base = it; }
    else if (slot === 'armor') break;                 // 바탕 그림이 없으면 임시 기사를 쓴다
  }
  if (layers.length) {
    if (base && base.at && base.at[gender]) base = Object.assign({}, base, base.at[gender]);   // 자리 정보는 남녀 그림마다 다르다
    // 모든 겹은 같은 캔버스를 쓴다. 겹친 전체에서 빈 곳만 한 번에 잘라 낸다.
    const b = [1e9, 1e9, -1, -1];
    for (const l of layers) { b[0] = Math.min(b[0], l.bb[0]); b[1] = Math.min(b[1], l.bb[1]); b[2] = Math.max(b[2], l.bb[2]); b[3] = Math.max(b[3], l.bb[3]); }

  g.drawImage(bg, 280, 700, 340, 400, 0, 0, 340, 400);
  const cx = 170 + (sp.ax - 0.5) * sp.w * sc, fy = 362;
  drawShadow(g, cx, fy, sp.bw * sc * 0.62, 22, 0.6);
  if (S.cos.foot !== 'none') for (let i = 0; i < 7; i++) {
    const q = (t * 0.8 + i / 7) % 1;
    drawPart(g, { kind:S.cos.foot, x:cx + Math.sin(i * 2.4) * 70, y:fy + 4 - q * (S.cos.foot === 'leaf' ? 40 : 90), t:q, life:1, r:i });
  }
  drawKnight(g, sp, cx, fy, -1, t, { scale:sc });
  const tt = titleText();
  outlined(g, S.name, 170, 50, 30, '#ece2c6'); if (tt) outlined(g, tt, 170, 20, 24, '#e8b25a');
}
function buildDex(box) {
  MONSTERS.forEach((m, i) => {
    const st = i + 1, n = S.kills[st] || 0, seen = n > 0, d = document.createElement('div');
    d.className = 'dex' + (seen ? '' : ' un');
    d.innerHTML = '<div class="pic"><img alt="" src="art/monsters/' + encodeURIComponent(m.file) + '.png"></div><div>' +
      '<div class="dn"><small>' + ZONE + '-' + st + (m.boss ? ' 보스' : '') + '</small>' + (seen ? m.name : '???') + '</div>' +
      '<div class="dt">' + (seen ? m.trait : '아직 잡지 못했다.') + '</div>' +
      '<div class="dl">' + (seen ? '전리품: ' + m.loot + ' ' + (S.loot[st] || 0) + '개 · 잡은 수 ' + fmt(n) : '전리품: ???') + '</div></div>';
    box.appendChild(d);
  });
}
function buildStage(box) {
  const tg = document.createElement('button'); tg.className = 'toggle' + (S.auto ? ' on' : '');
  tg.innerHTML = '<span>자동 진행</span><b>' + (S.auto ? '켬' : '끔') + '</b>';
  tg.onclick = () => { S.auto = !S.auto; if (S.auto && R.progress >= TUNE.KILLS_TO_CLEAR && S.stage < 10) R.advanceT = 0.3; openSheet('stage'); };
  box.appendChild(tg);
  const n = document.createElement('div'); n.className = 'note'; n.textContent = '켜면 열 마리를 잡고 다음 길로 넘어갑니다. 끄면 이 길에 머뭅니다.'; box.appendChild(n);
  const h = document.createElement('div'); h.className = 'sec'; h.textContent = ZONE + '구역 · ' + ZONE_NAME; box.appendChild(h);
  const grid = document.createElement('div'); grid.className = 'grid'; box.appendChild(grid);
  MONSTERS.forEach((m, i) => {
    const st = i + 1, open = st <= S.maxStage, b = document.createElement('button');
    b.className = 'opt' + (st === S.stage ? ' sel' : '') + (open ? '' : ' lock');
    b.innerHTML = (open ? '' : icon('lock')) + '<span><div class="on">' + ZONE + '-' + st + ' ' + (open ? m.short : '???') + '</div><div class="oh">' +
      (st === S.stage ? '지금 여기' : open ? (m.boss ? '우두머리 · 30초' : '갈 수 있음') : ZONE + '-' + (st - 1) + '을 깨면 열림') + '</div></span>';
    b.onclick = () => { if (!open) { toast(ZONE + '-' + (st - 1) + '을 깨면 열립니다'); return; } closeSheet(); if (st !== S.stage) gotoStage(st); };
    grid.appendChild(b);
  });
}
function buildSet(box) {
  box.innerHTML = '<div class="note" style="font-size:32px;color:var(--cream)">' + (S.gender === 'f' ? '여자 기사' : '남자 기사') + ' · ' + escapeHtml(S.name) + '</div>' +
    '<div class="note">게임은 몇 초마다 저절로 저장됩니다.</div><div style="height:26px"></div>';
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = '처음부터'; b.style.width = '100%';
  b.onclick = () => showCard('<h3>처음부터</h3><p>모은 것이 모두 사라집니다.</p><p>정말 처음부터 할까요?</p>', [{ text:'아니요', acc:true }, { text:'네, 지웁니다', fn:resetAll }]);
  box.appendChild(b);
}

/* ===================================================================== 카드와 시작 화면 */
function showCard(html, buttons) {
  $('cardBox').innerHTML = html + '<div class="btns"></div>';
  const row = $('cardBox').querySelector('.btns');
  for (const b of buttons) {
    const el = document.createElement('button'); el.className = 'btn' + (b.acc ? ' acc' : ''); el.textContent = b.text;
    el.onclick = () => { $('modal').classList.add('hidden'); if (b.fn) b.fn(); };
    row.appendChild(el);
  }
  $('modal').classList.remove('hidden');
}
function showStory() {
  const call = S.gender === 'f' ? '누나!' : '형!';
  showCard('<h3>기억 조각</h3><p>첫 번째 기억 조각을 되찾았다.</p><p>미로가 달려와 안긴다.</p><p>“' + call + '”</p><p class="small">2구역은 나중에 열립니다.</p>',
    [{ text:'계속하기', acc:true }]);
}
function resetAll() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  S = freshSave(); knightSprite = null; R.mons = []; R.floats = []; R.parts = []; R.fx = []; R.banner = null; R.progress = 0; R.log = []; R.logDirty = true;
  for (const sk of SKILLS) R.cd[sk.id] = 0;
  R.k.x = FW / 2; R.k.y = 900; R.k.dead = false; R.k.target = null;
  closeSheet(); buildSkills(); openStart();
}
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

let startGender = 'm';
function drawStartPreviews() {
  document.querySelectorAll('.gBtn').forEach(b => {
    const c = b.querySelector('canvas'), g = c.getContext('2d'), a = knightArt(b.dataset.g, BASIC_LOOK), h = 270 * a.hMul, w = h * a.aspect;
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 260, 330);
    const x0 = 130 - w / 2, y0 = 312 - h;
    drawShadow(g, x0 + a.ax * w, 306, 80, 18, 0.6);
    const t = mk(w * 2, h * 2); a.paint(t.getContext('2d'), t.width, t.height);
    g.imageSmoothingQuality = 'high'; g.drawImage(t, x0, y0, w, h);
    glow(g, x0 + a.lantern[0] * w, y0 + a.lantern[1] * h, 56, '#f0983c', 0.5);
    b.classList.toggle('sel', b.dataset.g === startGender);
  });
}
function redrawStatic() { if (!$('start').classList.contains('hidden')) drawStartPreviews(); }
function openStart() {
  R.paused = true; startGender = S.gender; $('nameIn').value = S.name || '루';
  $('start').classList.remove('hidden'); drawStartPreviews();
}
function startGame() {
  S.gender = startGender; S.name = ($('nameIn').value || '').trim().slice(0, 8) || '루'; S.started = true;
  knightSprite = null; $('start').classList.add('hidden'); R.paused = false;
  R.k.hp = kMax(); buildSkills(); addLog(ZONE_NAME + '에 들어섰다', 'd'); gotoStage(S.stage); save();
}

/* 쉬는 동안 모은 골드: 최대 30분어치 */
function offlineReward(sec) {
  if (!S.started || sec < 60) return;
  const g = Math.floor(Math.min(sec, TUNE.OFFLINE_CAP_MIN * 60) / TUNE.OFFLINE_SEC_PER_KILL) * goldOf(Math.min(S.stage, 9));
  if (g <= 0) return;
  S.gold += g; save(); addLog('쉬는 동안 +' + fmt(g) + ' 골드', 'g'); refreshHud();
  showCard('<h3>다녀왔습니다</h3><p>쉬는 동안 골드를 모았다.</p><p><b>+' + fmt(g) + ' 골드</b></p><p class="small">최대 ' + TUNE.OFFLINE_CAP_MIN + '분어치까지 쌓입니다.</p>', [{ text:'받기', acc:true }]);
}

/* ===================================================================== 시작 */
function fit() {
  const s = Math.min(innerWidth / 900, innerHeight / 1600);
  $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  viewQ = clamp(s * (window.devicePixelRatio || 1), 1, 1.6);
  cv.width = Math.round(FW * viewQ); cv.height = Math.round(FH * viewQ);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
}
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;      // 탭이 가려졌다 돌아와도 튀지 않게
  R.frameN++;
  if (!R.paused) {
    for (let i = 0; i < SPEED; i++) update(dt);
    R.saveT += dt; if (R.saveT > TUNE.SAVE_EVERY) { R.saveT = 0; save(); }
    R.uiT += dt; if (R.uiT > 0.12) { R.uiT = 0; refreshHud(); if (!R.low) drawMini(); }
  }
  if (R.low && R.frameN % 10) return;                                         // 절전: 그림은 드물게만 그린다
  if (!R.paused) refreshSkills();
  draw();
  if (R.sheet === 'cos') drawCosPreview(t / 1000);
}
function init() {
  cv = $('cv'); ctx = cv.getContext('2d');
  document.querySelectorAll('[data-ic]').forEach(e => { e.outerHTML = icon(e.dataset.ic); });
  load(); bg = makeBackground(); fit(); addEventListener('resize', fit);
  loadKnightImages(); for (let i = 1; i <= 10; i++) loadMonster(i);
  buildSkills();

  $('stagePill').onclick = () => openSheet('stage');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSheet(b.dataset.open));
  $('bMore').onclick = () => { $('menu2').classList.toggle('hidden'); $('bMore').classList.toggle('on', !$('menu2').classList.contains('hidden')); };
  $('bJournal').onclick = () => showCard('<h3>일지</h3><p>준비 중입니다.</p><p class="small">길을 처음 깰 때마다 한 줄씩 열립니다.</p>', [{ text:'닫기', acc:true }]);
  $('bLow').onclick = () => { R.low = true; $('lowOv').classList.remove('hidden'); };
  $('lowOv').onclick = () => { R.low = false; $('lowOv').classList.add('hidden'); };
  $('autoSk').onclick = () => { S.autoSkill = !S.autoSkill; refreshHud(); };
  $('logBtn').onclick = () => $('log').classList.toggle('open');
  $('sheetClose').onclick = closeSheet;
  $('sheetWrap').addEventListener('pointerdown', e => { if (e.target === $('sheetWrap')) closeSheet(); });
  document.querySelectorAll('.gBtn').forEach(b => b.onclick = () => { startGender = b.dataset.g; drawStartPreviews(); });
  $('goBtn').onclick = startGame;
  $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  document.addEventListener('contextmenu', e => e.preventDefault());

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (S.started) save(); }
    else if (hiddenAt) { offlineReward((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
  });
  addEventListener('pagehide', () => { if (S.started) save(); });

  if (DEBUG) {
    window.__g = { get S() { return S; }, R, TUNE, buy, gotoStage, setMaxStage, openSheet };
    addEventListener('keydown', e => {
      if (e.target === $('nameIn') || R.paused) return;
      if (e.key === 'n' || e.key === 'N') {             // 스테이지 넘기기
        if (S.stage === 10) { const b = R.mons.find(m => m.def.boss && !m.dead); if (b) { b.hp = 0; killMonster(b); } }
        else { S.kills[S.stage] = S.kills[S.stage] || 1; setMaxStage(S.stage + 1); gotoStage(S.stage + 1); }
      }
      if (e.key === 'g' || e.key === 'G') { S.gold += 1000; refreshHud(); }
    });
  }

  if (S.started) {
    const away = (Date.now() - (S.last || Date.now())) / 1000;
    R.paused = false; R.k.hp = kMax(); addLog('다시 길에 섰다', 'd'); gotoStage(S.stage); offlineReward(away);
  } else openStart();
  refreshHud();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
init();
</script>
</body>
</html>
