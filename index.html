<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잊혀진 기사 키우기</title>
<style>
:root{
  --bg:#0d120d; --panel:#1c261b; --panel2:#2a2318; --box:#263324; --line:#4b4733;
  --cream:#ece2c6; --dim:#a79e83; --acc:#e8943a; --hp:#7f9a5a; --bad:#b9735f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a07;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
  color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:900px;height:1600px;transform-origin:center center;background:var(--bg);overflow:hidden}
#cv{position:absolute;left:0;top:0;width:900px;height:992px;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
.hidden{display:none!important}

/* 아래 조작판 */
#panel{position:absolute;left:0;top:992px;width:900px;height:608px;background:linear-gradient(#222d20,#182017);
  border-top:4px solid var(--line);padding:16px 22px 0}
.row{display:flex;align-items:center;gap:14px}
#rowTop{height:76px}
#gold{flex:1;font-size:46px;font-weight:700;display:flex;align-items:center;gap:14px}
.coin{display:inline-block;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3c777,#b9802f);border:3px solid #7a5420;flex:none}
.coin.s{width:26px;height:26px;border-width:2px}
.btn{height:68px;padding:0 26px;font-size:32px;font-weight:600;background:var(--panel2);border:3px solid var(--line);border-radius:14px}
.btn:active{background:#3a3020}
.btn.acc{background:var(--acc);border-color:#a8641f;color:#22170a}
#rowStage{height:88px;margin-top:10px;background:var(--box);border:3px solid var(--line);border-radius:16px;padding:0 10px}
.arrow{width:76px;height:68px;font-size:52px;line-height:60px;font-weight:700;border-radius:12px;background:var(--panel2);border:3px solid var(--line)}
.arrow:disabled{opacity:.3}
#stageName{flex:1;text-align:center;font-size:38px;font-weight:700;white-space:nowrap;overflow:hidden}
#prog{font-size:36px;font-weight:700;color:var(--acc);min-width:110px;text-align:center}
#auto{height:68px;padding:0 16px;font-size:28px;border-radius:12px;background:var(--panel2);border:3px solid var(--line);white-space:nowrap}
#auto.on{border-color:var(--acc)}
#rowHp{height:56px;margin-top:10px}
#hpName{font-size:30px;width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hpBar{flex:1;height:40px;background:#10160f;border:3px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#93ae69,#6b854a)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:34px;text-align:center;font-size:28px;font-weight:700;text-shadow:0 2px 3px #000}
.up{display:flex;align-items:center;width:100%;height:100px;margin-top:10px;padding:0 22px;background:var(--panel2);
  border:3px solid var(--line);border-radius:16px;text-align:left}
.up:active{background:#3a3020}
.up .un{width:300px;font-size:36px;font-weight:700}
.up .un small{font-size:28px;font-weight:400;color:var(--dim);margin-left:10px}
.up .ue{flex:1;font-size:32px;color:var(--cream)}
.up .upp{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700;color:var(--acc);min-width:170px;justify-content:flex-end}
.up.no{opacity:.45}
.up.no .upp{color:var(--dim)}

/* 덮는 화면 */
.ov{position:absolute;inset:0;background:#141c14;display:flex;flex-direction:column;z-index:10}
.ovHead{display:flex;align-items:center;height:110px;padding:0 26px;border-bottom:4px solid var(--line);background:var(--panel);flex:none}
.ovHead h2{flex:1;margin:0;font-size:46px}
.ovBody{flex:1;overflow-y:auto;padding:22px 26px 60px;-webkit-overflow-scrolling:touch}
.modal{position:absolute;inset:0;background:rgba(5,8,5,.78);display:flex;align-items:center;justify-content:center;z-index:20}
.card{width:740px;background:var(--panel2);border:4px solid var(--line);border-radius:24px;padding:46px 44px;text-align:center}
.card h3{margin:0 0 26px;font-size:44px;color:var(--acc)}
.card p{margin:14px 0;font-size:36px;line-height:1.5}
.card .small{font-size:30px;color:var(--dim)}
.card .btns{display:flex;gap:20px;justify-content:center;margin-top:36px}
.card .btn{height:84px;font-size:36px;padding:0 44px}

/* 시작 화면 */
#start{align-items:center;background:radial-gradient(ellipse at 50% 30%,#2a3a27,#0e140e 75%)}
#start h1{margin:190px 0 14px;font-size:78px;letter-spacing:2px}
#start .sub{font-size:32px;color:var(--dim);margin-bottom:60px}
#gPick{display:flex;gap:36px}
.gBtn{width:300px;height:430px;background:var(--panel);border:4px solid var(--line);border-radius:22px;font-size:36px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px}
.gBtn canvas{width:240px;height:330px}
.gBtn.sel{border-color:var(--acc);background:#2c3a28}
#start label{font-size:32px;color:var(--dim);margin:56px 0 14px}
#nameIn{width:460px;height:92px;font:inherit;font-size:44px;text-align:center;color:var(--cream);background:#10160f;
  border:4px solid var(--line);border-radius:16px;outline:none;user-select:text;-webkit-user-select:text}
#nameIn:focus{border-color:var(--acc)}
#goBtn{margin-top:60px;width:460px;height:110px;font-size:46px}

/* 꾸미기 */
#cosTop{display:flex;gap:24px;align-items:stretch}
#cosPrev{width:400px;height:480px;border-radius:20px;border:4px solid var(--line);flex:none}
#cosNote{flex:1;font-size:30px;line-height:1.55;color:var(--dim);background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:26px}
#cosNote b{color:var(--cream);font-size:34px}
.sec{margin:34px 0 14px;font-size:36px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:112px;padding:14px 20px;background:var(--panel);border:3px solid var(--line);border-radius:16px;text-align:left;display:flex;align-items:center;gap:16px}
.opt .on{font-size:34px;font-weight:700}
.opt .oh{font-size:26px;color:var(--dim);margin-top:4px}
.opt.sel{border-color:var(--acc);background:#2c3a28}
.opt.lock{opacity:.55}
.dot{width:40px;height:40px;border-radius:50%;flex:none;border:3px solid #0008}

/* 도감 */
.dex{display:flex;gap:22px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:14px}
.dex .pic{width:150px;height:150px;flex:none;background:#2f4230;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dex img{width:140px;height:140px;object-fit:contain}
.dex.un img{filter:brightness(0);opacity:.55}
.dex .dn{font-size:36px;font-weight:700}
.dex .dn small{font-size:28px;color:var(--acc);margin-right:12px}
.dex .dt{font-size:29px;line-height:1.4;margin:6px 0;color:var(--cream)}
.dex .dl{font-size:28px;color:var(--dim)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="panel">
    <div class="row" id="rowTop">
      <div id="gold"><span class="coin"></span><span id="goldTxt">0</span></div>
      <button class="btn" id="bCos">꾸미기</button>
      <button class="btn" id="bDex">도감</button>
      <button class="btn" id="bSet">설정</button>
    </div>
    <div class="row" id="rowStage">
      <button class="arrow" id="bPrev">‹</button>
      <div id="stageName"></div>
      <div id="prog"></div>
      <button id="auto"></button>
      <button class="arrow" id="bNext">›</button>
    </div>
    <div class="row" id="rowHp">
      <div id="hpName"></div>
      <div id="hpBar"><div id="hpFill"></div><div id="hpTxt"></div></div>
    </div>
    <button class="up" data-k="atk"><span class="un"></span><span class="ue"></span><span class="upp"></span></button>
    <button class="up" data-k="hp"><span class="un"></span><span class="ue"></span><span class="upp"></span></button>
    <button class="up" data-k="crit"><span class="un"></span><span class="ue"></span><span class="upp"></span></button>
  </div>

  <div class="ov hidden" id="start">
    <h1>잊혀진 기사 키우기</h1>
    <div class="sub">기사를 고르고 이름을 지어 주세요.</div>
    <div id="gPick">
      <button class="gBtn" data-g="m"><canvas width="240" height="330"></canvas>남자 기사</button>
      <button class="gBtn" data-g="f"><canvas width="240" height="330"></canvas>여자 기사</button>
    </div>
    <label for="nameIn">기사 이름</label>
    <input id="nameIn" maxlength="8" value="루" autocomplete="off" spellcheck="false">
    <button class="btn acc" id="goBtn">시작</button>
  </div>

  <div class="ov hidden" id="cos">
    <div class="ovHead"><h2>꾸미기</h2><button class="btn" data-close="cos">닫기</button></div>
    <div class="ovBody">
      <div id="cosTop">
        <canvas id="cosPrev" width="400" height="480"></canvas>
        <div id="cosNote"><b>모습만 바뀝니다.</b><br>꾸미기는 능력치를 바꾸지 않습니다.<br>좋아하는 모습 그대로 강해지세요.<br><br>잠긴 것은 적힌 일을 하면 열립니다.</div>
      </div>
      <div id="cosLists"></div>
    </div>
  </div>

  <div class="ov hidden" id="dex">
    <div class="ovHead"><h2>도감 · 이슬숲 길</h2><button class="btn" data-close="dex">닫기</button></div>
    <div class="ovBody" id="dexList"></div>
  </div>

  <div class="modal hidden" id="modal"><div class="card" id="cardBox"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   조정값 (TUNING) — 숫자는 전부 여기서 고친다.
   기준: 가이드라인.md 3장 "숫자" 표.
   ===================================================================== */
const TUNE = {
  // 기사 기본값 (가이드라인)
  KNIGHT_ATK: 10, KNIGHT_HP: 100, ATK_INTERVAL: 1.0, CRIT: 0.05, CRIT_MULT: 1.5, CRIT_CAP: 0.50,
  // 강화: 한 번에 오르는 양(step)과 첫 값(price). 값은 한 번에 7%씩 비싸진다 (가이드라인)
  UP: {
    atk:  { step: 1,    price: 12 },   // 공격력 +1
    hp:   { step: 15,   price: 10 },   // 체력 +15
    crit: { step: 0.01, price: 40 },   // 치명타 확률 +1%
  },
  PRICE_GROW: 1.07,
  // 몬스터 (가이드라인)
  MON_HP0: 20, MON_HP_GROW: 1.2, ZONE_MULT: 5,
  BOSS_HP_MULT: 10, BOSS_TIME: 30, BOSS_GOLD_MULT: 10,
  MON_ATK_RATIO: 0.1, GOLD_RATIO: 0.25,
  KILLS_TO_CLEAR: 10, ON_SCREEN: 6, DMG_CAP: 99990000,
  // 아래는 가이드라인에 없어서 이 파일에서 정한 값
  KNIGHT_SPEED: 210,        // 기사 걷는 빠르기 (px/초)
  REGEN: 0.01,              // 1초에 최대 체력의 1% 회복
  REVIVE: 3,                // 쓰러진 뒤 다시 일어나는 시간(초)
  MON_SPEED: 70,            // 몬스터 걷는 빠르기 (px/초)
  MON_ATK_INTERVAL: 1.6,    // 몬스터 공격 간격(초)
  BOSS_ATK_INTERVAL: 2.4,   // 보스 공격 간격(초)
  BOSS_ATK_MULT: 1.0,       // 보스 공격력 배수 (보스 체력의 10분의 1에 곱한다)
  MAX_ATTACKERS: 2,         // 한꺼번에 기사를 때릴 수 있는 몬스터 수
  WAIT_RING: 1.9,           // 차례를 기다리는 몬스터가 물러서 있는 거리 (공격 거리의 배수)
  RESPAWN: [0.8, 2.0],      // 새 몬스터가 나타나기까지(초)
  LOOT_CHANCE: 0.12,        // 전리품이 나올 확률 (보스는 항상)
  OFFLINE_CAP_H: 2,         // 쉬는 동안 보상 최대 시간
  OFFLINE_SEC_PER_KILL: 20, // 쉬는 동안은 20초에 한 마리 잡은 것으로 친다
  SAVE_EVERY: 5,            // 자동 저장 간격(초)
};

/* 1구역 몬스터 — 몬스터 도감.md 그대로. mult는 특징을 살리는 작은 배수 */
const ZONE = 1, ZONE_NAME = '이슬숲 길';
const MONSTERS = [
  { file:'1-01-냄비다람쥐', name:'냄비 쓴 다람쥐', short:'다람쥐', h:185, loot:'찌그러진 냄비',
    trait:'가장 약하다. 냄비를 투구처럼 쓰고 표정만 사납다.', mult:{}, bb:[205,119,880,952] },
  { file:'1-02-박쥐', name:'박쥐', short:'박쥐', h:200, fly:55, loot:'박쥐 날개',
    trait:'날아다녀서 성가시다. 등불을 보면 덮친다.', mult:{spd:1.2}, bb:[62,72,981,869] },
  { file:'1-03-여우', name:'여우', short:'여우', h:190, loot:'여우 꼬리',
    trait:'마르고 날래다. 움직임이 빠르다.', mult:{spd:1.45}, bb:[46,183,982,873] },
  { file:'1-04-사마귀', name:'거대 사마귀', short:'사마귀', h:235, loot:'사마귀 낫발',
    trait:'풀숲에서 기다리다 낫발로 내리친다. 한 방이 아프다.', mult:{atk:1.3}, bb:[49,56,991,983] },
  { file:'1-05-독버섯', name:'독버섯', short:'독버섯', h:206, loot:'독버섯 갓',
    trait:'뿌리로 걸어 다닌다. 느리지만 잘 버틴다.', mult:{hp:1.3, spd:0.7}, bb:[106,69,921,963] },
  { file:'1-06-멧돼지', name:'멧돼지', short:'멧돼지', h:200, loot:'굽은 엄니',
    trait:'엄니를 앞세워 들이받는다. 숲에서 힘이 가장 세다.', mult:{atk:1.4}, bb:[69,117,956,956] },
  { file:'1-07-늑대', name:'늑대', short:'늑대', h:206, loot:'늑대 송곳니',
    trait:'이를 드러내고 낮게 다가온다. 숲에서 가장 빠르다.', mult:{spd:1.7}, bb:[84,110,972,962] },
  { file:'1-08-고블린', name:'고블린', short:'고블린', h:212, loot:'녹슨 단검',
    trait:'녹슨 단검을 든 약탈자. 마을 물건을 훔쳐 간다.', mult:{}, bb:[86,77,943,975] },
  { file:'1-09-홉고블린', name:'홉고블린', short:'홉고블린', h:249, loot:'이 빠진 큰 칼',
    trait:'고블린 무리의 싸움꾼. 가죽 갑옷이 단단하다.', mult:{hp:1.25}, bb:[87,72,865,986] },
  { file:'1-10-고블린왕', name:'고블린 왕', short:'고블린 왕', h:400, boss:true, loot:'찌그러진 왕관',
    trait:'숲의 우두머리. 쇠못 박힌 전투 망치를 휘두른다.', mult:{spd:0.8}, bb:[39,62,988,974] },
];

/* 꾸미기 — 모습만 바꾼다. 능력치는 건드리지 않는다. ok(S)가 참이면 열린다 */
const dexFull = s => MONSTERS.every((_, i) => (s.kills[i + 1] || 0) > 0);
// 그림 꾸미기는 세 칸이다: 머리, 갑옷, 무기. 세 그림은 크기와 자리가 같은 캔버스에 그려서 그대로 겹친다.
// 그리는 차례: 갑옷(몸 전체, 바탕) -> 무기 -> 머리. 그림이 없는 칸은 건너뛴다.
// img가 null이면 그림이 아직 없다는 뜻. 그림이 생기면 img를 채우고 ok를 조건으로 바꾼다.
const HEADS = [
  { id:'basic', name:'기본', how:'처음부터', img:null, ok:() => true },   // 지금은 바탕 그림에 머리가 들어 있다
  { id:'head2', name:'준비 중인 투구', how:'1구역 보스 처치', img:null, ok:() => false },
  { id:'head3', name:'준비 중인 모자', how:'도감 10종 채우기', img:null, ok:() => false },
];
const ARMORS = [
  { id:'basic', name:'기본', how:'처음부터', img:{ m:'art/knight/기본-남.png', f:'art/knight/기본-여.png' }, lantern:[0.58,0.62], ok:() => true },
  { id:'armor2', name:'준비 중인 갑옷', how:'1구역 보스 처치', img:null, ok:() => false },
  { id:'armor3', name:'준비 중인 갑옷', how:'업적 · 이벤트', img:null, ok:() => false },
];
const WEAPONS = [
  { id:'basic', name:'기본', how:'처음부터', img:null, ok:() => true },   // 지금은 바탕 그림에 칼이 들어 있다
  { id:'weapon2', name:'준비 중인 무기', how:'1구역 보스 처치', img:null, ok:() => false },
  { id:'weapon3', name:'준비 중인 무기', how:'고블린 100마리 잡기', img:null, ok:() => false },
];
const KNIGHT_LAYERS = [['armor', ARMORS], ['weapon', WEAPONS], ['head', HEADS]];   // 겹치는 차례
const LANTERN_COLORS = [
  { id:'orange', name:'주황',   color:'#f0983c', how:'처음부터', ok:() => true },
  { id:'amber',  name:'호박빛', color:'#e8c26c', how:'1-5 깨기', ok:s => s.maxStage >= 6 },
  { id:'moon',   name:'달빛',   color:'#d6ddcc', how:'1구역 보스 처치', ok:s => s.bossDone },
  { id:'moss',   name:'이끼빛', color:'#b3cb86', how:'도감 10종 채우기', ok:dexFull },
];
const FOOT_EFFECTS = [
  { id:'none',  name:'없음', how:'처음부터', ok:() => true },
  { id:'leaf',  name:'풀잎', how:'1-3 깨기', ok:s => s.maxStage >= 4 },
  { id:'ember', name:'불씨', how:'늑대 30마리 잡기', ok:s => (s.kills[7] || 0) >= 30 },
];
const TITLES = [
  { id:'none',   name:'없음', text:'', how:'처음부터', ok:() => true },
  { id:'walker', name:'숲길 나그네', text:'숲길 나그네', how:'1-5 깨기', ok:s => s.maxStage >= 6 },
  { id:'pot',    name:'냄비 수집가', text:'냄비 수집가', how:'찌그러진 냄비 5개 모으기', ok:s => (s.loot[1] || 0) >= 5 },
  { id:'forest', name:'이슬숲의 기사', text:'이슬숲의 기사', how:'1구역 보스 처치', ok:s => s.bossDone },
];
const COS_GROUPS = [
  { key:'head',    title:'머리', list:HEADS },

function bboxOf(img, fallback) {              // 투명하지 않은 부분만 잘라 쓴다

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) {

    }
    if (x1 >= 0) return [x0, y0, x1 + 1, y1 + 1];
  } catch (e) {}

}

    const W = c.width, H = c.height, id = g.getImageData(0, 0, W, H), d = id.data;
    const white = i => d[i * 4 + 3] > 200 && d[i * 4] > 236 && d[i * 4 + 1] > 236 && d[i * 4 + 2] > 236;
    if (!white(0) || !white(W - 1)) return c;
    const seen = new Uint8Array(W * H), st = new Int32Array(W * H); let n = 0;
    const push = i => { if (!seen[i] && white(i)) { seen[i] = 1; st[n++] = i; } };
    for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (n) {

function makeBackground() {
  const c = mk(FW, FH), g = c.getContext('2d');
  let seed = 7; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = '#34492f'; g.fillRect(0, 0, FW, FH);                       // 이끼색 바탕
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  const blot = (cell, rgb, alpha) => {                                     // 흐린 얼룩
    const n = mk(Math.ceil(FW / cell) + 3, Math.ceil(FH / cell) + 3), ng = n.getContext('2d'), id = ng.createImageData(n.width, n.height);
    for (let i = 0; i < id.data.length; i += 4) {
      id.data[i] = rgb[0]; id.data[i + 1] = rgb[1]; id.data[i + 2] = rgb[2];
      id.data[i + 3] = Math.max(0, rnd() * 2 - 0.9) * alpha * 255;
    }
    ng.putImageData(id, 0, 0); g.drawImage(n, -cell * 1.5, -cell * 1.5, n.width * cell, n.height * cell);
  };
  blot(150, [74, 68, 46], 0.85);       // 흙빛
  blot(60, [70, 64, 44], 0.35);
  blot(44, [36, 56, 38], 0.45);        // 짙은 이끼
  blot(7, [18, 28, 18], 0.22);         // 잔 무늬
  blot(5, [128, 146, 96], 0.09);
  for (let i = 0; i < 46; i++) {       // 나뭇잎 사이로 떨어지는 빛 얼룩
    const x = rnd() * FW, y = rnd() * FH, r = 34 + rnd() * 70, a = 0.07 + rnd() * 0.17;
    g.save(); g.translate(x, y); g.scale(1.5, 0.6);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
    gr.addColorStop(0, 'rgba(126,146,82,' + a + ')'); gr.addColorStop(1, 'rgba(126,146,82,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill(); g.restore();
  }
  const edge = (x0, y0, x1, y1) => {   // 가장자리는 나무 그늘로 어둡게
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, 'rgba(7,12,8,0.72)'); gr.addColorStop(0.5, 'rgba(7,12,8,0.22)'); gr.addColorStop(1, 'rgba(7,12,8,0)');

}

  if (R.advanceT >= 0) { R.advanceT -= dt; if (R.advanceT < 0 && S.auto && S.stage < 10 && S.maxStage > S.stage) gotoStage(S.stage + 1); }
  // 새 몬스터
  const alive = R.mons.filter(m => !m.dead).length, sp = monSprites[S.stage];
  if (sp && sp.ready && !k.dead) {
    if (stDef.boss) {
      if (R.bossWait > 0) R.bossWait -= dt;
      else if (alive === 0) spawnMonster();
    } else if (alive < TUNE.ON_SCREEN) {
      R.spawnT -= dt;
      if (R.spawnT <= 0) { spawnMonster(); R.spawnT = alive < 3 ? 0.45 : rand(TUNE.RESPAWN[0], TUNE.RESPAWN[1]); }
    }
  }
  // 기사
  k.atkT = Math.max(0, k.atkT - dt); k.lunge = Math.max(0, k.lunge - dt); k.flash = Math.max(0, k.flash - dt);
  k.moving = false;
  if (k.dead) {
    k.reviveT -= dt;
    if (k.reviveT <= 0) { k.dead = false; k.hp = kMax(); k.atkT = 0.4; }
  } else {
    k.hp = Math.min(kMax(), k.hp + kMax() * TUNE.REGEN * dt);
    if (!k.target || k.target.dead) {
      let best = null, bd = 1e9;
      for (const m of R.mons) if (!m.dead && m.born > 0.25) { const d = Math.hypot(m.x - k.x, (m.y - k.y) * 1.4); if (d < bd) { bd = d; best = m; } }
      k.target = best;
    }
    const m = k.target;
    if (m) {
      const side = k.x <= m.x ? -1 : 1;
      k.face = -side;                                   // face: 1이면 오른쪽을 본다
      if (!inRange(m)) k.moving = moveTo(k, clamp(m.x + side * reachOf(m) * 0.9, BOUND.x0, BOUND.x1), clamp(m.y, BOUND.y0, BOUND.y1), TUNE.KNIGHT_SPEED, dt);
      else if (k.atkT <= 0) {
        k.atkT = TUNE.ATK_INTERVAL; k.lunge = 0.24;
        const crit = Math.random() < kCrit();
        const dmg = Math.min(TUNE.DMG_CAP, Math.round(kAtk() * (crit ? TUNE.CRIT_MULT : 1)));
        m.hp -= dmg; m.flash = 0.16; m.kbx = -side * (m.def.boss ? 40 : 190);
        addFloat(m.x + rand(-24, 24), m.y - m.h * 0.75 - (m.def.fly || 0), fmt(dmg) + (crit ? '!' : ''), crit ? '#f5a03c' : '#f1ead4', crit ? 54 : 36, crit ? 1.0 : 0.8);
        if (m.hp <= 0) killMonster(m);
      }
    }
  }
  // 발밑 효과
  if (S.cos.foot !== 'none' && !k.dead) {
    k.stepT -= dt * (k.moving ? 1 : 0.35);
    if (k.stepT <= 0) {
      k.stepT = S.cos.foot === 'leaf' ? 0.13 : 0.1;
      R.parts.push({ kind:S.cos.foot, x:k.x + rand(-30, 30), y:k.y + rand(-6, 8), vx:rand(-22, 22), vy:S.cos.foot === 'leaf' ? rand(-36, -14) : rand(-64, -30), t:0, life:rand(0.6, 1.1), r:rand(0, 6.28) });
    }
  }
  for (const p of R.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'leaf') p.vy += 60 * dt; }
  R.parts = R.parts.filter(p => p.t < p.life);
  // 몬스터
  let slots = 0;
  for (const m of R.mons) { if (m.dead) m.slot = false; if (m.slot) slots++; }
  while (slots < TUNE.MAX_ATTACKERS) {                 // 가까운 순서로 덤빌 차례를 준다. 나머지는 한 발 물러서 둘러싼다
    let best = null, bd = 1e9;
    for (const m of R.mons) if (!m.dead && !m.slot) { const d = Math.hypot(m.x - k.x, m.y - k.y); if (d < bd) { bd = d; best = m; } }
    if (!best) break; best.slot = true; slots++;
  }
  for (const m of R.mons) {
    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);
    if (m.dead) { m.deadT += dt; continue; }
    m.born += dt;
    m.x += m.kbx * dt; m.kbx *= Math.exp(-9 * dt);
    if (!k.dead) {
      const side = m.x >= k.x ? 1 : -1; m.face = -side;
      const near = m.slot || m === k.target, rr = reachOf(m) * (near ? 1 : TUNE.WAIT_RING);
      if (!near) moveTo(m, k.x + Math.cos(m.ang) * rr, k.y + Math.sin(m.ang) * rr * 0.8, m.spd, dt);
      else if (!inRange(m, 18)) moveTo(m, k.x + Math.cos(m.ang) * rr, k.y + Math.sin(m.ang) * rr * RING_Y, m.spd, dt);
      if (inRange(m)) {
        if (m.slot) {
          m.cd -= dt;
          if (m.cd <= 0) {
            m.cd = m.def.boss ? TUNE.BOSS_ATK_INTERVAL : TUNE.MON_ATK_INTERVAL; m.lunge = 0.26;
            k.hp -= m.atk; k.flash = 0.16;
            addFloat(k.x - m.face * 20 + rand(-14, 14), k.y - ks.h * 0.72, '-' + fmt(m.atk), '#d9907c', 32, 0.8);
            if (k.hp <= 0) {
              k.hp = 0; k.dead = true; k.reviveT = TUNE.REVIVE; k.target = null;
              if (m.def.boss) { bossFail('기사가 쓰러졌다'); return; }
            }
          }
        }
      }
    }
    for (const o of R.mons) if (o !== m && !o.dead) {          // 서로 겹치지 않게 살짝 민다
      const dx = m.x - o.x, dy = (m.y - o.y) * 1.6, d = Math.hypot(dx, dy), min = (m.w + o.w) * 0.42;
      if (d < min && d > 0.01) {
        const p = (min - d) / min * 150 * dt; m.x += dx / d * p; m.y += dy / d * p;
        m.ang += (Math.atan2(m.y - k.y, m.x - k.x) - m.ang) * Math.min(1, dt * 2) * (Math.abs(Math.atan2(m.y - k.y, m.x - k.x) - m.ang) < 1.5 ? 1 : 0);
      }
    }
    m.x = clamp(m.x, BOUND.x0 - 10, BOUND.x1 + 10); m.y = clamp(m.y, BOUND.y0 - 10, BOUND.y1 + 10);
  }
  R.mons = R.mons.filter(m => !(m.dead && m.deadT > 0.7));
  // 보스 시간
  if (stDef.boss && !k.dead) {
    const boss = R.mons.find(m => m.def.boss && !m.dead);
    if (boss && boss.born > 0.4) { R.bossT -= dt; if (R.bossT <= 0) { bossFail('시간이 다 됐다'); return; } }
  }
  for (const f of R.floats) f.t += dt;
  R.floats = R.floats.filter(f => f.t < f.life);
  if (R.banner) { R.banner.t += dt; if (R.banner.t > 2.2) R.banner = null; }
}

/* ===================================================================== 그리기 */
function drawShadow(g, x, y, rx, ry, a) {
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(0, 0, 0.1, 0, 0, 1);
  gr.addColorStop(0, 'rgba(6,11,8,' + a + ')'); gr.addColorStop(0.6, 'rgba(6,11,8,' + a * 0.7 + ')'); gr.addColorStop(1, 'rgba(6,11,8,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill(); g.restore();
}
function drawSprite(g, sp, x, y, o) {     // o: flip, sx, sy, rot, alpha, flash, dx
  g.save(); g.translate(x + (o.dx || 0), y); if (o.rot) g.rotate(o.rot);
  g.scale((o.flip ? -1 : 1) * (o.sx || 1), o.sy || 1);
  g.globalAlpha = o.alpha == null ? 1 : o.alpha;
  g.drawImage(sp.c, -sp.w / 2, -sp.h * 0.96, sp.w, sp.h);
  if (o.flash > 0) { g.globalAlpha *= Math.min(1, o.flash); g.drawImage(sp.f, -sp.w / 2, -sp.h * 0.96, sp.w, sp.h); }
  g.restore();
}
function glow(g, x, y, r, color, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function outlined(g, txt, x, y, size, color, align) {
  g.font = '700 ' + size + 'px ' + FONT; g.textAlign = align || 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(4, size * 0.16); g.strokeStyle = 'rgba(10,14,10,0.9)';
  g.strokeText(txt, x, y); g.fillStyle = color; g.fillText(txt, x, y);
}
function drawKnight(g, sp, x, y, face, t, opt) {   // 들판과 꾸미기 미리보기가 함께 쓴다
  const sc = opt.scale || 1, flip = face > 0, breath = 1 + Math.sin(t * 2.6) * 0.012;
  g.save(); g.translate(x, y); g.scale(sc, sc);
  drawSprite(g, sp, 0, 0, { flip, sy:breath, sx:1 / Math.sqrt(breath), rot:opt.rot, alpha:opt.alpha, flash:opt.flash, dx:opt.dx });
  if (!opt.rot) {                                    // 허리의 등불 빛
    const lx = (sp.lantern[0] - 0.5) * sp.w * (flip ? -1 : 1) + (opt.dx || 0), ly = -sp.h * 0.96 + sp.lantern[1] * sp.h;
    const fl = 0.85 + Math.sin(t * 7.3) * 0.08 + Math.sin(t * 13.1) * 0.05, col = lanternColor();
    glow(g, lx, ly, 44, col, 0.5 * fl * (opt.alpha == null ? 1 : opt.alpha)); glow(g, lx, ly, 9, '#fff3d6', 0.9 * fl * (opt.alpha == null ? 1 : opt.alpha));
  }
  g.restore();
}
function drawPart(g, p) {
  const a = 1 - p.t / p.life;
  g.save(); g.translate(p.x, p.y);
  if (p.kind === 'leaf') { g.rotate(p.r + p.t * 3); g.globalAlpha = a * 0.9; g.fillStyle = '#8fae5e'; g.beginPath(); g.ellipse(0, 0, 9, 4, 0, 0, 7); g.fill(); }
  else { g.globalAlpha = a; g.fillStyle = lanternColor(); g.beginPath(); g.arc(0, 0, 3.4, 0, 7); g.fill(); glow(g, 0, 0, 12, lanternColor(), a * 0.5); }
  g.restore();
}
function bar(g, x, y, w, h, ratio, fill) {
  g.fillStyle = 'rgba(8,12,8,0.85)'; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.fillStyle = '#2a2a20'; g.fillRect(x, y, w, h);
  g.fillStyle = fill; g.fillRect(x, y, w * clamp(ratio, 0, 1), h);
}
function draw() {
  const g = ctx, k = R.k, ks = getKnightSprite();
  g.setTransform(viewQ, 0, 0, viewQ, 0, 0);
  g.drawImage(bg, 0, 0);
  if (R.paused) return;
  const list = R.mons.slice().sort((a, b) => a.y - b.y);
  // 그림자 먼저
  for (const m of list) {
    const a = Math.min(1, m.born / 0.4) * (m.dead ? Math.max(0, 1 - m.deadT / 0.5) : 1), f = m.def.fly ? 0.75 : 1;
    drawShadow(g, m.x, m.y, m.w * 0.46 * f, m.h * 0.085, (m.def.fly ? 0.4 : 0.6) * a);
  }
  drawShadow(g, k.x, k.y, ks.w * 0.5, ks.h * 0.08, k.dead ? 0.35 : 0.6);
  for (const p of R.parts) drawPart(g, p);
  // y 순서대로
  const ents = list.map(m => ({ y:m.y, m })); ents.push({ y:k.y + 0.5, k:true }); ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    if (e.k) {
      const lunge = k.lunge > 0 ? Math.sin((1 - k.lunge / 0.24) * Math.PI) * 26 * k.face : 0;
      const walk = k.moving ? Math.abs(Math.sin(R.t * 11)) * -5 : 0;
      if (k.dead) drawKnight(g, ks, k.x, k.y, k.face, 0, { rot:-k.face * 1.35 * Math.min(1, (TUNE.REVIVE - k.reviveT) / 0.35), alpha:0.75 });
      else drawKnight(g, ks, k.x, k.y + walk, k.face, R.t, { dx:lunge, flash:k.flash / 0.16 * 0.8 });
      continue;
    }
    const m = e.m, sp = monSprites[m.st]; if (!sp || !sp.ready) continue;
    const lift = m.def.fly ? m.def.fly + Math.sin(R.t * 3.2 + m.ph) * 9 : 0;
    const br = 1 + Math.sin(R.t * 2.4 + m.ph) * 0.016, lunge = m.lunge > 0 ? Math.sin((1 - m.lunge / 0.26) * Math.PI) * 24 * m.face : 0;
    let alpha = Math.min(1, m.born / 0.4), rot = 0, sink = 0;
    if (m.dead) { const q = Math.min(1, m.deadT / 0.55); alpha = 1 - q; rot = m.gone ? 0 : -m.face * q * 0.5; sink = q * 14 + lift * q; }
    drawSprite(g, sp, m.x, m.y - lift + sink, { flip:m.face > 0, sy:br, sx:1 / Math.sqrt(br), rot, alpha, flash:m.flash / 0.16 * 0.85, dx:lunge });
    if (!m.dead && !m.def.boss && m.hp < m.max) bar(g, m.x - 45, m.y - m.h - (m.def.fly || 0) - 20, 90, 9, m.hp / m.max, '#b9735f');
  }
  // 이름과 칭호
  if (!k.dead) {
    const ty = k.y - ks.h - 26, tt = titleText();
    outlined(g, S.name, k.x, ty, 28, '#ece2c6');
    if (tt) outlined(g, tt, k.x, ty - 32, 24, '#e8b25a');
  } else outlined(g, Math.ceil(k.reviveT) + '초 뒤에 다시 일어난다', k.x, k.y - 120, 32, '#ece2c6');
  for (const f of R.floats) {
    const q = f.t / f.life; g.globalAlpha = q < 0.7 ? 1 : 1 - (q - 0.7) / 0.3;
    const pop = f.t < 0.12 ? 1.3 - f.t / 0.12 * 0.3 : 1;
    outlined(g, f.txt, f.x, f.y - q * 70, f.size * pop, f.color);
  }
  g.globalAlpha = 1;
  // 보스 체력과 남은 시간
  const boss = R.mons.find(m => m.def.boss && !m.dead);
  if (boss) {
    outlined(g, '우두머리 · ' + boss.def.name, 100, 44, 32, '#ece2c6', 'left');
    outlined(g, '남은 시간 ' + Math.ceil(Math.max(0, R.bossT)) + '초', 800, 44, 32, R.bossT < 10 ? '#e8943a' : '#ece2c6', 'right');
    bar(g, 100, 74, 700, 26, boss.hp / boss.max, '#b9735f');
    outlined(g, fmt(Math.max(0, boss.hp)) + ' / ' + fmt(boss.max), 450, 88, 24, '#ece2c6');
  }
  if (R.banner) {
    const b = R.banner, a = b.t < 0.25 ? b.t / 0.25 : b.t > 1.7 ? Math.max(0, 1 - (b.t - 1.7) / 0.5) : 1;
    g.globalAlpha = a; g.fillStyle = 'rgba(10,15,10,0.72)'; g.fillRect(0, 150, FW, b.sub ? 130 : 90);
    outlined(g, b.text, 450, 195, 46, '#ece2c6'); if (b.sub) outlined(g, b.sub, 450, 248, 30, '#e8b25a');
    g.globalAlpha = 1;
  }
  if (DEBUG) outlined(g, 'debug x' + SPEED + '  N:넘기기 G:골드', 890, 975, 20, '#a79e83', 'right');
}

const UP_INFO = {

};

      b.className = 'opt' + (S.cos[grp.key] === it.id ? ' sel' : '') + (open ? '' : ' lock');
      b.innerHTML = (it.color ? '<span class="dot" style="background:' + it.color + '"></span>' : '') +
        '<span><div class="on">' + it.name + '</div><div class="oh">' + (open ? (S.cos[grp.key] === it.id ? '쓰는 중' : '고를 수 있음') : '잠김 · ' + it.how) + '</div></span>';
      b.onclick = () => { if (!it.ok(S)) return; S.cos[grp.key] = it.id; knightSprite = null; buildCos(); save(); };
      grid.appendChild(b);
    }
  }
}
function drawCosPreview(t) {
  const c = $('cosPrev'), g = c.getContext('2d'), sp = getKnightSprite(), sc = 1.6;
  g.drawImage(bg, 250, 420, 400, 480, 0, 0, 400, 480);
  drawShadow(g, 200, 425, sp.w * sc * 0.5, 24, 0.6);
  if (S.cos.foot !== 'none') for (let i = 0; i < 7; i++) {
    const q = (t * 0.8 + i / 7) % 1;
    drawPart(g, { kind:S.cos.foot, x:200 + Math.sin(i * 2.4) * 80, y:430 - q * (S.cos.foot === 'leaf' ? 40 : 90), t:q, life:1, r:i });
  }
  drawKnight(g, sp, 200, 425, -1, t, { scale:sc });
  const tt = titleText();
  outlined(g, S.name, 200, 58, 34, '#ece2c6'); if (tt) outlined(g, tt, 200, 24, 26, '#e8b25a');
}
function buildDex() {
  const box = $('dexList'); box.innerHTML = '';
  MONSTERS.forEach((m, i) => {
    const st = i + 1, n = S.kills[st] || 0, seen = n > 0, d = document.createElement('div');
    d.className = 'dex' + (seen ? '' : ' un');
    d.innerHTML = '<div class="pic"><img alt="" src="art/monsters/' + encodeURIComponent(m.file) + '.png"></div><div>' +
      '<div class="dn"><small>' + ZONE + '-' + st + (m.boss ? ' 보스' : '') + '</small>' + (seen ? m.name : '???') + '</div>' +
      '<div class="dt">' + (seen ? m.trait : '아직 잡지 못했다.') + '</div>' +
      '<div class="dl">' + (seen ? '전리품: ' + m.loot + ' ' + (S.loot[st] || 0) + '개 · 잡은 수 ' + fmt(n) : '전리품: ???') + '</div></div>';
    box.appendChild(d);
  });
}
function redrawStatic() { if (!$('start').classList.contains('hidden')) drawStartPreviews(); }

/* 쉬는 동안 모은 골드 */
function offlineReward(sec) {
  if (!S.started || sec < 60) return;
  const g = Math.floor(Math.min(sec, TUNE.OFFLINE_CAP_H * 3600) / TUNE.OFFLINE_SEC_PER_KILL) * goldOf(Math.min(S.stage, 9));
  if (g <= 0) return;
  S.gold += g; save(); refreshPanel();
  showCard('<h3>다녀왔습니다</h3><p>쉬는 동안 골드를 모았다.</p><p><b>+' + fmt(g) + ' 골드</b></p><p class="small">최대 ' + TUNE.OFFLINE_CAP_H + '시간까지 쌓입니다.</p>', [{ text:'받기', acc:true }]);
}

/* ===================================================================== 시작 */
function fit() {
  const s = Math.min(innerWidth / 900, innerHeight / 1600);
  $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  viewQ = clamp(s * (window.devicePixelRatio || 1), 1, 2);
  cv.width = Math.round(FW * viewQ); cv.height = Math.round(FH * viewQ);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
}
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;      // 탭이 가려졌다 돌아와도 튀지 않게
  if (!R.paused) {
    for (let i = 0; i < SPEED; i++) update(dt);
    R.saveT += dt; if (R.saveT > TUNE.SAVE_EVERY) { R.saveT = 0; save(); }
    R.uiT += dt; if (R.uiT > 0.15) { R.uiT = 0; refreshPanel(); }
  }
  draw();
  if (!$('cos').classList.contains('hidden')) drawCosPreview(t / 1000);
}
function init() {
  cv = $('cv'); ctx = cv.getContext('2d');
  load(); bg = makeBackground(); fit(); addEventListener('resize', fit);
  loadKnightImages(); for (let i = 1; i <= 10; i++) loadMonster(i);

  $('bPrev').onclick = () => { if (S.stage > 1) gotoStage(S.stage - 1); };
  $('bNext').onclick = () => { if (S.stage < S.maxStage) gotoStage(S.stage + 1); };
  $('auto').onclick = () => { S.auto = !S.auto; if (S.auto && R.progress >= TUNE.KILLS_TO_CLEAR && S.stage < 10) R.advanceT = 0.3; refreshPanel(); };
  $('bCos').onclick = () => { buildCos(); $('cos').classList.remove('hidden'); };
  $('bDex').onclick = () => { buildDex(); $('dex').classList.remove('hidden'); };
  $('bSet').onclick = showSettings;
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).classList.add('hidden'));
  document.querySelectorAll('.gBtn').forEach(b => b.onclick = () => { startGender = b.dataset.g; drawStartPreviews(); });
  $('goBtn').onclick = startGame;
  $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  // 강화 단추: 누르고 있으면 계속 산다
  document.querySelectorAll('.up').forEach(b => {
    let h1 = 0, h2 = 0;
    const stop = () => { clearTimeout(h1); clearInterval(h2); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); stop(); buy(b.dataset.k); h1 = setTimeout(() => { h2 = setInterval(() => { if (!buy(b.dataset.k)) stop(); }, 90); }, 420); });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, stop);
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (S.started) save(); }
    else if (hiddenAt) { offlineReward((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
  });
  addEventListener('pagehide', () => { if (S.started) save(); });

  if (DEBUG) {
    window.__g = { get S() { return S; }, R, TUNE, buy, gotoStage };
    addEventListener('keydown', e => {
      if (e.target === $('nameIn') || R.paused) return;
      if (e.key === 'n' || e.key === 'N') {             // 스테이지 넘기기
        if (S.stage === 10) { const b = R.mons.find(m => m.def.boss && !m.dead); if (b) { b.hp = 0; killMonster(b); } }
        else { S.maxStage = Math.max(S.maxStage, S.stage + 1); S.kills[S.stage] = S.kills[S.stage] || 1; gotoStage(S.stage + 1); }
      }
      if (e.key === 'g' || e.key === 'G') { S.gold += 1000; refreshPanel(); }
    });
  }

  if (S.started) {
    const away = (Date.now() - (S.last || Date.now())) / 1000;
    R.paused = false; R.k.hp = kMax(); gotoStage(S.stage); offlineReward(away);
  } else openStart();
  refreshPanel();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
init();
</script>
</body>
</html>
