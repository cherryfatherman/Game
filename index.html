<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잊혀진 기사 키우기</title>
<style>
:root{
  --panel:#1c261b; --panel2:#2a2318; --box:#263324; --line:#5a5540; --hud:rgba(15,21,14,.68); --hudline:rgba(150,140,100,.42);
  --cream:#ece2c6; --dim:#aaa187; --acc:#e8943a; --red:#b9735f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a07;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
  color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:900px;height:1600px;transform-origin:center center;background:#0d120d;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:900px;height:1600px;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
.hidden{display:none!important}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hud{background:var(--hud);border:2px solid var(--hudline);border-radius:18px}
.coin{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3c777,#b9802f);border:3px solid #7a5420;flex:none}

/* 늘 떠 있는 것(HUD): 판을 깔지 않는다. 글자 그림자와 가는 고리로만 읽히게 한다 */
#mini,#stagePill,#cur,#tr,#log,#autoSk,.skill{--ts:0 2px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.75);text-shadow:var(--ts)}
#mini svg,#stagePill svg,#cur svg,#tr svg,#log svg,.skill svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
#stagePill:active,.mBtn:active,.skill:active,#autoSk:active,#logBtn:active,#hintUp:active,#hintTog:active{filter:brightness(1.6)}

/* 왼쪽 위: 둥근 작은 지도와 스테이지 */
#mini{position:absolute;left:16px;top:16px;width:170px;height:170px;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#mini canvas{width:170px;height:170px;display:block}
#stagePill{position:absolute;left:10px;top:192px;height:84px;padding:0 20px;z-index:5;display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700;border-radius:42px;background:rgba(8,12,8,.28)}
#stagePill b{color:var(--acc)}
#stagePill svg{font-size:28px;color:var(--dim)}

/* 위 가운데: 골드와 전리품 */
#cur{position:absolute;left:196px;top:28px;width:316px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:32px;font-weight:700;z-index:5;pointer-events:none}
#cur .coin{box-shadow:0 2px 5px rgba(0,0,0,.8)}
#cur svg{font-size:32px;color:var(--dim);margin-left:22px}

/* 오른쪽 위: 메뉴와 할 일 */
#tr{position:absolute;right:8px;top:8px;width:380px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:5;pointer-events:none}
#menu,#menu2{display:flex;gap:2px;pointer-events:auto}
.mBtn{width:92px;height:108px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:23px;font-weight:600}
.mBtn svg{font-size:52px}
.mBtn.on{color:var(--acc)}
#hint{pointer-events:auto;width:372px;margin:6px 6px 0 0;padding:0 14px 10px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(8,12,8,.5),rgba(8,12,8,.16));border-left:4px solid var(--acc);text-align:left}
#hintTog{width:100%;height:50px;display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:700;color:var(--acc)}
#hintTog svg{font-size:26px;color:var(--dim)}
#hintGoal{font-size:24px;line-height:34px;font-weight:600}
#hintUp{display:flex;align-items:center;gap:8px;height:60px;margin-top:4px;font-size:26px;font-weight:700;color:var(--acc)}
#hintUp svg{font-size:30px}
#hint.off{width:auto;padding:0 12px 0 14px} #hint.off #hintBody{display:none} #hint.off #hintTog{gap:10px} #hint.off #hintTog svg{transform:rotate(-90deg)}

/* 오른쪽 아래: 엄지가 닿는 자리에 둥글게 모은 스킬 */
.skill{position:absolute;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 32%,rgba(46,60,40,.6),rgba(8,12,8,.6));box-shadow:0 0 0 3px rgba(236,226,198,.3),0 4px 12px rgba(0,0,0,.6)}
.skill svg{font-size:.5em;color:var(--cream)}
.skill.ready{box-shadow:0 0 0 3px rgba(232,148,58,.95),0 0 18px rgba(232,148,58,.5),0 4px 12px rgba(0,0,0,.6)}
.skill.cool svg{opacity:.22}
.skill.lock{opacity:.5} .skill.lock svg{font-size:.32em;color:var(--dim)}
.skill .cd{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;pointer-events:none}
#autoSk{position:absolute;right:30px;bottom:334px;width:92px;height:92px;border-radius:50%;z-index:5;font-size:25px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;
  color:var(--dim);background:rgba(8,12,8,.45);box-shadow:0 0 0 3px rgba(236,226,198,.25),0 4px 12px rgba(0,0,0,.6)}
#autoSk small{font-size:21px;font-weight:700}
#autoSk.on{color:var(--acc);box-shadow:0 0 0 4px var(--acc),0 0 20px rgba(232,148,58,.55),0 4px 12px rgba(0,0,0,.6)}

/* 아래: 기사 체력, 잡은 수, 기록 */
#log{position:absolute;left:16px;bottom:12px;width:550px;z-index:5;display:flex;flex-direction:column;pointer-events:none}
#logTop{display:flex;align-items:center;gap:16px}
#logBars{flex:1}
#face{width:120px;height:120px;flex:none;border-radius:50%;overflow:hidden;background:#10160f;box-shadow:0 0 0 3px var(--acc),0 5px 14px rgba(0,0,0,.75);transition:box-shadow .3s,filter .3s}
#face img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.1)}
#face.hit{box-shadow:0 0 0 5px #ff4a3a,0 0 24px rgba(255,74,58,.85),0 5px 14px rgba(0,0,0,.75);transition:none}
#face.down{filter:grayscale(1) brightness(.55)}
#hpBar{height:32px;border-radius:16px;background:rgba(8,12,8,.62);position:relative;overflow:hidden;box-shadow:0 0 0 2px rgba(236,226,198,.3),0 3px 8px rgba(0,0,0,.6)}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:16px;background:linear-gradient(#a3c072,#6f8c4b)}
#hpFill.low{background:linear-gradient(#d98a6c,#a8563f)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:32px;text-align:center;font-size:23px;font-weight:700}
#progLine{height:6px;margin:9px 6px 0;border-radius:3px;background:rgba(8,12,8,.55)} #progFill{height:100%;width:0;border-radius:3px;background:var(--acc)}
#logIn{display:flex;align-items:flex-end;margin-top:6px;border-radius:16px}
#log.open #logIn{background:rgba(8,12,8,.62)}
#logLines{flex:1;margin:4px 0 4px 10px;height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log.open #logLines{height:304px}
#logLines div{font-size:25px;line-height:38px;height:38px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
#logLines .tg{font-weight:700;margin-right:8px}
#logLines .a .tg{color:var(--acc)} #logLines .g .tg{color:#e9c376} #logLines .b .tg{color:#e07a62} #logLines .d .tg{color:var(--dim)} #logLines .l .tg{color:#b9c9a0}
#logBtn{width:84px;height:84px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;color:var(--cream);pointer-events:auto}
#log.open #logBtn svg{transform:rotate(180deg)}
#toast{position:absolute;left:50%;bottom:520px;transform:translateX(-50%);padding:16px 30px;font-size:32px;font-weight:600;border-radius:40px;z-index:6;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:rgba(10,14,10,.8)}

/* 아래에서 올라오는 판 */
#sheetWrap{position:absolute;inset:0;background:rgba(4,7,4,.4);z-index:10}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:1240px;display:flex;flex-direction:column;background:rgba(24,32,23,.97);
  border-top:3px solid var(--line);border-radius:30px 30px 0 0}
#sheetHead{display:flex;align-items:center;padding:18px 22px 14px 30px;flex:none}
#sheetHead h2{flex:1;margin:0;font-size:42px}
#sheetBody{overflow-y:auto;padding:6px 24px 40px;-webkit-overflow-scrolling:touch}
.btn{min-height:84px;padding:0 30px;font-size:32px;font-weight:600;background:var(--panel2);border:3px solid var(--line);border-radius:16px}
.btn:active{background:#463a26;transform:translateY(2px)}
.btn.acc{background:var(--acc);border-color:#a8641f;color:#22170a} .btn.acc:active{background:#c97a2a}
.btn:disabled{opacity:.35}
.up{display:flex;align-items:center;width:100%;height:116px;margin-top:12px;padding:0 24px;background:var(--panel2);border:3px solid var(--line);border-radius:18px;text-align:left}
.up:active{background:#463a26;transform:translateY(2px)}
.up .un{width:300px;font-size:36px;font-weight:700}
.up .un small{font-size:28px;font-weight:400;color:var(--dim);margin-left:10px}
.up .ue{flex:1;font-size:32px}
.up .upp{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700;color:var(--acc);min-width:170px;justify-content:flex-end}
.up.no{opacity:.45} .up.no .upp{color:var(--dim)}
.note{font-size:28px;line-height:1.5;color:var(--dim);margin:16px 6px 0}
.sec{margin:30px 0 12px;font-size:34px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:108px;padding:12px 20px;background:var(--panel);border:3px solid var(--line);border-radius:16px;text-align:left;display:flex;align-items:center;gap:16px}
.opt:active{background:#33432f}
.opt .on{font-size:33px;font-weight:700} .opt .oh{font-size:25px;color:var(--dim);margin-top:4px}
.opt.sel{border-color:var(--acc);background:#2c3a28} .opt.lock{opacity:.5}
.opt svg{font-size:36px;color:var(--dim)}
.dot{width:40px;height:40px;border-radius:50%;flex:none;border:3px solid #0008}
#cosPrev{width:100%;height:540px;border-radius:20px;border:3px solid var(--line);display:block}
#cosTabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.cTab{height:84px;font-size:27px;font-weight:700;border-radius:14px;background:var(--panel);border:3px solid var(--line)}
.cTab:active{background:#33432f} .cTab.sel{border-color:var(--acc);color:var(--acc);background:#2c3a28}
#cosGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cCard{position:relative;height:300px;border-radius:18px;background:var(--panel);border:3px solid var(--line);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 6px 10px}
.cCard:active{background:#33432f}
.cCard canvas,.cCard .big{position:absolute;left:0;top:0;width:100%;height:214px}
.cCard .big{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--acc);padding:0 12px;text-align:center}
.cCard .big .dot{width:92px;height:92px}
.cCard .cn{font-size:26px;font-weight:700;white-space:nowrap} .cCard .ch{font-size:21px;color:var(--dim);margin-top:2px;white-space:nowrap}
.cCard.sel{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc);background:#2c3a28} .cCard.sel .ch{color:var(--acc)}
.cCard.lock{opacity:.45}
#cosNote{flex:1;font-size:28px;line-height:1.5;color:var(--dim);background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:22px}
#cosNote b{color:var(--cream);font-size:32px}
.dex{display:flex;gap:20px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.dex .pic{width:140px;height:140px;flex:none;background:#2f4230;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dex img{width:130px;height:130px;object-fit:contain}
.dex.un img{filter:brightness(0);opacity:.55}
.dex .dn{font-size:34px;font-weight:700} .dex .dn small{font-size:27px;color:var(--acc);margin-right:12px}
.dex .dt{font-size:28px;line-height:1.4;margin:6px 0} .dex .dl{font-size:27px;color:var(--dim)}
.toggle{display:flex;align-items:center;width:100%;min-height:96px;padding:0 24px;font-size:34px;font-weight:700;background:var(--panel2);border:3px solid var(--line);border-radius:18px}
.toggle span{flex:1;text-align:left} .toggle b{color:var(--dim)} .toggle.on{border-color:var(--acc)} .toggle.on b{color:var(--acc)}
.toggle:active{background:#463a26}

/* 가운데 뜨는 카드 */
.modal{position:absolute;inset:0;background:rgba(5,8,5,.78);display:flex;align-items:center;justify-content:center;z-index:20}
.card{width:740px;background:var(--panel2);border:4px solid var(--line);border-radius:24px;padding:46px 44px;text-align:center}
.card h3{margin:0 0 26px;font-size:44px;color:var(--acc)}
.card p{margin:14px 0;font-size:36px;line-height:1.5}
.card .small{font-size:30px;color:var(--dim)}
.card .btns{display:flex;gap:20px;justify-content:center;margin-top:36px}
.card .btn{font-size:36px;padding:0 44px}
#lowOv{position:absolute;inset:0;background:rgba(0,0,0,.74);z-index:30;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--dim);text-align:center;line-height:1.6}

/* 시작 화면 */
#start{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(rgba(8,12,9,.5) 0,rgba(8,12,9,.05) 200px,rgba(8,12,9,.05) 430px,#0e140e 620px),url('art/ui/영웅-얼굴.png') center top/900px 900px no-repeat,#0e140e}
#start h1{margin:56px 0 8px;font-size:78px;letter-spacing:2px;text-shadow:0 4px 6px #000,0 0 26px #000,0 0 50px rgba(0,0,0,.8)}
#start .sub{font-size:32px;color:var(--cream);margin-bottom:412px;text-shadow:0 2px 4px #000,0 0 16px #000}
#gPick{display:flex;gap:36px}
.gBtn{width:300px;height:430px;background:var(--panel);border:4px solid var(--line);border-radius:22px;font-size:36px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px}
.gBtn canvas{width:260px;height:330px}
.gBtn.sel{border-color:var(--acc);background:#2c3a28}
.gBtn:active{filter:brightness(1.2)}
#start label{font-size:32px;color:var(--dim);margin:40px 0 14px}
#nameIn{width:460px;height:92px;font:inherit;font-size:44px;text-align:center;color:var(--cream);background:#10160f;
  border:4px solid var(--line);border-radius:16px;outline:none;user-select:text;-webkit-user-select:text}
#nameIn:focus{border-color:var(--acc)}
#goBtn{margin-top:44px;width:460px;height:110px;font-size:46px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="mini"><canvas id="miniCv" width="340" height="340"></canvas></div>
  <button id="stagePill"><span id="pillName"></span><b id="pillProg"></b><span data-ic="down"></span></button>
  <div id="cur"><span class="coin"></span><span id="goldTxt">0</span><span data-ic="bag"></span><span id="lootTxt">0</span></div>

  <div id="tr">
    <div id="menu">
      <button class="mBtn" data-open="up"><span data-ic="up"></span>강화</button>
      <button class="mBtn" data-open="cos"><span data-ic="cloak"></span>꾸미기</button>
      <button class="mBtn" data-open="dex"><span data-ic="book"></span>도감</button>
      <button class="mBtn" id="bMore"><span data-ic="more"></span>더보기</button>
    </div>
    <div id="menu2" class="hidden">
      <button class="mBtn" data-open="set"><span data-ic="gear"></span>설정</button>
      <button class="mBtn" id="bJournal"><span data-ic="page"></span>일지</button>
      <button class="mBtn" id="bLow"><span data-ic="moon"></span>절전</button>
    </div>
    <div id="hint">
      <button id="hintTog"><span>할 일</span><span data-ic="down"></span></button>
      <div id="hintBody"><div id="hintGoal"></div><button id="hintUp" class="hidden"><span data-ic="up"></span>강화할 수 있어요</button></div>
    </div>
  </div>

  <button id="autoSk">자동<small></small></button>
  <div id="skills"></div>

  <div id="log">
    <div id="logTop">
      <div id="face"><img src="art/ui/영웅-얼굴-256.png" alt=""></div>
      <div id="logBars"><div id="hpBar"><div id="hpFill"></div><div id="hpTxt"></div></div><div id="progLine"><div id="progFill"></div></div></div>
    </div>
    <div id="logIn"><div id="logLines"></div><button id="logBtn"><span data-ic="upArrow"></span></button></div>
  </div>
  <div id="toast" style="opacity:0"></div>

  <div id="sheetWrap" class="hidden">
    <div id="sheet">
      <div id="sheetHead"><h2 id="sheetTitle"></h2><button class="btn" id="sheetClose">닫기</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="start" class="hidden">
    <h1>잊혀진 기사 키우기</h1>
    <div class="sub">기사를 고르고 이름을 지어 주세요.</div>
    <div id="gPick">
      <button class="gBtn" data-g="m"><canvas width="520" height="660"></canvas>남자 기사</button>
      <button class="gBtn" data-g="f"><canvas width="520" height="660"></canvas>여자 기사</button>
    </div>
    <label for="nameIn">기사 이름</label>
    <input id="nameIn" maxlength="8" value="루" autocomplete="off" spellcheck="false">
    <button class="btn acc" id="goBtn">시작</button>
  </div>

  <div class="modal hidden" id="modal"><div class="card" id="cardBox"></div></div>
  <div id="lowOv" class="hidden">절전 중<br>화면을 누르면 풀립니다</div>
</div>

<script>
'use strict';
/* =====================================================================
   조정값 (TUNING) — 숫자는 전부 여기서 고친다.
   기준: 가이드라인.md 3장 "숫자" 표.
   ===================================================================== */
const TUNE = {
  // 기사 기본값 (가이드라인)
  KNIGHT_ATK: 10, KNIGHT_HP: 100, ATK_INTERVAL: 1.0, CRIT: 0.05, CRIT_MULT: 1.5, CRIT_CAP: 0.50,
  // 강화: 한 번에 오르는 양(step)과 첫 값(price). 값은 한 번에 7%씩 비싸진다 (가이드라인)
  UP: {
    atk:  { step: 1,    price: 32 },   // 공격력 +1
    hp:   { step: 15,   price: 22 },   // 체력 +15
    crit: { step: 0.01, price: 60 },   // 치명타 확률 +1%
  },
  PRICE_GROW: 1.07,
  // 몬스터 (가이드라인)
  MON_HP0: 20, MON_HP_GROW: 1.2, ZONE_MULT: 5,
  BOSS_HP_MULT: 10, BOSS_TIME: 30, BOSS_GOLD_MULT: 10,
  MON_ATK_RATIO: 0.1, GOLD_RATIO: 0.25,
  KILLS_TO_CLEAR: 10, ON_SCREEN: 6, DMG_CAP: 99990000,
  // 아래는 가이드라인에 없어서 이 파일에서 정한 값
  KNIGHT_SPEED: 230,        // 기사 걷는 빠르기 (px/초)
  REGEN: 0.01,              // 1초에 최대 체력의 1% 회복
  REVIVE: 3,                // 쓰러진 뒤 다시 일어나는 시간(초)
  MON_SPEED: 80,            // 몬스터 걷는 빠르기 (px/초)
  MON_ATK_INTERVAL: 1.6,    // 몬스터 공격 간격(초)
  BOSS_ATK_INTERVAL: 2.4,   // 보스 공격 간격(초)
  BOSS_ATK_MULT: 1.0,       // 보스 공격력 배수 (보스 체력의 10분의 1에 곱한다)

function bboxOf(img, fallback) {              // 투명하지 않은 부분만 잘라 쓴다
  try {
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
    const c = mk(W, H), g = c.getContext('2d', { willReadFrequently:true });
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) {
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x1 >= 0) return [x0, y0, x1 + 1, y1 + 1];
  } catch (e) {}
  return fallback || [0, 0, img.naturalWidth || img.width, img.naturalHeight || img.height];
}
function removeWhite(img) {                   // 흰 배경 그림이면 가장자리에서부터 흰색을 지운다
  const c = mk(img.naturalWidth, img.naturalHeight), g = c.getContext('2d', { willReadFrequently:true });
  g.drawImage(img, 0, 0);
  try {
    const W = c.width, H = c.height, id = g.getImageData(0, 0, W, H), d = id.data;
    const white = i => d[i * 4 + 3] > 200 && d[i * 4] > 236 && d[i * 4 + 1] > 236 && d[i * 4 + 2] > 236;
    if (!white(0) || !white(W - 1)) return c;
    const seen = new Uint8Array(W * H), st = new Int32Array(W * H); let n = 0;
    const push = i => { if (!seen[i] && white(i)) { seen[i] = 1; st[n++] = i; } };
    for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
    for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
    while (n) {
      const i = st[--n], x = i % W; d[i * 4 + 3] = 0;
      if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (i >= W) push(i - W); if (i < W * (H - 1)) push(i + W);
    }
    g.putImageData(id, 0, 0);
  } catch (e) {}
  return c;
}
/* 화면 크기에 맞춘 그림 한 장 + 맞았을 때 번쩍이는 밝은 그림. ax는 발이 놓이는 x 자리(0~1) */
function makeSprite(h, aspect, paint, ax) {
  const w = h * aspect, c = mk(w * SPR_Q, h * SPR_Q), g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  paint(g, c.width, c.height);
  const f = mk(c.width, c.height), fg = f.getContext('2d');
  fg.drawImage(c, 0, 0); fg.globalCompositeOperation = 'source-atop'; fg.fillStyle = '#fff6e0'; fg.fillRect(0, 0, f.width, f.height);
  return { c, f, w, h, ax:ax == null ? 0.5 : ax };
}
const monSprites = {};     // 스테이지 번호 -> 그림
function loadMonster(st) {
  if (monSprites[st]) return;
  const def = MONSTERS[st - 1], img = new Image();
  monSprites[st] = { ready:false, w:def.h * (def.bb[2] - def.bb[0]) / (def.bb[3] - def.bb[1]), h:def.h };

function setMaxStage(n) {             // 새 길이 열릴 때: 기록을 남기고 스킬이 열렸는지 본다
  if (n <= S.maxStage) return;
  const old = S.maxStage; S.maxStage = n;
  addLog(stageLabel(n) + ' 길이 열렸다', 'a');
  for (const sk of SKILLS) if (sk.unlock > old && sk.unlock <= n) { addLog('스킬이 열렸다 (' + sk.name + ')', 'a'); toast('스킬이 열렸다: ' + sk.name); }
  buildSkills(); save();
}
function gotoStage(st, quiet) {
  S.stage = st; R.pend = null; R.progress = 0; R.advanceT = -1; R.spawnT = 0.5; R.bossT = TUNE.BOSS_TIME; R.bossWait = 0;
  for (const m of R.mons) if (!m.dead) { m.dead = true; m.deadT = 0; m.gone = true; }
  R.k.target = null; R.k.hp = kMax();
  loadMonster(st); if (st < 10) loadMonster(st + 1);
  if (st === 10) { $('menu2').classList.add('hidden'); $('bMore').classList.remove('on'); }
  if (!quiet) showBanner(stageLabel(st), st === 10 ? '30초 안에 쓰러뜨려라' : MONSTERS[st - 1].name);
  refreshHud();
}
function spawnMonster() {
  const st = S.stage, def = MONSTERS[st - 1], sp = monSprites[st], k = R.k;
  let x, y;
  for (let i = 0; i < 8; i++) {                      // 사방 가장자리의 잎 아래에서 나타난다
    const side = def.boss ? 0 : Math.floor(Math.random() * 4);
    if (side === 0) { x = def.boss ? FW / 2 : rand(240, 430); y = def.boss ? 1010 : 150 + (def.fly || 0); }   // 위: 지도와 메뉴 사이로
    else if (side === 1) { x = rand(120, 560); y = FH + sp.h * 0.55; }
    else if (side === 2) { x = -sp.w * 0.2; y = rand(560, 1400); }
    else { x = FW + sp.w * 0.2; y = rand(560, 1200); }
    if (def.boss || Math.hypot(x - k.x, y - k.y) > 300) break;
  }
  const hp = Math.round(baseHp(st) * (def.mult.hp || 1));
  R.mons.push({ st, def, x, y, w:sp.w, h:sp.h, hp, max:hp,
    atk:Math.max(1, Math.round(baseHp(st) * TUNE.MON_ATK_RATIO * (def.mult.atk || 1) * (def.boss ? TUNE.BOSS_ATK_MULT : 1))),
    spd:TUNE.MON_SPEED * (def.mult.spd || 1), cd:rand(0.5, 1.1), born:0, flash:0, kbx:0, lunge:0,
    dead:false, deadT:0, ph:rand(0, 6.28), face:x < k.x ? 1 : -1, slot:false, side:0, wi:-1 });

}
/* 자리 잡기: 덤비는 몬스터는 기사 양옆 살짝 뒤(위)에 선다. 그래서 기사가 늘 앞에 보인다.
   나머지는 바깥 고리의 여섯 자리 가운데 빈 곳에서 기다린다. 그래서 서로 겹치지 않는다. */
const reachOf = m => getKnightSprite().bw * 0.6 + m.w * 0.5 + 12;

const angDiff = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
function placeOf(m) {
  const k = R.k, r = reachOf(m);
  if (m.slot) { const s = m.side === 0 ? 1 : -1; return [k.x + s * r, k.y - (m.def.boss ? 30 : 46)]; }
  const a = waitAng(m.wi < 0 ? 0 : m.wi), rx = r * TUNE.WAIT_RING, ry = Math.sin(a) > 0 ? Math.max(r * 1.5, m.h * 0.95) : r * 1.5;
  return [clamp(k.x + Math.cos(a) * rx, Math.max(MB.x0, m.w * 0.45), Math.min(MB.x1, FW - m.w * 0.45)), clamp(k.y + Math.sin(a) * ry, MB.y0, MB.y1)];
}
function assignPlaces() {
  const k = R.k, sideUsed = [false, false], waitUsed = new Array(WAIT_N).fill(false); let n = 0;
  for (const m of R.mons) {
    if (m.dead) { m.slot = false; continue; }
    if (m.slot) { n++; sideUsed[m.side] = true; } else if (m.wi >= 0) waitUsed[m.wi] = true;
  }
  while (n < TUNE.MAX_ATTACKERS) {                   // 가까운 순서로 덤빌 차례를 준다
    let best = null, bd = 1e9;
    for (const m of R.mons) if (!m.dead && !m.slot) { const d = Math.hypot(m.x - k.x, m.y - k.y); if (d < bd) { bd = d; best = m; } }
    if (!best) break;
    let side = best.x >= k.x ? 0 : 1; if (sideUsed[side]) side = 1 - side;

    for (let i = 0; i < WAIT_N; i++) if (!waitUsed[i]) { const d = angDiff(a, waitAng(i)); if (d < bd) { bd = d; bi = i; } }

function inRange(m, pad) {            // 기사의 칼이 닿는가
  const k = R.k, rx = reachOf(m) + (pad || 46), ry = 60 + (pad || 46);

  const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy), step = spd * dt;
  if (d <= step || d < 0.5) { o.x = tx; o.y = ty; return false; }

function killMonster(m) {
  m.dead = true; m.deadT = 0; m.slot = false; m.wi = -1;
  const st = m.st, g = goldOf(st), top = m.y - m.h * 0.6 - (m.def.fly || 0);
  S.kills[st] = (S.kills[st] || 0) + 1; S.gold += g;
  addFloat(m.x, top, '+' + fmt(g), '#f0c069', 34, 1.1);
  addLog('+' + fmt(g) + ' 골드', 'g', g);
  if (m.def.boss || Math.random() < TUNE.LOOT_CHANCE) {
    S.loot[st] = (S.loot[st] || 0) + 1;
    addFloat(m.x, top - 44, m.def.loot, '#ece2c6', 30, 1.5);
    addLog('전리품을 얻었다 (' + m.def.loot + ')');
  }
  if (m.def.boss) {
    R.bossWait = 3; addLog('고블린 왕을 쓰러뜨렸다', 'a');
    if (!S.bossDone) { S.bossDone = true; addLog('첫 번째 기억 조각을 되찾았다', 'a'); }
    if (!S.storySeen) { S.storySeen = true; setTimeout(showStory, 900); }
    save();
  } else if (st === S.stage) {
    R.progress = Math.min(TUNE.KILLS_TO_CLEAR, R.progress + 1);
    if (R.progress >= TUNE.KILLS_TO_CLEAR) {
      if (S.maxStage < st + 1) { showBanner(stageLabel(st) + ' 깼다', '다음 길이 열렸다'); setMaxStage(st + 1); }
      if (S.auto && R.advanceT < 0) R.advanceT = 0.9;

function bossFail(msg) {

  gotoStage(9, true);
  showBanner(msg, '1-9로 돌아간다');

/* 기사가 몬스터를 때린다. mult는 공격력 배율, big이면 스킬 숫자로 크게 보여 준다 */
function hitMonster(m, mult, big) {
  const k = R.k, crit = Math.random() < kCrit();
  const dmg = Math.min(TUNE.DMG_CAP, Math.round(kAtk() * mult * (crit ? TUNE.CRIT_MULT : 1)));
  m.hp -= dmg; m.flash = 0.16; m.kbx = (m.x >= k.x ? 1 : -1) * (m.def.boss ? 40 : 190);
  // 보통은 흰 숫자, 치명타는 등불 주황에 더 크게, 작은 불꽃 표시를 붙인다
  addFloat(m.x, m.y - m.h * 0.78 - (m.def.fly || 0) - (big ? 20 : 0), fmt(dmg), crit ? (Math.random() < 0.2 ? '#8fdcff' : '#ffab3d') : '#ffffff',   // 치명타는 주황. 가끔 얼음빛(모양만 다르다)
    (big ? 52 : 38) * (crit ? 1.35 : 1), crit || big ? 1.05 : 0.8, { num:true, spark:crit });
  if (crit) jolt(0.055, 7); else if (m.def.boss) jolt(0.04, 3.5);

function castSkill(sk, manual) {
  const k = R.k;
  if (S.maxStage < sk.unlock) { if (manual) toast(ZONE + '-' + sk.unlock + '에 가면 열립니다'); return false; }
  if (R.paused || k.dead || R.cd[sk.id] > 0) return false;
  const live = R.mons.filter(m => !m.dead && m.born > 0.25);
  let targets = [];
  if (sk.kind === 'one') { if (k.target && !k.target.dead && inRange(k.target)) targets = [k.target]; }
  else if (sk.kind === 'reach') targets = live.filter(m => inRange(m, 90));
  else targets = live;
  if (!targets.length) { if (manual) toast('닿는 몬스터가 없습니다'); return false; }
  R.cd[sk.id] = sk.cd; R.skillGap = TUNE.SKILL_GAP; k.lunge = 0.24; R.eyeT = 0.5;
  addFloat(k.x, k.y - getKnightSprite().h - 118, sk.name, '#ffd590', 30, 0.9);
  if (sk.id === 'shard' && S.cutin !== false) {      // 가장 센 스킬: 눈매 연출이 먼저 지나가고, 그다음에 맞는다. 게임은 멈추지 않는다

function landSkill(sk, targets) {
  const k = R.k, t = targets[0];

  for (const m of targets) hitMonster(m, sk.mult, true);

function update(dt) {
  R.t += dt;
  const k = R.k, ks = getKnightSprite(), stDef = MONSTERS[S.stage - 1];
  if (R.advanceT >= 0) { R.advanceT -= dt; if (R.advanceT < 0 && S.auto && S.stage < 10 && S.maxStage > S.stage) gotoStage(S.stage + 1); }
  // 새 몬스터
  const alive = R.mons.filter(m => !m.dead).length, sp = monSprites[S.stage];
  if (sp && sp.ready && !k.dead) {
    if (stDef.boss) {
      if (R.bossWait > 0) R.bossWait -= dt;
      else if (alive === 0) spawnMonster();
    } else if (alive < TUNE.ON_SCREEN) {
      R.spawnT -= dt;
      if (R.spawnT <= 0) { spawnMonster(); R.spawnT = alive < 3 ? 0.45 : rand(TUNE.RESPAWN[0], TUNE.RESPAWN[1]); }
    }
  }
  assignPlaces();
  for (const sk of SKILLS) R.cd[sk.id] = Math.max(0, R.cd[sk.id] - dt);
  R.skillGap = Math.max(0, R.skillGap - dt); R.eyeT = Math.max(0, R.eyeT - dt);
  if (R.cut) { R.cut.t += dt; if (R.cut.t >= R.cut.life) R.cut = null; }
  if (R.pend) {                         // 연출 뒤에 떨어지는 한 방
    R.pend.t -= dt;
    if (R.pend.t <= 0) {
      const pd = R.pend; R.pend = null; let m = pd.m;
      if (m.dead) m = k.target && !k.target.dead ? k.target : R.mons.find(x => !x.dead && x.born > 0.25);
      if (m && !k.dead) { k.lunge = 0.24; R.eyeT = 0.5; landSkill(pd.sk, [m]); } else R.cd[pd.sk.id] = Math.min(R.cd[pd.sk.id], 3);
    }
  }
  // 기사
  k.atkT = Math.max(0, k.atkT - dt); k.lunge = Math.max(0, k.lunge - dt); k.flash = Math.max(0, k.flash - dt);
  k.moving = false;
  if (k.dead) {
    k.reviveT -= dt;
    if (k.reviveT <= 0) { k.dead = false; k.hp = kMax(); k.atkT = 0.4; addLog(S.name + '이(가) 다시 일어났다', 'b'); }
  } else {
    k.hp = Math.min(kMax(), k.hp + kMax() * TUNE.REGEN * dt);
    if (!k.target || k.target.dead) {                 // 덤비는 놈부터, 그 가운데 가까운 놈
      let best = null, bd = 1e9;
      for (const m of R.mons) if (!m.dead && m.born > 0.25) { const d = Math.hypot(m.x - k.x, m.y - k.y) + (m.slot ? 0 : 5000); if (d < bd) { bd = d; best = m; } }
      k.target = best;
    }
    const m = k.target;
    if (m) {
      const side = k.x <= m.x ? -1 : 1;
      k.face = -side;                                   // face: 1이면 오른쪽을 본다
      if (!inRange(m)) {
        // 빈터 안에 들어온 놈에게만 다가간다. 아직 잎 아래에 있는 놈은 가운데 쪽에서 기다린다 (구석으로 끌려가지 않게)
        const inside = m.x > KB.x0 - 120 && m.x < KB.x1 + 120 && m.y > KB.y0 - 200 && m.y < KB.y1 + 120;
        if (inside) k.moving = moveTo(k, clamp(m.x + side * reachOf(m), KB.x0, KB.x1), clamp(m.y + 40, stDef.boss ? KB.bossY0 : KB.y0, KB.y1), TUNE.KNIGHT_SPEED, dt);
        else if (Math.hypot(k.x - 450, k.y - 980) > 160) k.moving = moveTo(k, 450, 980, TUNE.KNIGHT_SPEED * 0.5, dt);
      }
      else if (k.atkT <= 0) {            // 기본 공격: 벤 자국이 등불빛과 얼음빛으로 번갈아 난다
        k.atkT = TUNE.ATK_INTERVAL; k.lunge = 0.24;
        R.fx.push({ kind:'slash', small:true, ice:R.atkN++ % 2 === 1, x:m.x, y:m.y, h:m.h, dir:m.x >= k.x ? 1 : -1, t:0, life:0.24 });
        hitMonster(m, 1, false);
      }
    }
    if (S.autoSkill && R.skillGap <= 0) for (let i = SKILLS.length - 1; i >= 0; i--) if (castSkill(SKILLS[i], false)) break;
  }
  // 발밑 효과
  if (S.cos.foot !== 'none' && !k.dead) {
    k.stepT -= dt * (k.moving ? 1 : 0.35);
    if (k.stepT <= 0) {
      k.stepT = S.cos.foot === 'leaf' ? 0.13 : 0.1;
      R.parts.push({ kind:S.cos.foot, x:k.x + rand(-30, 30), y:k.y + rand(-6, 8), vx:rand(-22, 22), vy:S.cos.foot === 'leaf' ? rand(-36, -14) : rand(-64, -30), t:0, life:rand(0.6, 1.1), r:rand(0, 6.28) });
    }
  }
  for (const p of R.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'leaf') p.vy += 60 * dt; }
  R.parts = R.parts.filter(p => p.t < p.life);
  for (const f of R.fx) f.t += dt;
  R.fx = R.fx.filter(f => f.t < f.life);
  // 몬스터
  for (const m of R.mons) {
    m.flash = Math.max(0, m.flash - dt); m.lunge = Math.max(0, m.lunge - dt);
    if (m.dead) { m.deadT += dt; continue; }
    m.born += dt;
    m.x += m.kbx * dt; m.kbx *= Math.exp(-9 * dt);
    if (!k.dead) {
      m.face = m.x >= k.x ? -1 : 1;
      const p = placeOf(m), far = Math.hypot(p[0] - m.x, p[1] - m.y);
      if (far > 8) moveTo(m, p[0], p[1], m.spd * (m.slot ? 1 : 0.8), dt);
      if (m.slot && far < 48) {
        m.cd -= dt;
        if (m.cd <= 0) {
          m.cd = m.def.boss ? TUNE.BOSS_ATK_INTERVAL : TUNE.MON_ATK_INTERVAL; m.lunge = 0.26;
          k.hp -= m.atk; k.flash = 0.16;
          addFloat(k.x - m.face * 64, k.y - ks.h * 0.42, '-' + fmt(m.atk), '#ff5a45', 36, 0.8, { num:true });   // 기사가 입은 피해는 붉게, 이름표를 피해 옆에
          if (m.def.boss) jolt(0.05, 8);
          if (k.hp <= 0) {
            k.hp = 0; k.dead = true; k.reviveT = TUNE.REVIVE; k.target = null;
            addLog(S.name + '이(가) 쓰러졌다', 'b');
            if (m.def.boss) { bossFail('기사가 쓰러졌다'); return; }
          }
        }
      }
    }
  }
  R.mons = R.mons.filter(m => !(m.dead && m.deadT > 0.7));
  // 보스 시간
  if (stDef.boss && !k.dead) {
    const boss = R.mons.find(m => m.def.boss && !m.dead);
    if (boss && boss.born > 0.4) { R.bossT -= dt; if (R.bossT <= 0) { bossFail('시간이 다 됐다'); return; } }
  }
  for (const f of R.floats) f.t += dt;

}

/* ===================================================================== 그리기 */
function drawShadow(g, x, y, rx, ry, a) {   // 부드럽고 살짝 비껴 난 바닥 그림자
  g.save(); g.translate(x + rx * 0.1, y + ry * 0.35); g.scale(rx * 1.15, ry * 1.3);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  gr.addColorStop(0, 'rgba(4,8,6,' + a * 0.85 + ')'); gr.addColorStop(0.45, 'rgba(4,8,6,' + a * 0.5 + ')'); gr.addColorStop(1, 'rgba(4,8,6,0)');

function drawSprite(g, sp, x, y, o) {     // o: flip, sx, sy, rot, alpha, flash, dx
  g.save(); g.translate(x + (o.dx || 0), y); if (o.rot) g.rotate(o.rot);

  if (o.flash > 0) { g.globalAlpha = a * Math.min(1, o.flash); g.drawImage(sp.f, ox, oy, sp.w, sp.h); }
  g.restore();
}
function glow(g, x, y, r, color, a) {     // 더해지는 빛
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore();
}
function outlined(g, txt, x, y, size, color, align, style) {
  g.font = (style || '700 ') + size + 'px ' + FONT; g.textAlign = align || 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(4, size * 0.17); g.strokeStyle = 'rgba(8,11,8,0.92)';
  g.strokeText(txt, x, y); g.fillStyle = color; g.fillText(txt, x, y);
}
function drawKnight(g, sp, x, y, face, t, opt) {   // 들판과 꾸미기 미리보기가 함께 쓴다
  const sc = opt.scale || 1, flip = face > 0, breath = 1 + Math.sin(t * 2.6) * 0.012, al = opt.alpha == null ? 1 : opt.alpha;

  drawSprite(g, sp, 0, 0, { flip, sy:breath, sx:1 / Math.sqrt(breath), rot:opt.rot, alpha:opt.alpha, flash:opt.flash, dx:opt.dx });
  if (!opt.rot && !opt.noGlow) {                     // 허리의 등불 빛 (그림 속 등불 자리에 맞춘다)
    const lx = (sp.lantern[0] - sp.ax) * sp.w * (flip ? -1 : 1) + (opt.dx || 0), ly = (sp.lantern[1] - (sp.gy || 0.97)) * sp.h * breath;

  document.querySelectorAll('[data-ic]').forEach(e => { e.outerHTML = icon(e.dataset.ic); });
  load(); bg = makeBackground(); fg = makeCanopy(); fit(); addEventListener('resize', fit);
  for (const k of ['m', 'f']) { const im = heroImgs[k]; im.eyeY = HERO_EYES[k]; im.onload = () => { im.ok = true; }; im.src = 'art/ui/' + encodeURIComponent('영웅-얼굴' + (k === 'f' ? '-여' : '')) + '.png'; }
  setHeroFace();
  loadKnightImages(); for (let i = 1; i <= 10; i++) loadMonster(i);
  buildSkills();

  $('stagePill').onclick = () => openSheet('stage');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSheet(b.dataset.open));
  $('bMore').onclick = () => { $('menu2').classList.toggle('hidden'); $('bMore').classList.toggle('on', !$('menu2').classList.contains('hidden')); };
  $('bJournal').onclick = () => showCard('<h3>일지</h3><p>준비 중입니다.</p><p class="small">길을 처음 깰 때마다 한 줄씩 열립니다.</p>', [{ text:'닫기', acc:true }]);
  $('bLow').onclick = () => { R.low = true; $('lowOv').classList.remove('hidden'); };
  $('lowOv').onclick = () => { R.low = false; $('lowOv').classList.add('hidden'); };
  $('autoSk').onclick = () => { S.autoSkill = !S.autoSkill; refreshHud(); };
  $('logBtn').onclick = () => $('log').classList.toggle('open');
  $('hintTog').onclick = () => { S.hintOff = !S.hintOff; refreshHud(); };
  $('hintUp').onclick = () => openSheet('up');
  $('hintGoal').onclick = () => openSheet('stage');
  $('sheetClose').onclick = closeSheet;
  $('sheetWrap').addEventListener('pointerdown', e => { if (e.target === $('sheetWrap')) closeSheet(); });
  document.querySelectorAll('.gBtn').forEach(b => b.onclick = () => { startGender = b.dataset.g; drawStartPreviews(); });
  $('goBtn').onclick = startGame;
  $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  document.addEventListener('contextmenu', e => e.preventDefault());

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (S.started) save(); }
    else if (hiddenAt) { offlineReward((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
  });
  addEventListener('pagehide', () => { if (S.started) save(); });

  if (DEBUG) {
    window.__g = { get S() { return S; }, R, TUNE, buy, gotoStage, setMaxStage, openSheet };
    addEventListener('keydown', e => {
      if (e.target === $('nameIn') || R.paused) return;
      if (e.key === 'n' || e.key === 'N') {             // 스테이지 넘기기
        if (S.stage === 10) { const b = R.mons.find(m => m.def.boss && !m.dead); if (b) { b.hp = 0; killMonster(b); } }
        else { S.kills[S.stage] = S.kills[S.stage] || 1; setMaxStage(S.stage + 1); gotoStage(S.stage + 1); }
      }
      if (e.key === 'g' || e.key === 'G') { S.gold += 1000; refreshHud(); }
    });
  }

  if (S.started) {
    const away = (Date.now() - (S.last || Date.now())) / 1000;
    R.paused = false; R.k.hp = kMax(); addLog('다시 길에 섰다', 'd'); gotoStage(S.stage); offlineReward(away);
  } else openStart();
  refreshHud();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
init();
</script>
</body>
</html>
