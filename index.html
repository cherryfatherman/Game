<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>잊혀진 기사 키우기</title>
<style>
:root{
  color-scheme:dark;
  --panel:#1c261b; --panel2:#2a2318; --box:#263324; --line:#5a5540; --hud:rgba(15,21,14,.68); --hudline:rgba(150,140,100,.42);
  --cream:#ece2c6; --dim:#aaa187; --acc:#e8943a; --red:#b9735f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a110b;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
  color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#0a110b}   /* 길쭉한 휴대폰에서 위아래에 남는 곳: 숲 가장자리와 같은 어두운 풀빛 */
#stage{position:absolute;left:50%;top:50%;width:900px;height:1600px;transform-origin:center center;background:#0d120d;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:900px;height:1600px;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
.hidden{display:none!important}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hud{background:var(--hud);border:2px solid var(--hudline);border-radius:18px}
.coin{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f3c777,#b9802f);border:3px solid #7a5420;flex:none}

/* 늘 떠 있는 것(HUD): 판을 깔지 않는다. 글자 그림자와 가는 고리로만 읽히게 한다 */
#mini,#stagePill,#cur,#tr,#log,#autoSk,.skill{--ts:0 2px 3px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.75);text-shadow:var(--ts)}
#mini svg,#stagePill svg,#cur svg,#tr svg,#log svg,.skill svg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
#stagePill:active,.mBtn:active,.skill:active,#autoSk:active,#logBtn:active,#hintUp:active,#hintTog:active{filter:brightness(1.6)}

/* 왼쪽 위: 둥근 작은 지도와 스테이지 */
#mini{position:absolute;left:30px;top:16px;width:170px;height:170px;z-index:5;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
#mini canvas{width:170px;height:170px;display:block}
#stagePill{position:absolute;left:46px;top:192px;height:84px;padding:0 20px;z-index:5;display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700;border-radius:42px;background:rgba(8,12,8,.28)}
#stagePill b{color:var(--acc)}
#stagePill svg{font-size:28px;color:var(--dim)}

/* 위 가운데: 골드와 전리품 */
#cur{position:absolute;left:210px;top:28px;width:270px;display:flex;justify-content:center;align-items:center;gap:10px;font-size:32px;font-weight:700;z-index:5;pointer-events:none}
#cur .coin{box-shadow:0 2px 5px rgba(0,0,0,.8)}
#cur svg{font-size:32px;color:var(--dim);margin-left:22px}

/* 오른쪽 위: 메뉴와 할 일 */
#tr{position:absolute;right:46px;top:8px;width:380px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:5;pointer-events:none}
#menu,#menu2{display:flex;gap:2px;pointer-events:auto}
.mBtn{position:relative;width:92px;height:108px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:23px;font-weight:600}
.mBtn svg{font-size:52px}
.mBtn.on{color:var(--acc)}
.mBtn.nw::after,.cTab.nw::after{content:"";position:absolute;right:16px;top:12px;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px rgba(8,12,8,.85)}
#hint{pointer-events:auto;width:372px;margin:6px 0 0 0;padding:0 14px 10px 16px;border-radius:16px;background:linear-gradient(90deg,rgba(8,12,8,.5),rgba(8,12,8,.16));border-left:4px solid var(--acc);text-align:left}
#hintTog{width:100%;height:50px;display:flex;align-items:center;justify-content:space-between;font-size:23px;font-weight:700;color:var(--acc)}
#hintTog svg{font-size:26px;color:var(--dim)}
#hintGoal{font-size:24px;line-height:34px;font-weight:600}
#hintUp{display:flex;align-items:center;gap:8px;height:60px;margin-top:4px;font-size:26px;font-weight:700;color:var(--acc)}
#hintUp svg{font-size:30px}
#hint.off{width:auto;padding:0 12px 0 14px} #hint.off #hintBody{display:none} #hint.off #hintTog{gap:10px} #hint.off #hintTog svg{transform:rotate(-90deg)}

/* 오른쪽 아래: 엄지가 닿는 자리에 둥글게 모은 스킬 */
.skill{position:absolute;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 32%,rgba(46,60,40,.6),rgba(8,12,8,.6));box-shadow:0 0 0 3px rgba(236,226,198,.3),0 4px 12px rgba(0,0,0,.6)}
.skill svg{font-size:.5em;color:var(--cream)}
.skill.ready{box-shadow:0 0 0 3px rgba(232,148,58,.95),0 0 18px rgba(232,148,58,.5),0 4px 12px rgba(0,0,0,.6)}
.skill.cool svg{opacity:.22}
.skill.lock{opacity:.5} .skill.lock svg{font-size:.32em;color:var(--dim)}
.skill .cd{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;pointer-events:none}
#autoSk{position:absolute;right:56px;bottom:340px;width:92px;height:92px;border-radius:50%;z-index:5;font-size:25px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;
  color:var(--dim);background:rgba(8,12,8,.45);box-shadow:0 0 0 3px rgba(236,226,198,.25),0 4px 12px rgba(0,0,0,.6)}
#autoSk small{font-size:21px;font-weight:700}
#autoSk.on{color:var(--acc);box-shadow:0 0 0 4px var(--acc),0 0 20px rgba(232,148,58,.55),0 4px 12px rgba(0,0,0,.6)}

/* 아래: 기사 체력, 잡은 수, 기록 */
#log{position:absolute;left:46px;bottom:12px;width:506px;z-index:5;display:flex;flex-direction:column;pointer-events:none}
#logTop{display:flex;align-items:center;gap:16px}
#logBars{flex:1}
#face{width:120px;height:120px;flex:none;border-radius:50%;overflow:hidden;background:#10160f;box-shadow:0 0 0 3px var(--acc),0 5px 14px rgba(0,0,0,.75);transition:box-shadow .3s,filter .3s}
#face img{width:100%;height:100%;display:block;object-fit:cover;transform:scale(1.1)}
#face.hit{box-shadow:0 0 0 5px #ff4a3a,0 0 24px rgba(255,74,58,.85),0 5px 14px rgba(0,0,0,.75);transition:none}
#face.down{filter:grayscale(1) brightness(.55)}
#dmgLine{font-size:23px;font-weight:700;margin:0 0 8px 8px;color:var(--cream)} #dmgLine b{display:inline-block;margin-left:8px;font-size:28px;color:var(--acc)}
#dmgLine b.pop{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(2);color:#fff}100%{transform:scale(1)}}
#hpBar{height:32px;border-radius:16px;background:rgba(8,12,8,.62);position:relative;overflow:hidden;box-shadow:0 0 0 2px rgba(236,226,198,.3),0 3px 8px rgba(0,0,0,.6)}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:16px;background:linear-gradient(#a3c072,#6f8c4b)}
#hpFill.low{background:linear-gradient(#d98a6c,#a8563f)}
#hpTxt{position:absolute;left:0;right:0;top:0;line-height:32px;text-align:center;font-size:23px;font-weight:700}
#progLine{height:6px;margin:9px 6px 0;border-radius:3px;background:rgba(8,12,8,.55)} #progFill{height:100%;width:0;border-radius:3px;background:var(--acc)}
#logIn{display:flex;align-items:flex-end;margin-top:6px;border-radius:16px}
#log.open #logIn{background:rgba(8,12,8,.62)}
#logLines{flex:1;margin:4px 0 4px 10px;height:76px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#log.open #logLines{height:304px}
#logLines div{font-size:25px;line-height:38px;height:38px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cream)}
#logLines .tg{font-weight:700;margin-right:8px}
#logLines .a .tg,#logLines .c .tg{color:var(--acc)} #logLines .j .tg{color:#d8cfae} #logLines .g .tg{color:#e9c376} #logLines .b .tg{color:#e07a62} #logLines .d .tg{color:var(--dim)} #logLines .l .tg{color:#b9c9a0}
#logBtn{width:84px;height:84px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;color:var(--cream);pointer-events:auto}
#log.open #logBtn svg{transform:rotate(180deg)}
#toast.high{bottom:auto;top:296px}   /* 판이 열려 있을 때는 판 위쪽 들판에 띄운다 (판의 단추를 가리지 않게) */
#toast{position:absolute;left:50%;bottom:520px;transform:translateX(-50%);padding:16px 30px;font-size:32px;font-weight:600;border-radius:40px;z-index:22;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:rgba(10,14,10,.88);box-shadow:0 0 0 2px rgba(150,140,100,.4)}

/* 아래에서 올라오는 판 */
#sheetWrap{position:absolute;inset:0;background:rgba(4,7,4,.4);z-index:10}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:1240px;display:flex;flex-direction:column;background:rgba(24,32,23,.97);
  border-top:3px solid var(--line);border-radius:30px 30px 0 0}
#sheetHead{display:flex;align-items:center;padding:18px 46px 14px 46px;flex:none}
#sheetHead h2{flex:1;margin:0;font-size:42px}
#sheetBody{overflow-y:auto;padding:6px 46px 40px;-webkit-overflow-scrolling:touch}
.btn{min-height:84px;padding:0 30px;font-size:32px;font-weight:600;background:var(--panel2);border:3px solid var(--line);border-radius:16px}
.btn:active{background:#463a26;transform:translateY(2px)}
.btn.acc{background:var(--acc);border-color:#a8641f;color:#22170a} .btn.acc:active{background:#c97a2a}
.btn:disabled{opacity:.35}
.btn.wide{width:100%}
#upHead{font-size:34px;font-weight:700;margin:2px 6px 6px;word-break:keep-all} #upHead small{display:block;font-size:25px;font-weight:400;color:var(--dim);margin-top:6px}
.up{display:flex;align-items:center;width:100%;height:136px;margin-top:12px;padding:0 22px;background:var(--panel2);border:3px solid var(--line);border-radius:18px;text-align:left}
.up:active{background:#463a26;transform:translateY(2px)}
.up .un{width:206px;font-size:34px;font-weight:700;white-space:nowrap}
.up .un small{display:block;font-size:25px;font-weight:400;color:var(--dim);margin-top:4px}
.up .ue{flex:1;font-size:32px;font-weight:600;white-space:nowrap}
.up .ue small{display:block;font-size:23px;font-weight:400;color:var(--dim);margin-top:6px;letter-spacing:-.5px} .up .ue small.go{color:var(--acc)}
.up .upp{display:flex;align-items:center;gap:10px;font-size:32px;font-weight:700;color:var(--acc);min-width:140px;justify-content:flex-end}
.up.no{opacity:.45} .up.no .upp{color:var(--dim)}
.note{font-size:28px;line-height:1.5;color:var(--dim);margin:16px 6px 0;word-break:keep-all} .note.gap{margin:10px 6px 22px;font-size:26px}
.sec{margin:30px 0 12px;font-size:34px;font-weight:700;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{min-height:108px;padding:12px 20px;background:var(--panel);border:3px solid var(--line);border-radius:16px;text-align:left;display:flex;align-items:center;gap:16px}
.opt:active{background:#33432f}
.opt .on{font-size:33px;font-weight:700} .opt .oh{font-size:25px;color:var(--dim);margin-top:4px;word-break:keep-all}
.opt.sel{border-color:var(--acc);background:#2c3a28} .opt.lock{opacity:.5}
.opt svg{font-size:36px;color:var(--dim)}
.dot{width:40px;height:40px;border-radius:50%;flex:none;border:3px solid #0008}
#cosPrev{width:100%;height:480px;border-radius:20px;border:3px solid var(--line);display:block}
#cosLine{min-height:78px;margin:12px 4px 0;font-size:25px;line-height:1.5;color:var(--dim);word-break:keep-all} #cosLine b{color:var(--cream);font-size:28px;margin-right:12px}
#cosTabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 14px}
.cTab{position:relative;height:84px;font-size:27px;font-weight:700;border-radius:14px;background:var(--panel);border:3px solid var(--line)}
.cTab:active{background:#33432f} .cTab.sel{border-color:var(--acc);color:var(--acc);background:#2c3a28}
#cosGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cCard{position:relative;height:322px;border-radius:18px;background:var(--panel);border:3px solid var(--line);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 6px 10px}
.cCard:active{background:#33432f}
.cCard canvas,.cCard .big{position:absolute;left:0;top:0;width:100%;height:214px}
.cCard .big{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--acc);padding:0 12px;text-align:center}
.cCard .big .dot{width:92px;height:92px}
.cCard .cn{font-size:25px;font-weight:700;white-space:nowrap;letter-spacing:-1px} .cCard .ch{font-size:20px;line-height:1.25;color:var(--dim);margin-top:3px;min-height:50px;text-align:center;word-break:keep-all;letter-spacing:-.5px}
.cCard.sel{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--acc);background:#2c3a28} .cCard.sel .ch{color:var(--acc)}
.cCard.lock canvas,.cCard.lock .big{opacity:.4} .cCard.lock .cn{color:var(--dim)}
.cCard .lk{position:absolute;right:10px;top:10px;width:52px;height:52px;border-radius:50%;background:rgba(8,12,8,.66);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--cream)}
.cCard .ld{position:absolute;left:0;top:0;width:100%;height:214px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim)}
.jr{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:16px 22px;margin-bottom:12px}
.jr .jh{font-size:25px;font-weight:700;color:var(--acc);margin-bottom:6px} .jr .jt{font-size:30px;line-height:1.55;word-break:keep-all}
.jr.un{opacity:.55;padding:12px 22px} .jr.un .jh{display:inline-block;color:var(--dim);margin:0 16px 0 0} .jr.un .jt{display:inline;color:var(--dim);font-size:26px}
#cosNote{flex:1;font-size:28px;line-height:1.5;color:var(--dim);background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:22px}
#cosNote b{color:var(--cream);font-size:32px}
.dex{display:flex;gap:20px;align-items:center;background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:12px}
.dex .pic{width:140px;height:140px;flex:none;background:#2f4230;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dex img{width:130px;height:130px;object-fit:contain}
.dex .pic.q{font-size:70px;font-weight:800;color:#55654f}
.dex .dn{font-size:34px;font-weight:700} .dex .dn small{font-size:27px;color:var(--acc);margin-right:12px}
.dex .dt{font-size:28px;line-height:1.4;margin:6px 0} .dex .dl{font-size:27px;color:var(--dim)}
.toggle{display:flex;align-items:center;width:100%;min-height:96px;padding:0 24px;font-size:34px;font-weight:700;background:var(--panel2);border:3px solid var(--line);border-radius:18px}
.toggle span{flex:1;text-align:left} .toggle b{color:var(--dim)} .toggle.on{border-color:var(--acc)} .toggle.on b{color:var(--acc)}
.toggle:active{background:#463a26}

/* 가운데 뜨는 카드 */
.modal{position:absolute;inset:0;background:rgba(5,8,5,.78);display:flex;align-items:center;justify-content:center;z-index:20}
.card{width:740px;background:var(--panel2);border:4px solid var(--line);border-radius:24px;padding:46px 44px;text-align:center}
.card h3{margin:0 0 26px;font-size:44px;color:var(--acc)}
.card p{margin:14px 0;font-size:36px;line-height:1.5}
.card .small{font-size:30px;color:var(--dim)}
.card .btns{display:flex;gap:20px;justify-content:center;margin-top:36px}
.card .btn{font-size:36px;padding:0 44px}
#lowOv{position:absolute;inset:0;background:rgba(0,0,0,.74);z-index:30;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--dim);text-align:center;line-height:1.6}

/* 이야기 카드: 들판을 어둡게 덮고 한 장씩 보여 준다 */
#story{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 46%,rgba(5,8,6,.8) 0,rgba(3,5,4,.95) 70%)}
#story.intro{background:#05080a}
#stBg{position:absolute;left:0;top:30px;width:900px;height:900px;background:center/cover no-repeat;opacity:.22;filter:saturate(.75);pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent 100%);mask-image:radial-gradient(closest-side,#000 45%,transparent 100%)}
#stName{position:absolute;left:46px;top:48px;font-size:26px;color:var(--dim);letter-spacing:3px;pointer-events:none}
#stSkip{position:absolute;right:46px;top:16px;height:84px;padding:0 22px;font-size:27px;color:var(--dim);border:2px solid rgba(170,161,135,.35);border-radius:42px}
#stSkip:active{background:rgba(236,226,198,.12)}
#stCard{position:relative;width:740px;text-align:center;animation:stIn .5s ease both;pointer-events:none}
@keyframes stIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#stWho{font-size:29px;font-weight:700;color:var(--acc);letter-spacing:3px;min-height:40px;margin-bottom:18px}
#stText{font-size:42px;line-height:1.7;word-break:keep-all;text-shadow:0 2px 6px #000}
#stSub{font-size:34px;font-weight:700;color:var(--cream);margin-top:22px}
#stCard.say #stText{font-size:45px;font-weight:600}
#stCard.big #stText{font-size:60px;font-weight:800;color:var(--acc);line-height:1.45}
#stCard.small #stText{font-size:30px;color:var(--dim)}
#stCard.title #stText{font-size:84px;font-weight:800;letter-spacing:2px;line-height:1.3;text-shadow:0 4px 8px #000,0 0 40px rgba(232,148,58,.35)}
#stCard.gift{padding:38px 30px;border:3px solid var(--acc);border-radius:24px;background:rgba(232,148,58,.08)}
#stCard.gift #stText{font-size:36px;color:var(--acc);font-weight:700}
#stFoot{position:absolute;left:0;right:0;bottom:74px;text-align:center;font-size:24px;color:var(--dim);pointer-events:none}
#stFoot span{display:block;margin-top:10px}

/* 시작 화면 */
#start{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(rgba(8,12,9,.5) 0,rgba(8,12,9,.05) 200px,rgba(8,12,9,.05) 430px,#0e140e 620px),var(--hero,none) center top/900px 900px no-repeat,#0e140e}
#start h1{margin:56px 0 8px;font-size:78px;letter-spacing:2px;text-shadow:0 4px 6px #000,0 0 26px #000,0 0 50px rgba(0,0,0,.8)}
#start .sub{font-size:32px;color:var(--cream);margin-bottom:412px;text-shadow:0 2px 4px #000,0 0 16px #000}
#gPick{display:flex;gap:36px}
.gBtn{width:300px;height:430px;background:var(--panel);border:4px solid var(--line);border-radius:22px;font-size:36px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:22px}
.gBtn canvas{width:260px;height:330px}
.gBtn.sel{border-color:var(--acc);background:#2c3a28}
.gBtn:active{filter:brightness(1.2)}
#start label{font-size:32px;color:var(--dim);margin:40px 0 14px}
#nameIn{width:460px;height:92px;font:inherit;font-size:44px;text-align:center;color:var(--cream);background:#10160f;
  border:4px solid var(--line);border-radius:16px;outline:none;user-select:text;-webkit-user-select:text}
#nameIn:focus{border-color:var(--acc)}
#goBtn{margin-top:44px;width:460px;height:110px;font-size:46px}
</style>
</head>
<body>
<div id="app">
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="mini"><canvas id="miniCv" width="340" height="340"></canvas></div>

const sumVals = o => Object.values(o || {}).reduce((a, b) => a + b, 0), kindsOf = o => Object.values(o || {}).filter(v => v > 0).length;

/* 받침이 있으면 a, 없으면 b를 붙인다 ("훈련복을", "하오리를") */
function josa(w, a, b) {
  const m = w.match(/[가-힣0-9](?=[^가-힣0-9]*$)/), c = m ? m[0].charCodeAt(0) : 0;
  const has = c >= 0xAC00 ? (c - 0xAC00) % 28 > 0 : /[013678]/.test(m ? m[0] : '');
  return w + (has ? a : b);
}

/* ===================================================================== 소리 */
/* 전부 코드로 만든 소리다. 파일을 쓰지 않는다. 작고 부드럽게 낸다. 음악은 없다.
   화면을 처음 누른 뒤에만 켜진다. 소리를 낼 수 없는 곳에서는 아무 일 없이 넘어간다 */
const Snd = (() => {
  let ac = null, out = null, nbuf = null; const last = {};
  const wake = () => { if (ac && ac.state === 'suspended') { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } };
  function init() {
    try {
      if (ac) return wake();
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.2;                       // 전체 크기는 작게
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;
      out.connect(comp); comp.connect(ac.destination);
      nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      wake();
    } catch (e) { ac = null; }
  }
  const on = () => ac && ac.state === 'running' && S.sound !== false && SPEED === 1;
  const lim = (k, ms) => { const n = performance.now(); if (n - (last[k] || 0) < ms) return false; last[k] = n; return true; };   // 같은 소리가 겹쳐 쏟아지지 않게
  function env(vol, dur, delay, attack) {          // 부드럽게 올라갔다가 사라지는 크기
    const g = ac.createGain(), t = ac.currentTime + (delay || 0);

    g.connect(out); return [g, t];
  }
  function tone(type, f0, f1, dur, vol, delay, attack) {          // 맑은 음
    const [g, t] = env(vol, dur, delay, attack), o = ac.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);

  }
  function hiss(ftype, f0, f1, q, dur, vol, delay, attack) {      // 바람 소리 (걸러 낸 잡음)
    const [g, t] = env(vol, dur, delay, attack), s = ac.createBufferSource(), f = ac.createBiquadFilter();

    init,
    tap:    safe(() => { if (lim('tap', 50)) tone('triangle', 600, 470, 0.05, 0.24); }),                                  // 단추
    card:   safe(() => { if (lim('card', 90)) tone('sine', 500, 420, 0.1, 0.2); }),                                      // 이야기 카드 넘기기
    hit:    safe(() => { if (!lim('hit', 70)) return; hiss('lowpass', 1400, 450, 0.6, 0.07, 0.26); tone('sine', 140, 85, 0.09, 0.36); }),
    crit:   safe(() => { if (!lim('crit', 70)) return; hiss('bandpass', 3000, 1300, 1.2, 0.09, 0.28); tone('sine', 170, 80, 0.13, 0.42); tone('triangle', 1245, 1568, 0.12, 0.12, 0.012); }),
    skill:  safe(fx => {                                                                                                 // 스킬: 갈래마다 다른 바람 소리
      if (!lim('sk' + fx, 120)) return;
      if (fx === 'slash') { hiss('bandpass', 2600, 520, 1.4, 0.2, 0.9, 0, 0.02); tone('sine', 180, 110, 0.1, 0.16, 0.05); }
      else if (fx === 'ring') { hiss('bandpass', 520, 2300, 1.2, 0.3, 0.85, 0, 0.05); tone('sine', 880, 1320, 0.26, 0.14, 0.03, 0.05); }
      else if (fx === 'flash') { hiss('highpass', 1800, 4000, 0.7, 0.5, 0.13, 0, 0.12); [392, 587, 784].forEach((f, i) => tone('sine', f, f, 0.55, 0.13 - i * 0.03, i * 0.03, 0.09)); }
      else { hiss('bandpass', 2800, 320, 1, 0.34, 0.32, 0, 0.02); tone('sine', 110, 55, 0.4, 0.45); tone('triangle', 1568, 1046, 0.4, 0.08, 0.05); }
    }),
    coin:   safe(() => { if (lim('coin', 150)) { tone('sine', 1760, 1760, 0.07, 0.17); tone('sine', 2637, 2637, 0.11, 0.11, 0.035); } }),
    unlock: safe(() => { if (lim('unlock', 400)) [784, 988, 1175].forEach((f, i) => tone('triangle', f, f, 0.5, 0.2, i * 0.09, 0.01)); }),
    clear:  safe(() => { if (lim('clear', 400)) [523, 659, 784, 1047].forEach((f, i) => tone('sine', f, f, 0.42, 0.22, i * 0.08, 0.01)); }),
    boss:   safe(() => { tone('sine', 72, 40, 0.9, 0.8, 0, 0.01); hiss('lowpass', 300, 80, 0.5, 0.7, 0.35, 0, 0.01); tone('sine', 72, 40, 0.8, 0.55, 0.45, 0.01); }),   // 낮은 북 두 번
    down:   safe(() => { tone('sine', 120, 45, 0.5, 0.6, 0, 0.008); hiss('lowpass', 500, 120, 0.5, 0.35, 0.28); }),
  };
})();

/* ===================================================================== 화면 위에 얹는 것 (HUD) */
/* 몇 번 때리면 쓰러지는가: 강화가 눈에 보이게 하는 숫자 */
const stageHp  = st => Math.round(baseHp(st) * (MONSTERS[st - 1].mult.hp || 1));
const stageAtk = st => Math.max(1, Math.round(baseHp(st) * TUNE.MON_ATK_RATIO * (MONSTERS[st - 1].mult.atk || 1) * (st === 10 ? TUNE.BOSS_ATK_MULT : 1)));
const hitsFor  = (st, atk) => Math.ceil(stageHp(st) / atk);
const NUM_WORD = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
const beon = n => n <= 10 ? NUM_WORD[n] + ' 번' : n + '번';
const UP_INFO = {
  atk:  { name:'공격력',      cur:() => fmt(kAtk()),  next:() => fmt(kAtk() + TUNE.UP.atk.step) },
  hp:   { name:'체력',        cur:() => fmt(kMax()),  next:() => fmt(kMax() + TUNE.UP.hp.step) },
  crit: { name:'치명타 확률', cur:() => Math.round(kCrit() * 100) + '%', next:() => Math.round((kCrit() + TUNE.UP.crit.step) * 100) + '%' },
};
function upHint(key) {                 // 다음 단계가 무엇을 바꾸는가. [글, 지금 바로 좋아지는가]
  const st = S.stage, nm = MONSTERS[st - 1].short;
  if (key === 'atk') {
    const h = hitsFor(st, kAtk());
    if (h <= 1) return [nm + ' 한 번에 잡는다', false];
    for (let n = 1; n <= 300; n++) if (hitsFor(st, kAtk() + TUNE.UP.atk.step * n) < h) {
      const h2 = hitsFor(st, kAtk() + TUNE.UP.atk.step * n);
      return [(n === 1 ? '올리면 ' : n + '번 더 올리면 ') + nm + ' ' + beon(h2) + '에 잡는다', n === 1];
    }
    return ['', false];
  }
  if (key === 'hp') {
    const a = stageAtk(st), n = Math.ceil(kMax() / a), n2 = Math.ceil((kMax() + TUNE.UP.hp.step) / a);
    return [nm + '에게 ' + n + '대 버틴다' + (n2 > n ? ' → ' + n2 + '대' : ''), n2 > n];
  }
  return ['치명타 한 대 ' + fmt(Math.round(kAtk() * TUNE.CRIT_MULT)), false];
}

function buy(key) {
  if (key === 'crit' && S.up.crit >= critMaxLv) return false;
  const p = upPrice(key); if (S.gold < p) return false;

  S.gold -= p; S.up[key]++; Snd.tap();
  if (key === 'hp') R.k.hp = Math.min(kMax(), R.k.hp + TUNE.UP.hp.step);
  if (key === 'atk') {                                     // 공격력을 올려서 한 번 덜 때려도 되면 알려 준다
    const h1 = hitsFor(S.stage, kAtk());
    if (h1 < h0) { const msg = '이제 ' + josa(MONSTERS[S.stage - 1].short, '을', '를') + ' ' + beon(h1) + '에 잡는다'; toast(msg); addLog(msg, 'a'); }
  }

/* ===================================================================== 꾸밈을 얻는 길 */
const isArt = grp => grp.key === 'head' || grp.key === 'armor';
function checkUnlocks(silent) {        // 새로 열린 꾸밈이 있으면 알린다. 처음부터 있는 것은 조용히 적어 둔다
  const g = S.gender, fresh = [];
  for (const grp of COS_GROUPS) {
    if (grp.key === 'weapon') continue;
    for (const it of grp.list) {
      if (isArt(grp) && !hasArt(it, g)) continue;
      const key = grp.key + ':' + it.id + (isArt(grp) ? ':' + g : ''), inf = cosInfo(grp, it, g);
      if (S.got[key] || !condDone(inf.how)) continue;
      S.got[key] = 1;
      if (!condOf(inf.how).free) fresh.push([grp, inf]);
    }
  }

  closeSheet(); checkUnlocks(true); updateDots(); buildSkills(); openStart();
}
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

let startGender = 'm';
function drawStartPreviews() {
  $('start').style.setProperty('--hero', 'url("' + assetUrl(heroPath(startGender)) + '")');   // 고른 기사의 얼굴을 뒤에 깐다
  document.querySelectorAll('.gBtn').forEach(b => {
    const c = b.querySelector('canvas'), g = c.getContext('2d'), a = knightArt(b.dataset.g, BASIC_LOOK), h = 270 * a.hMul, w = h * a.aspect;
    g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 260, 330);
    b.classList.toggle('sel', b.dataset.g === startGender);
    if (a.pending) return;
    const x0 = 130 - w / 2, y0 = 312 - h;
    drawShadow(g, x0 + a.ax * w, 306, 80, 18, 0.6);
    const t = mk(w * 2, h * 2); a.paint(t.getContext('2d'), t.width, t.height);
    g.imageSmoothingQuality = 'high'; g.drawImage(t, x0, y0, w, h);
    glow(g, x0 + a.lantern[0] * w, y0 + a.lantern[1] * h, 56, '#f0983c', 0.5);
  });
}
function redrawStatic() { if (!$('start').classList.contains('hidden')) drawStartPreviews(); }
function openStart() {
  R.paused = true; startGender = S.gender; $('nameIn').value = S.name || '루';
  loadLook('m', BASIC_LOOK); loadLook('f', BASIC_LOOK);
  $('start').classList.remove('hidden'); drawStartPreviews();
}
function startGame() {
  Snd.init();
  S.gender = startGender; S.name = ($('nameIn').value || '').trim().slice(0, 8) || '루'; S.started = true;
  setHeroFace(); fixCos(); checkUnlocks(true); knightSprite = null; $('start').classList.add('hidden'); save();
  if (!S.introDone) playScene('여는장면', beginGame); else beginGame();      // 새 게임은 여는 장면부터
}
function beginGame() {
  R.paused = false; R.k.hp = kMax(); buildSkills(); addLog(ZONE_NAME + '에 들어섰다', 'd'); gotoStage(S.stage); save();
}

/* 쉬는 동안 모은 골드: 최대 30분어치 */
function offlineReward(sec) {
  if (!S.started || sec < 60 || R.hold) return;
  const g = Math.floor(Math.min(sec, TUNE.OFFLINE_CAP_MIN * 60) / TUNE.OFFLINE_SEC_PER_KILL) * goldOf(Math.min(S.stage, 9));
  if (g <= 0) return;
  S.gold += g; save(); addLog('쉬는 동안 +' + fmt(g) + ' 골드', 'g'); refreshHud();
  showCard('<h3>다녀왔습니다</h3><p>쉬는 동안 골드를 모았다.</p><p><b>+' + fmt(g) + ' 골드</b></p><p class="small">최대 ' + TUNE.OFFLINE_CAP_MIN + '분어치까지 쌓입니다.</p>', [{ text:'받기', acc:true }]);
}

/* ===================================================================== 시작 */
function fit() {                       // 화면(바깥 틀이 안전 영역만큼 줄여 준 크기)에 9:16 판을 맞춘다
  const a = $('app'), w = a.clientWidth || innerWidth, h = a.clientHeight || innerHeight;
  const s = Math.min(w / 900, h / 1600);
  $('stage').style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  viewQ = clamp(s * (window.devicePixelRatio || 1), 1, 1.6);
  const cw = Math.round(FW * viewQ), ch = Math.round(FH * viewQ);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
}
let lastT = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const p0 = performance.now(), dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000)); lastT = t;      // 탭이 가려졌다 돌아와도 튀지 않게
  R.frameN++;
  if (!R.paused && !R.hold) {                              // 이야기 카드가 떠 있는 동안(hold)은 들판이 멈춘다
    if (R.stop > 0) R.stop -= dt; else for (let i = 0; i < SPEED; i++) update(dt);   // 짧은 멈춤(히트 스톱)
    R.saveT += dt; if (R.saveT > TUNE.SAVE_EVERY) { R.saveT = 0; save(); }
    R.uiT += dt; if (R.uiT > 0.12) { R.uiT = 0; refreshHud(); if (!R.low) drawMini(); }
    if (R.sceneQ.length && !R.hold && !R.sheet && $('modal').classList.contains('hidden')) {        // 기다리던 장면: 열린 창이 없을 때 시작한다
      const q = R.sceneQ[0]; q.t -= dt;
      if (q.t <= 0) { R.sceneQ.shift(); playScene(q.id); }
    }
  }
  $('face').classList.toggle('hit', R.k.flash > 0 && !R.k.dead); $('face').classList.toggle('down', R.k.dead);   // 맞으면 테가 붉게, 쓰러지면 잿빛
  if (R.low && R.frameN % 10) return;                                         // 절전: 그림은 드물게만 그린다
  if (!R.paused) refreshSkills();
  draw();
  if (R.sheet === 'cos') drawCosPreview(t / 1000);
  R.perfSum += performance.now() - p0; R.perfN++;
}
function init() {
  cv = $('cv'); ctx = cv.getContext('2d');
  document.querySelectorAll('[data-ic]').forEach(e => { e.outerHTML = icon(e.dataset.ic); });
  load(); fixCos();
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  bg = makeBackground(); fg = makeCanopy(); fit(); addEventListener('resize', fit);
  try { if (window.ResizeObserver) new ResizeObserver(fit).observe($('app')); } catch (e) {}
  setHeroFace(); buildSkills();

  // 소리는 화면을 처음 누른 뒤에 켠다. 단추를 누르면 작게 톡 소리가 난다
  document.addEventListener('pointerdown', e => { Snd.init(); if (e.target && e.target.closest && e.target.closest('button')) Snd.tap(); }, true);
  $('stagePill').onclick = () => openSheet('stage');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openSheet(b.dataset.open));
  $('bMore').onclick = () => { $('menu2').classList.toggle('hidden'); $('bMore').classList.toggle('on', !$('menu2').classList.contains('hidden')); };
  $('bLow').onclick = () => { R.low = true; $('lowOv').classList.remove('hidden'); };
  $('lowOv').onclick = () => { R.low = false; $('lowOv').classList.add('hidden'); };
  $('autoSk').onclick = () => { S.autoSkill = !S.autoSkill; refreshHud(); };
  $('logBtn').onclick = () => $('log').classList.toggle('open');
  $('hintTog').onclick = () => { S.hintOff = !S.hintOff; refreshHud(); };
  $('hintUp').onclick = () => openSheet('up');
  $('hintGoal').onclick = () => openSheet('stage');
  $('sheetClose').onclick = closeSheet;
  $('sheetWrap').addEventListener('click', e => { if (e.target === $('sheetWrap')) closeSheet(); });
  $('story').addEventListener('click', e => {               // 이야기 카드: 아무 곳이나 누르면 다음 장 (손을 뗄 때 넘긴다. 밑에 있는 단추가 같이 눌리지 않게)
    if (!story || (e.target.closest && e.target.closest('#stSkip'))) return;
    if (performance.now() - story.t < 260) return;         // 너무 빨리 두 번 눌려서 한 장을 건너뛰지 않게
    Snd.card(); nextCard();
  });
  $('stSkip').onclick = endScene;
  document.querySelectorAll('.gBtn').forEach(b => b.onclick = () => { startGender = b.dataset.g; drawStartPreviews(); });
  $('goBtn').onclick = startGame;
  $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  document.addEventListener('contextmenu', e => e.preventDefault());

  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); if (S.started) save(); }
    else if (hiddenAt) { offlineReward((Date.now() - hiddenAt) / 1000); hiddenAt = 0; }
  });
  addEventListener('pagehide', () => { if (S.started) save(); });

  if (DEBUG) {
    window.__g = { get S() { return S; }, R, TUNE, buy, gotoStage, setMaxStage, openSheet, checkUnlocks, playScene, skipStory:endScene, Snd, castSkill, SKILLS, get story() { return story; }, knightImgs, monSprites };
    addEventListener('keydown', e => {
      if (e.target === $('nameIn') || R.paused || R.hold) return;
      if (e.key === 'n' || e.key === 'N') {             // 스테이지 넘기기
        if (S.stage === 10) { const b = R.mons.find(m => m.def.boss && !m.dead); if (b) { b.hp = 0; killMonster(b); } }
        else { S.kills[S.stage] = S.kills[S.stage] || 1; setMaxStage(S.stage + 1); gotoStage(S.stage + 1); }
      }
      if (e.key === 'g' || e.key === 'G') { S.gold += 1000; refreshHud(); }
    });
  }

  if (S.started) {
    checkUnlocks(); updateDots();                          // 예전 저장이면 그동안 채운 꾸밈을 여기서 한꺼번에 알려 준다
    const go = () => { R.paused = false; R.k.hp = kMax(); addLog('다시 길에 섰다', 'd'); gotoStage(S.stage); offlineReward(away); };
    if (!S.introDone) { R.paused = true; playScene('여는장면', go); } else go();     // 여는 장면을 보다가 나갔으면 이어서 보여 준다
  } else { checkUnlocks(true); openStart(); }
  refreshHud();
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
init();
</script>
</body>
</html>
