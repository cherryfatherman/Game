<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>잊혀진 기사 키우기 · 세로판</title>
<style>
  html, body { margin: 0; height: 100%; background: #070a08; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: min(100vw, 52dvh); height: 100dvh; font-size: calc(min(100vw, 52dvh) / 100); display: flex; flex-direction: column; background: #10150f; overflow: hidden; }

  #stat span.g { color: #ffd27a; } #stat span.j { color: #9fd8ff; } #stat span.a { color: #f6efd8; }
  #tabs { display: flex; gap: 1.2em; padding: 0 3em; }
  #tabs button { flex: 1; font: inherit; font-size: 3.6em; font-weight: 700; color: #cdbf95; background: #232b20; border: 0.14em solid #5c5136; border-bottom: none; border-radius: 0.6em 0.6em 0 0; padding: 0.5em 0; }
  #tabs button.on { color: #2a2112; background: linear-gradient(#f3dfa2, #d6b866); border-color: #f7e8b6; }
  #body { flex: 1; min-height: 0; overflow-y: auto; margin: 0 3em 2.4em; padding: 1.6em 2.4em; background: #161c14; border: 0.3em solid #5c5136; border-radius: 0 0 1.6em 1.6em; font-size: 3.3em; line-height: 1.5; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.8em; padding: 0.7em 0; border-bottom: 0.06em solid rgba(217, 200, 144, 0.22); }
  .act { font: inherit; font-weight: 700; color: #2a2112; background: linear-gradient(#f6e3a8, #d9b95f); border: 0.12em solid #fff2c4; border-radius: 0.6em; padding: 0.55em 0.9em; min-width: 6.2em; text-align: center; box-shadow: 0 0.18em 0 #7d6529; white-space: nowrap; }

  .act.off { filter: grayscale(1) brightness(0.6); box-shadow: none; }
  .dim { color: #a3a792; font-size: 0.84em; } .gold { color: #7a4b00; } .gem { color: #9fd8ff; }
  .mobrow { display: flex; gap: 0.8em; padding: 0.6em 0; border-bottom: 0.06em solid rgba(217, 200, 144, 0.22); }

  .mobrow.no img { filter: brightness(0); opacity: 0.45; }
  .loot { color: #ffe9a8; font-weight: 700; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3em 1em; margin-top: 0.5em; font-size: 0.86em; } .wgrid .no { color: #6f7468; }
  #go { position: absolute; right: 2.4em; bottom: 2.4em; font: inherit; font-size: 3.6em; font-weight: 700; color: #fff4d6; background: linear-gradient(#c8672f, #8f3d18); border: 0.14em solid #ffd58a; border-radius: 0.7em; padding: 0.5em 1em; display: none; box-shadow: 0 0.2em 0 #4d1f0a; }
  #snd { position: absolute; right: 2.2em; top: 14em; font-size: 3em; background: rgba(0, 0, 0, 0.45); color: #fff; border: none; border-radius: 50%; width: 2.2em; height: 2.2em; }

  .t b { color: #ffe9a8; }

  #title h1 small { display: block; font-size: 0.36em; color: #ffd58a; letter-spacing: 0.3em; margin-bottom: 0.3em; }
  #start { font: inherit; font-size: 5em; font-weight: 700; color: #2a2112; background: linear-gradient(#f6e3a8, #d9b95f); border: 0.12em solid #fff2c4; border-radius: 0.6em; padding: 0.5em 2em; box-shadow: 0 0.2em 0 #7d6529; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  #title p { font-size: 2.8em; color: #a3a792; margin-top: 2em; } #title a { color: #d9c890; }

  #cardbox { margin: 0 3em 9em; background: linear-gradient(#232b20, #151a13); border: 0.5em solid #d9c890; border-radius: 2.4em; padding: 3.4em 3.6em 4.4em; color: #f6efd8; min-height: 30em; position: relative; box-shadow: 0 1em 3em rgba(0, 0, 0, 0.6); }
  #who { position: absolute; left: 3em; top: -1.1em; font-size: 3.6em; font-weight: 700; color: #2a2112; background: linear-gradient(#f6e3a8, #d9b95f); border-radius: 0.5em; padding: 0.15em 0.9em; display: none; }
  #face { position: absolute; right: 2em; bottom: 100%; height: 42em; max-width: 60em; object-fit: contain; object-position: bottom; display: none; filter: drop-shadow(0 0 2em rgba(0, 0, 0, 0.8)); pointer-events: none; }

  #say.big { font-size: 7.4em; text-align: center; color: #ffe9a8; padding-top: 0.6em; }
  #say.em { color: #ffe9a8; font-weight: 700; }

  @keyframes bob { 50% { transform: translateY(0.3em); } }
  #skip { position: absolute; right: 3em; top: 3em; font: inherit; font-size: 3em; color: #f3ecd6; background: rgba(0, 0, 0, 0.5); border: 0.1em solid #d9c890; border-radius: 0.6em; padding: 0.3em 0.8em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"><canvas id="c" width="900" height="800"></canvas><button id="snd">♪</button></div>
  <div id="ui">
    <div id="stat"></div>
    <div id="tabs"><button data-tab="up" class="on">강화</button><button data-tab="wp">무기</button><button data-tab="book">도감</button></div>
    <div id="body"></div>
  </div>
  <button id="go"></button>
  <div id="toast"></div>
  <div id="card"><button id="skip">건너뛰기</button><div id="cardbox"><img id="face"><div id="who"></div><div id="say"></div><div id="more">▼</div></div></div>
  <div id="title"><h1><small>잊혀진</small>기사 키우기</h1><button id="start">시작하기</button><p>1~3장을 해 보는 판 · 세로 · <a href="index.html">가로판으로</a></p></div>
</div>
<script src="art/게임/자료.js"></script>
<script>
// 잊혀진 기사 키우기 · 세로판. 위는 싸움 창, 아래는 늘 떠 있는 성장 창.
// 가로판(게임.html)과 같은 그림, 같은 값, 같은 저장을 쓴다. 여기에는 타격감, 보상 연출, 대화 연출, 제목 화면, 소리를 더했다.
const W = 900, VH = 800, H = 900, Z = 1.1, VW = W / Z, TOP = 118, GROUND = 770;     // 싸움 창은 세계를 1.1배로 당겨 보여 준다
const D = window.DATA, $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), IMG = {};
function load(key, src) { if (IMG[key]) return IMG[key].p; const im = new Image(); IMG[key] = im; im.p = new Promise(r => { im.onload = r; im.onerror = r; }); im.src = 'art/게임/' + src; return im.p; }

// ───────── 값 (가로판과 같다) ─────────
const V = {
  stages: 30, chMul: [3.2, 3.0, 2.8, 2.5, 2.3, 2.1, 2.0, 1.9, 1.8, 1.7],
  atkPerLv: 0.03, hpPerLv: 0.08, lootBonus: 0.01, starBonus: 0.10,
  mobDef: 0.3, mobHp: 0.7, bossHp: 40, bossTime: 30, goal: 20, lootRate: 0.08, crit: 0.10, critMul: 1.5, lineCap: 999999,
  wStep: [0, 3, 5, 8], gemStage: 3, gemBoss: 15, gemStart: 5, gemKills: 40, pullDrop: 0.5, pullSpan: 5,
};
const par = s => { let v = 10; for (let i = 0; i < s; i++) v *= Math.pow(V.chMul[Math.floor(i / 10)], 0.1); return v; };
const expect = s => 1 + (V.atkPerLv + V.lootBonus) * s + V.starBonus * Math.floor(s / 10);
const WATK = D.weapons.map((w, k) => { const s = Math.floor(k / 4) * 10 + V.wStep[k % 4]; return Math.max(1, Math.round(par(s) / expect(s))); });
const mobStat = s => { const p = par(s), boss = s % 10 === 9, hp = Math.max(3, Math.round(p * V.mobHp * (boss ? V.bossHp : 1)));
  return { hp, def: Math.floor(p * V.mobDef), atk: Math.max(2, Math.round(100 * (1 + V.hpPerLv * s) / 22 * (boss ? 1.6 : 1))), gold: Math.max(1, Math.round(p * V.mobHp / 4 * (boss ? 10 : 1))) }; };
const upCost = (lv, k) => { const s = Math.min(lv, V.stages - 1); return Math.max(k, Math.round(par(s) * V.mobHp / 4 * k * Math.pow(1.04, Math.max(0, lv - V.stages)))); };
const fmt = n => { n = Math.round(n); return n < 10000 ? n.toLocaleString('ko-KR') : (n / 10000).toFixed(n < 1e6 ? 1 : 0).replace(/\.0$/, '') + '만'; };

const SAVE = 'forgotten-knight-v1';
let S = { stage: 0, cleared: 0, auto: true, gold: 0, gems: V.gemStart, atkLv: 0, hpLv: 0, wc: D.weapons.map((w, i) => i ? 0 : 1), best: 0, loot: {}, stars: 0, seen: {}, kc: 0, mute: false };
try { const j = JSON.parse(localStorage.getItem(SAVE) || 'null'); if (j && j.wc) S = Object.assign(S, j); } catch (e) {}
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };
const lootKinds = () => Object.keys(S.loot).length;
const atk = () => WATK[S.best] * (1 + V.atkPerLv * S.atkLv + V.lootBonus * lootKinds() + V.starBonus * S.stars);
const maxHp = () => Math.round(100 * (1 + V.hpPerLv * S.hpLv));
const lvCap = () => S.cleared + 3;
const needStep = s => Math.min(D.weapons.length - 1, Math.floor(s / 10) * 4 + V.wStep.filter(x => x <= s % 10).length - 1);

// ───────── 소리: 그림도 파일도 없이 코드로 낸다 ─────────
let AC = null;
function tone(f0, f1, dur, type, vol, delay) { if (!AC || S.mute) return; const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02); }
function noise(dur, vol, hp) { if (!AC || S.mute) return; const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200; g.gain.value = vol || 0.12; s.buffer = b; s.connect(f).connect(g).connect(AC.destination); s.start(); }
const SFX = { slash: () => noise(0.09, 0.10, 2200), hit: () => { noise(0.06, 0.14, 500); tone(180, 70, 0.09, 'square', 0.07); }, crit: () => { noise(0.1, 0.2, 400); tone(520, 120, 0.16, 'sawtooth', 0.09); },
  coin: () => tone(1250, 1900, 0.07, 'triangle', 0.05), hurt: () => tone(160, 60, 0.18, 'sawtooth', 0.08), up: () => { tone(520, 780, 0.09, 'triangle', 0.1); tone(780, 1170, 0.14, 'triangle', 0.1, 0.08); },
  pull: () => { tone(400, 900, 0.2, 'sine', 0.09); tone(900, 1400, 0.25, 'triangle', 0.08, 0.16); }, loot: () => { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.3, 'sine', 0.08, i * 0.09)); },
  clear: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.1, i * 0.1)); }, boss: () => { tone(90, 50, 0.9, 'sawtooth', 0.12); noise(0.5, 0.1, 100); }, text: () => tone(700, 650, 0.025, 'square', 0.02), fail: () => { tone(300, 80, 0.6, 'sawtooth', 0.09); } };
const sfx = k => { try { SFX[k] && SFX[k](); } catch (e) {} };

// ───────── 스테이지 ─────────
const stageKey = s => (Math.floor(s / 10) + 1) + '-' + (s % 10 + 1), mobKey = s => (Math.floor(s / 10) + 1) + '-' + String(s % 10 + 1).padStart(2, '0');
let WORLD = 2400, PLATS = [], FLOORS = [], mobs = [], fx = [], nums = [], cam = 0, kills = 0, goal = V.goal, boss = null, timer = 0, phase = 'title', fade = 0, phaseT = 0, swing = 0, freeze = 0, shake = 0, banner = null, coinSnd = 0;
const knight = { x: 300, y: GROUND, floor: 0, dir: 1, state: 'idle', t: 0, atk: 0, jump: null, target: null, hp: 100, hurt: 0 };
const K = { face: -1, s: 0.31, cx: 578, feet: 927, hipL: [498, 742], hipR: [662, 742], hipY: 742, leg: 185, hand: [703, 694], neck: [572, 458], swordLen: 600, grip: 100, rest: -0.405, lamp: [640, 668] };
function rng(seed) { let x = seed * 9301 + 49297; return () => (x = (x * 16807 + 11) % 2147483647) / 2147483647; }
async function enter(s) {
  phase = 'load'; S.stage = s; save();
  const ch = Math.floor(s / 10) + 1, isBoss = s % 10 === 9, key = stageKey(s);
  const need = [load('bg' + D.bg[key], 'bg/' + D.bg[key] + '.jpg'), load('ground' + ch, 'plat/땅-' + ch + '.png')];
  for (const p of D.plat[ch]) need.push(load('p' + p.img, 'plat/' + p.img));
  for (let i = 1; i <= 10; i++) { const k = ch + '-' + String(i).padStart(2, '0'); need.push(load('m' + k, 'mob/' + k + '.png')); }
  await Promise.all(need);
  WORLD = isBoss ? 1300 : 2400; PLATS = []; mobs = []; fx = []; nums = []; kills = 0; goal = isBoss ? 1 : V.goal; boss = null; timer = V.bossTime; swing = 0;
  if (!isBoss) { const r = rng(s + 5), list = D.plat[ch];
    for (let i = 0; i < 4; i++) { const p = list[Math.floor(r() * list.length)], x = 380 + i * 480 + (r() - 0.5) * 140, y = p.kind === 'float' ? [470, 540, 600][Math.floor(r() * 3)] : GROUND - (p.h - p.top) + 14; PLATS.push({ x, y, w: p.w, h: p.h, top: p.top, img: 'p' + p.img }); } }
  FLOORS = [{ x: 0, y: GROUND, w: WORLD }].concat(PLATS.map(p => ({ x: p.x + p.w * 0.1, y: p.y, w: p.w * 0.8 })));
  Object.assign(knight, { x: 180, y: GROUND, floor: 0, dir: 1, state: 'walk', atk: 0, jump: null, hp: maxHp(), hurt: 0 }); cam = 0;
  if (isBoss) { boss = spawn(0, mobKey(s), s, 900); boss.boss = true; phase = 'intro'; sfx('boss'); banner = { text: D.mob[boss.key].name, sub: key + ' 우두머리', t: 0, big: true }; }
  else { fill(true); phase = 'play'; banner = { text: D.places[key] || '', sub: key, t: 0 }; }
  phaseT = 0; fade = 1; dirty = true;
  const diary = D.story.diary[key]; if (diary && !S.seen['d' + key]) { S.seen['d' + key] = 1; setTimeout(() => toast(diary), 1800); }
}
function spawn(floor, key, s, x) {
  const f = FLOORS[floor], d = D.mob[key], st = mobStat(s);
  const m = { key, floor, x: x || f.x + 60 + Math.random() * Math.max(10, f.w - 120), y: f.y, dir: Math.random() < 0.5 ? -1 : 1, hp: st.hp, max: st.hp, def: st.def, atk: st.atk, gold: st.gold,
    t: Math.random() * 9, hit: 0, dead: 0, speed: d.sp * (0.8 + Math.random() * 0.4), wait: 0, cd: 0.8 + Math.random(), lunge: 0, kb: 0, born: 0, h: d.h, w: d.w, fly: d.fly };
  mobs.push(m); return m;
}
function fill(first) {
  if (boss || phase === 'clear') return; const s = S.stage, base = Math.floor(s / 10) * 10;
  for (let i = 0; i < FLOORS.length; i++) { const want = i === 0 ? 5 : FLOORS[i].w > 300 ? 2 : 1;
    while (mobs.filter(m => m.floor === i && !m.dead).length < want) {
      const other = s > base && Math.random() < 0.25 ? base + Math.floor(Math.random() * (s - base)) : s, m = spawn(i, mobKey(other), s);
      if (i === 0 && !first && Math.abs(m.x - knight.x) < 420) m.x = knight.x + (Math.random() < 0.5 ? -1 : 1) * (480 + Math.random() * 400);
      m.x = Math.max(FLOORS[i].x + 40, Math.min(FLOORS[i].x + FLOORS[i].w - 40, m.x)); if (first) m.born = 1; } }
}
function hitMob(m, mult, lines) {
  let anyCrit = false;
  for (let i = 0; i < lines; i++) {
    const a = atk() * mult, c = Math.random() < V.crit; anyCrit = anyCrit || c; let dmg = Math.max(a * 0.1, a - m.def) * (0.9 + Math.random() * 0.2) * (c ? V.critMul : 1);
    dmg = Math.min(V.lineCap, Math.max(1, Math.round(dmg))); m.hp -= dmg;
    nums.push({ x: m.x + (Math.random() - 0.5) * 50, y: m.y - m.h * (m.fly ? 1.5 : 0.85) - i * 50, v: fmt(dmg), t: -i * 0.06, c: c ? '#ffd24a' : '#ffffff', big: c || lines > 1 });
  }
  m.hit = 0.2; if (!m.boss) m.kb = knight.dir * (anyCrit || lines > 1 ? 520 : 340);
  freeze = Math.max(freeze, anyCrit || lines > 1 ? 0.07 : 0.035); shake = Math.max(shake, anyCrit || lines > 1 ? 13 : m.boss ? 5 : 4); sfx(anyCrit || lines > 1 ? 'crit' : 'hit');
  const hy = m.y - m.h * (m.fly ? 1.2 : 0.5); for (let i = 0; i < (anyCrit ? 10 : 6); i++) { const a = Math.random() * 6.28, v = 160 + Math.random() * 320; fx.push({ k: 'spark', x: m.x - knight.dir * 20, y: hy, vx: Math.cos(a) * v + knight.dir * 200, vy: Math.sin(a) * v - 80, t: 0, life: 0.22 + Math.random() * 0.15, c: anyCrit ? '#ffd24a' : '#fff6d8' }); }
  fx.push({ k: 'ring', x: m.x - knight.dir * 20, y: hy, t: 0, life: 0.2, r: anyCrit ? 90 : 60 });
  if (m.hp <= 0 && !m.dead) {
    m.dead = 0.001; m.kb = knight.dir * 420; kills++; S.gold += m.gold; S.kc = (S.kc || 0) + 1; knight.hp = Math.min(maxHp(), knight.hp + maxHp() * 0.04);
    if (S.kc % V.gemKills === 0) { S.gems++; fx.push({ k: 'word', x: m.x, y: m.y - m.h - 40, t: 0, life: 1.4, text: '보석 +1', c: '#9fd8ff' }); }
    for (let i = 0; i < (m.boss ? 46 : 8); i++) fx.push({ k: 'mist', x: m.x + (Math.random() - 0.5) * m.w, y: m.y - Math.random() * m.h, vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 70, r: 20 + Math.random() * 30, t: 0, life: 0.7 + Math.random() * 0.5 });
    for (let i = 0; i < (m.boss ? 24 : 3 + Math.floor(Math.random() * 3)); i++) fx.push({ k: 'coin', x: m.x + (Math.random() - 0.5) * 30, y: m.y - m.h * 0.4, vx: (Math.random() - 0.5) * (m.boss ? 700 : 320), vy: -380 - Math.random() * 260, gy: FLOORS[m.floor].y - 12, t: 0, life: 3 });
    fx.push({ k: 'word', x: m.x, y: m.y - m.h * (m.fly ? 1.6 : 1) - 10, t: 0, life: 1.1, text: '+' + fmt(m.gold), c: '#ffd27a' });
    if (m.boss || Math.random() < V.lootRate) getLoot(m);
    if (kills >= goal && phase === 'play') { phase = 'clear'; phaseT = 0; sfx('clear'); banner = { text: boss ? '별이 깨어난다' : '통과', sub: stageKey(S.stage), t: 0, band: true }; }
    dirty = true;
  }
}

function say(s, x, y, c, a, size, bold) { ctx.font = (bold === false ? '' : 'bold ') + (size || 30) + 'px sans-serif'; ctx.textAlign = a || 'left'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, (size || 30) / 5); ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y); }

let hpShow = 1, bossShow = 1;

    if (banner.band) { ctx.fillStyle = (banner.dark ? 'rgba(40,8,8,' : 'rgba(20,16,6,') + 0.72 * a + ')'; ctx.fillRect(0, 300, W, 150); ctx.fillStyle = 'rgba(255,225,150,' + 0.9 * a + ')'; ctx.fillRect(0, 300, W, 5); ctx.fillRect(0, 445, W, 5); }

let last = 0, dirty = true;
function frame(now) {

let TAB = 'up', lastPull = '';

  const g = $('go'), show = !S.auto && S.cleared < V.stages && phase === 'play'; g.style.display = show ? 'block' : 'none'; g.textContent = S.stage % 10 === 8 ? '우두머리 도전 ▶' : '다음 스테이지 ▶';

      '<div class="row"><div><b>체력 Lv.' + S.hpLv + '</b><br><span class="dim">체력 +' + V.hpPerLv * 100 + '% · 지금 ' + fmt(maxHp()) + '</span></div>' + btn('hp', ch, S.hpLv) + '</div>' +
      '<p class="dim">강화 ' + Math.round(V.atkPerLv * S.atkLv * 100) + '% + 도감 ' + lootKinds() + '% + 별 ' + S.stars * 10 + '% · 지금 ' + cap + '레벨까지 열림. 스테이지를 깨면 더 열린다.</p>'; }
