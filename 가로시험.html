<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잊혀진 기사 키우기 · 가로 시험판 1-1</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c120c; overflow: hidden; }
  canvas { display: block; margin: 0 auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
// 가로 시험판: 1-1 숲 들머리. 흐르는 배경, 여러 층 발판, 걷고 뛰고 휘두르는 기사, 좌우로 다니는 몬스터.
// 기준 화면 1600×900. 그림은 tools/가로자산.py 가 만든다.
const W = 1600, H = 900, WORLD = 4200, GROUND = 760;       // GROUND: 땅 윗면의 y
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {};
function load(key, src) { const im = new Image(); im.src = src; IMG[key] = im; return new Promise(r => { im.onload = r; im.onerror = r; }); }

// 무기: 도감 순서 가운데 몇 자루. 화면을 누르면 다음 무기로 바뀐다.
const WEAPONS = ['목검', '녹슨검', '경비대의칼', '달밤의칼', '레이피어', '은검', '폭풍의검', '불꽃검', '기사단장의검', '마녀의검', '기억의검'];
let weapon = 0;

// 발판: x, y(윗면), 그림, 그림 안에서 윗면이 있는 y, 딛는 폭
// 그림 두 벌: 가 = 기사 그림체로 통일, 나 = 몬스터 그림체(유화풍)로 통일. 왼쪽 아래 단추로 바꾼다.
let SET = '나';
const TOP = { 가: { ground: 28, mid: 28, small: 20, log: 46 }, 나: { ground: 18, mid: 43, small: 23, log: 60 } };
const PLATS = [
  { x: 520,  y: 560, img: 'mid',  w: 600 },
  { x: 1250, y: 420, img: 'small', w: 250 },
  { x: 1650, y: 590, img: 'log',  w: 440 },
  { x: 2250, y: 540, img: 'mid',  w: 600 },
  { x: 2980, y: 400, img: 'small', w: 250 },
  { x: 3350, y: 580, img: 'mid',  w: 600 },
];
const FLOORS = [{ x: 0, y: GROUND, w: WORLD }].concat(PLATS.map(p => ({ x: p.x + 20, y: p.y, w: p.w - 40 })));

// 기사 인형(1024 그림 기준 좌표)
const K = { s: 0.31, cx: 575, feet: 929, hipL: [520, 716], hipR: [640, 716], hand: [707, 690], neck: [560, 440], swordLen: 600, grip: 100, rest: -0.405 };
const knight = { x: 300, y: GROUND, floor: 0, dir: 1, state: 'walk', t: 0, atk: 0, jump: null, target: null };

const mobs = [];
function spawn(floor) {
  const f = FLOORS[floor];
  mobs.push({ floor, x: f.x + 60 + Math.random() * (f.w - 120), y: f.y, dir: Math.random() < 0.5 ? -1 : 1, hp: 3, t: Math.random() * 9, hit: 0, dead: 0, speed: 38 + Math.random() * 30, wait: 0 });
}
function fill() { for (let i = 0; i < FLOORS.length; i++) { const want = i === 0 ? 7 : 2; while (mobs.filter(m => m.floor === i && !m.dead).length < want) spawn(i); } }

const nums = [];        // 떠오르는 피해 숫자
let cam = 0, last = 0, kills = 0;

function update(dt) {
  knight.t += dt;
  for (const m of mobs) {
    m.t += dt; if (m.hit > 0) m.hit -= dt;
    if (m.dead) { m.dead += dt; continue; }
    if (m.wait > 0) { m.wait -= dt; continue; }
    const f = FLOORS[m.floor];
    m.x += m.dir * m.speed * dt;
    if (m.x < f.x + 40) { m.x = f.x + 40; m.dir = 1; }
    if (m.x > f.x + f.w - 40) { m.x = f.x + f.w - 40; m.dir = -1; }
    if (Math.random() < dt * 0.25) m.wait = 0.5 + Math.random();           // 가끔 멈춰 선다
    if (Math.random() < dt * 0.15) m.dir *= -1;
  }
  for (let i = mobs.length - 1; i >= 0; i--) if (mobs[i].dead > 0.5) mobs.splice(i, 1);
  if (Math.random() < dt * 0.6) fill();

  // 기사: 가장 가까운 몬스터를 찾아 가서 벤다. 층이 다르면 뛰어오른다.
  if (knight.jump) {
    const j = knight.jump; j.t += dt / j.dur; const k = Math.min(1, j.t);
    knight.x = j.x0 + (j.x1 - j.x0) * k;
    knight.y = j.y0 + (j.y1 - j.y0) * k - Math.sin(Math.PI * k) * j.h;
    if (k >= 1) { knight.floor = j.to; knight.y = j.y1; knight.jump = null; knight.state = 'walk'; }
  } else {
    let best = null, bd = 1e9;
    for (const m of mobs) { if (m.dead) continue; const d = Math.abs(m.x - knight.x) + (m.floor === knight.floor ? 0 : 500) + Math.abs(m.y - knight.y) * 0.6; if (d < bd) { bd = d; best = m; } }
    knight.target = best;
    if (knight.atk > 0) {
      const before = knight.atk; knight.atk -= dt;
      if (before > 0.2 && knight.atk <= 0.2) {                              // 내려치는 순간
        for (const m of mobs) if (!m.dead && m.floor === knight.floor && (m.x - knight.x) * knight.dir > -30 && Math.abs(m.x - knight.x) < 175) {
          const dmg = 8 + weapon * 6 + Math.floor(Math.random() * 5); m.hp -= 1 + Math.floor(weapon / 3); m.hit = 0.18;
          nums.push({ x: m.x + (Math.random() - 0.5) * 50, y: m.y - 150 - Math.random() * 30, v: dmg, t: 0 });
          if (m.hp <= 0) { m.dead = 0.001; kills++; }
        }
      }
      if (knight.atk <= 0) knight.state = 'walk';
    } else if (best) {
      if (best.floor !== knight.floor) {
        const f = FLOORS[best.floor]; const x1 = Math.max(f.x + 50, Math.min(f.x + f.w - 50, best.x - 90 * Math.sign(best.x - knight.x || 1)));
        if (Math.abs(x1 - knight.x) > 420) { knight.dir = Math.sign(x1 - knight.x); knight.x += knight.dir * 250 * dt; knight.state = 'walk'; }
        else { knight.dir = Math.sign(x1 - knight.x) || knight.dir; knight.state = 'jump'; knight.jump = { t: 0, dur: 0.55, x0: knight.x, y0: knight.y, x1, y1: f.y, h: 120 + Math.max(0, knight.y - f.y) * 0.25, to: best.floor }; }
      } else {
        const dx = best.x - knight.x; knight.dir = Math.sign(dx) || knight.dir;
        if (Math.abs(dx) > 130) { knight.x += knight.dir * 250 * dt; knight.state = 'walk'; }
        else { knight.state = 'attack'; knight.atk = 0.42; }
      }
    } else knight.state = 'idle';
  }
  knight.x = Math.max(60, Math.min(WORLD - 60, knight.x));
  cam += (Math.max(0, Math.min(WORLD - W, knight.x - W * 0.42)) - cam) * Math.min(1, dt * 4);
  for (const n of nums) n.t += dt;
  while (nums.length && nums[0].t > 0.8) nums.shift();
}

function drawBack() {
  const bg = IMG.bg; if (!bg.width) { ctx.fillStyle = '#16241a'; ctx.fillRect(0, 0, W, H); return; }
  const bw = bg.width * (H / bg.height), off = (cam * 0.25) % (bw * 2);
  for (let i = -1; i < 4; i++) {                                           // 그림과 뒤집은 그림을 번갈아 이어 붙인다
    const x = i * bw - off; if (x > W || x + bw < 0) continue;
    ctx.save();
    if (((i % 2) + 2) % 2 === 1) { ctx.translate(x + bw, 0); ctx.scale(-1, 1); ctx.drawImage(bg, 0, 0, bw + 1, H); }
    else ctx.drawImage(bg, x, 0, bw + 1, H);
    ctx.restore();
  }
            // 먼 배경을 한 톤 눌러 앞쪽이 살게 한다
}
function drawPlats() {
  const T = TOP[SET];
  for (const p of PLATS) { const im = IMG[SET + p.img]; ctx.drawImage(im, p.x + (p.w - im.width) / 2 - cam, p.y - T[p.img]); }
  const g = IMG[SET + 'ground'], gw = g.width; if (!gw) return;
  ctx.fillStyle = '#0d0b08'; ctx.fillRect(0, GROUND - T.ground + g.height - 40, W, H);
  for (let x = -((cam) % gw) - gw; x < W + gw; x += gw) ctx.drawImage(g, x, GROUND - T.ground);
}
function shadow(x, y, r) { ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x, y + 4, r, r * 0.22, 0, 0, 7); ctx.fill(); }

function drawMob(m) {
  const im = IMG[SET + 'mob'], s = 0.48, bob = m.wait > 0 ? 0 : Math.abs(Math.sin(m.t * 9)) * 9, sq = m.wait > 0 ? 1 + Math.sin(m.t * 3) * 0.02 : 1 + Math.sin(m.t * 18) * 0.04;
  const x = m.x - cam; if (x < -200 || x > W + 200) return;
  shadow(x, m.y, 42 - bob * 0.8);
  ctx.save(); ctx.translate(x, m.y - bob);
  if (m.dead) { ctx.globalAlpha = Math.max(0, 1 - m.dead * 2); ctx.translate(0, -m.dead * 80); ctx.rotate(m.dead * 2 * -m.dir); }
  ctx.scale(m.dir > 0 ? -s : s, s / sq * (m.hit > 0 ? 0.9 : 1));          // 그림은 왼쪽을 본다
  if (m.hit > 0) ctx.filter = 'brightness(2.2)';
  ctx.drawImage(im, -im.width / 2, -im.height);
  ctx.restore();
}

function part(key, pivot, ang) {
  const im = IMG[SET + key];
  if (!ang) { ctx.drawImage(im, 0, 0); return; }
  ctx.save(); ctx.translate(pivot[0], pivot[1]); ctx.rotate(ang); ctx.translate(-pivot[0], -pivot[1]); ctx.drawImage(im, 0, 0); ctx.restore();
}
function drawKnight() {
  const k = knight, t = k.t, walking = k.state === 'walk', air = !!k.jump;
  let leg = 0, bob = Math.sin(t * 2.4) * 3, lean = 0, sword = K.rest + Math.sin(t * 2.4) * 0.03, head = Math.sin(t * 2.4 + 0.6) * 0.02;
  if (walking) { leg = Math.sin(t * 13) * 0.42; bob = Math.abs(Math.sin(t * 13)) * -9; lean = 0.05; sword = K.rest + Math.sin(t * 13) * 0.1; head = Math.sin(t * 13) * 0.03; }
  if (air) { leg = 0.5; lean = 0.08; sword = K.rest + 0.9; head = -0.06; bob = 0; }
  if (k.atk > 0) {
    const p = 1 - k.atk / 0.42;                                             // 0→1
    sword = p < 0.45 ? K.rest + (p / 0.45) * 1.75 : K.rest + 1.75 - ((p - 0.45) / 0.3) * 2.9;
    if (p > 0.75) sword = K.rest - 1.15 + ((p - 0.75) / 0.25) * 1.15;
    lean = p < 0.45 ? -0.07 : 0.16; leg = 0.2; bob = p < 0.45 ? -6 : 6;
  }
  const x = k.x - cam;
  shadow(x, air ? FLOORS[k.jump.to].y : k.y, 50);
  ctx.save(); ctx.translate(x, k.y); ctx.scale(-k.dir * K.s, K.s); ctx.translate(-K.cx, -K.feet);   // 그림은 왼쪽을 본다
  part('legL', K.hipL, leg); part('legR', K.hipR, -leg);
  ctx.save(); ctx.translate(K.cx, 716 + bob); ctx.rotate(-lean); ctx.translate(-K.cx, -716);
  ctx.drawImage(IMG[SET + 'body'], 0, 0);
  const sw = IMG['w' + weapon];
  if (sw && sw.width) {
    const h = sw.height * K.swordLen / sw.width;
    ctx.save(); ctx.translate(K.hand[0], K.hand[1]); ctx.rotate(-sword); ctx.drawImage(sw, -(K.swordLen - K.grip), -h / 2, K.swordLen, h); ctx.restore();
  }
  ctx.drawImage(IMG[SET + 'hand'], 0, 0);
  part('head', K.neck, head);
  ctx.restore(); ctx.restore();
  if (k.atk > 0 && k.atk < 0.22) {                                          // 베는 자국
    ctx.save(); ctx.translate(x + k.dir * 60, k.y - 95); ctx.scale(k.dir, 1); ctx.globalAlpha = k.atk / 0.22 * 0.85;
    ctx.strokeStyle = '#fff6d8'; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 105, -1.1, 1.0); ctx.stroke();
    ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 122, -0.9, 0.8); ctx.stroke(); ctx.restore();
  }
}
// 장면 전체에 같은 빛을 입힌다: 숲 그늘 색을 곱하고, 위에서 내려오는 아침 햇살을 더하고, 가장자리를 어둡게.
let LIGHT = null;
function drawLight() {
  if (!LIGHT) {
    LIGHT = document.createElement('canvas'); LIGHT.width = W; LIGHT.height = H; const c = LIGHT.getContext('2d');
    const g = c.createRadialGradient(W * 0.55, -80, 60, W * 0.55, 200, 1000);
    g.addColorStop(0, 'rgba(255,236,190,0.30)'); g.addColorStop(0.5, 'rgba(255,230,180,0.10)'); g.addColorStop(1, 'rgba(255,230,180,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }
  ctx.save();
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgb(206,224,214)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen'; ctx.drawImage(LIGHT, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  v.addColorStop(0, 'rgba(4,10,8,0)'); v.addColorStop(1, 'rgba(4,10,8,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function drawHud() {
  ctx.font = 'bold 34px sans-serif'; ctx.textBaseline = 'top'; ctx.lineJoin = 'round';
  const say = (s, x, y, c, a) => { ctx.textAlign = a || 'left'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y); };
  say('1-1 숲 들머리', 30, 24, '#f4ead0');
  say('잡은 수 ' + kills, 30, 70, '#ffd27a');
  say('무기: ' + WEAPONS[weapon].replace(/(의|던)/g, '$1 ').replace('있던 ', '있던 '), W - 30, 24, '#f4ead0', 'right');
  ctx.font = '24px sans-serif'; say('화면을 누르면 무기가 바뀝니다 · 시험판', W - 30, 70, '#cfd8c4', 'right');
  ctx.fillStyle = 'rgba(12,18,14,0.82)'; ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(24, H - 96, 470, 72, 16); ctx.fill(); ctx.stroke();
  ctx.font = 'bold 30px sans-serif'; ctx.textBaseline = 'middle'; say(SET === '가' ? '가 · 기사 그림체로 통일 ⇄' : '나 · 몬스터 그림체로 통일 ⇄', 259, H - 60, '#f4ead0', 'center'); ctx.textBaseline = 'top';
  ctx.font = 'bold 40px sans-serif';
  for (const n of nums) { ctx.globalAlpha = 1 - n.t / 0.8; say(String(n.v), n.x - cam, n.y - n.t * 70, '#fff', 'center'); } ctx.globalAlpha = 1;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  update(dt);
  drawBack(); drawPlats();
  const all = mobs.map(m => ({ y: m.y, f: () => drawMob(m) })).concat([{ y: knight.jump ? 9999 : knight.y + 1, f: drawKnight }]).sort((a, b) => a.y - b.y);
  for (const a of all) a.f();
  drawLight();
  drawHud();
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x < 510 && y > H - 110) SET = SET === '가' ? '나' : '가'; else weapon = (weapon + 1) % WEAPONS.length;
});
Promise.all([
  load('bg', 'art/맵/1-1-먼배경.jpg'),
  load('가ground', 'art/맵/1구역-땅.png'), load('가mid', 'art/맵/1구역-발판-중.png'), load('가small', 'art/맵/1구역-발판-소.png'), load('가log', 'art/맵/1구역-통나무.png'),
  load('나ground', 'art/맵/1구역-나-땅.png'), load('나mid', 'art/맵/1구역-나-발판-중.png'), load('나small', 'art/맵/1구역-나-발판-소.png'), load('나log', 'art/맵/1구역-나-통나무.png'),
  load('가mob', 'art/맵/다람쥐-가.png'), load('나mob', 'art/맵/다람쥐-나.png'),
  load('가body', 'art/knight/인형/남-몸통.png'), load('가legL', 'art/knight/인형/남-왼다리.png'), load('가legR', 'art/knight/인형/남-오른다리.png'), load('가hand', 'art/knight/인형/남-손.png'), load('가head', 'art/knight/인형/남-머리.png'),
  load('나body', 'art/knight/인형/남-나-몸통.png'), load('나legL', 'art/knight/인형/남-나-왼다리.png'), load('나legR', 'art/knight/인형/남-나-오른다리.png'), load('나hand', 'art/knight/인형/남-나-손.png'), load('나head', 'art/knight/인형/남-나-머리.png'),
].concat(WEAPONS.map((w, i) => load('w' + i, 'art/무기/' + w + '.png')))).then(() => { fill(); window.__ready = true; requestAnimationFrame(frame); });
</script>
</body>
</html>
