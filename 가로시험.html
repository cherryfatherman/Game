<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잊혀진 기사 키우기 · 가로 시험판 1-1</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c120c; overflow: hidden; }
  canvas { display: block; margin: 0 auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="900"></canvas>
<script>
// 가로 시험판: 1-1 숲 들머리. 흐르는 배경, 여러 층 발판, 걷고 뛰고 휘두르는 기사, 좌우로 다니는 몬스터.
// 기준 화면 1600×900. 그림은 tools/가로자산.py 가 만든다.
const W = 1600, H = 900, WORLD = 4200, GROUND = 760;       // GROUND: 땅 윗면의 y
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {};
function load(key, src) { const im = new Image(); im.src = src; IMG[key] = im; return new Promise(r => { im.onload = r; im.onerror = r; }); }

// 무기: 도감 순서 가운데 몇 자루. 화면을 누르면 다음 무기로 바뀐다.
const WEAPONS = ['목검', '녹슨검', '경비대의칼', '달밤의칼', '레이피어', '은검', '폭풍의검', '불꽃검', '기사단장의검', '마녀의검', '기억의검'];
let weapon = 0;
let stars = 0;          // 모은 별(0~7). 별이 늘수록 깜빡이가 밝아진다. 시험판에서는 오른쪽 아래 단추로 바꿔 본다.

// 발판: x, y(윗면), 그림, 그림 안에서 윗면이 있는 y, 딛는 폭
// 그림 두 벌: 가 = 기사 그림체로 통일, 나 = 몬스터 그림체(유화풍)로 통일. 왼쪽 아래 단추로 바꾼다.
let SET = '라';
const TOP = { 가: { ground: 36, mid: 36, small: 28, log: 52 }, 나: { ground: 34, mid: 66, small: 44, log: 80 },
  다: { ground: 30, mid: 34, small: 36, log: 44 }, 라: { ground: 30, mid: 34, small: 36, log: 44 } };   // 딛는 자리는 풀 끝이 아니라 윗면 안쪽이다
const PLATS = [
  { x: 520,  y: 560, img: 'mid',  w: 600 },
  { x: 1250, y: 420, img: 'small', w: 250 },
  { x: 1650, y: 590, img: 'log',  w: 440 },
  { x: 2250, y: 540, img: 'mid',  w: 600 },
  { x: 2980, y: 400, img: 'small', w: 250 },
  { x: 3350, y: 580, img: 'mid',  w: 600 },
];
const FLOORS = [{ x: 0, y: GROUND, w: WORLD }].concat(PLATS.map(p => ({ x: p.x + 20, y: p.y, w: p.w - 40 })));

// 기사 인형(1024 그림 기준 좌표)
const K0 = { face: -1, hipY: 716, leg: 213,  s: 0.31, cx: 575, feet: 929, hipL: [520, 716], hipR: [640, 716], hand: [707, 690], neck: [560, 440], swordLen: 600, grip: 100, rest: -0.405, lamp: [662, 668] };
// 다: 기준 그림체의 기사. 오른쪽을 보고 선 그림이라 face 가 1이다.
const K다 = { face: 1, s: 0.31, cx: 440, feet: 960, hipL: [440, 745], hipR: [545, 745], hipY: 745, leg: 215, hand: [372, 720], neck: [500, 495], swordLen: 600, grip: 100, rest: -0.405, lamp: [424, 692] };
// 라: 2026-11-18 시험 세트의 기사(밝은 살빛, 방향 없는 빛). 왼쪽을 보고 선 그림.
const K라 = { face: -1, s: 0.31, cx: 578, feet: 927, hipL: [498, 742], hipR: [662, 742], hipY: 742, leg: 185, hand: [703, 694], neck: [572, 458], swordLen: 600, grip: 100, rest: -0.405, lamp: [640, 668] };
const KS = { 가: K0, 나: K0, 다: K다, 라: K라 };
let K = K다;
const knight = { x: 300, y: GROUND, floor: 0, dir: 1, state: 'walk', t: 0, atk: 0, jump: null, target: null };

const mobs = [];
function spawn(floor) {
  const f = FLOORS[floor];
  mobs.push({ floor, x: f.x + 60 + Math.random() * (f.w - 120), y: f.y, dir: Math.random() < 0.5 ? -1 : 1, hp: 3, t: Math.random() * 9, hit: 0, dead: 0, speed: 38 + Math.random() * 30, wait: 0 });
}
function fill() { for (let i = 0; i < FLOORS.length; i++) { const want = i === 0 ? 7 : 2; while (mobs.filter(m => m.floor === i && !m.dead).length < want) spawn(i); } }

const mist = [];        // 쓰러질 때 흩어지는 검은 안개
const nums = [];        // 떠오르는 피해 숫자
let cam = 0, last = 0, kills = 0;

function update(dt) {
  knight.t += dt;
  for (const m of mobs) {
    m.t += dt; if (m.hit > 0) m.hit -= dt;
    if (m.dead) { m.dead += dt; continue; }
    if (m.wait > 0) { m.wait -= dt; continue; }
    const f = FLOORS[m.floor];
    m.x += m.dir * m.speed * dt;
    if (m.x < f.x + 40) { m.x = f.x + 40; m.dir = 1; }
    if (m.x > f.x + f.w - 40) { m.x = f.x + f.w - 40; m.dir = -1; }
    if (Math.random() < dt * 0.25) m.wait = 0.5 + Math.random();           // 가끔 멈춰 선다
    if (Math.random() < dt * 0.15) m.dir *= -1;
  }
  for (let i = mobs.length - 1; i >= 0; i--) if (mobs[i].dead > 0.5) mobs.splice(i, 1);
  if (Math.random() < dt * 0.6) fill();

  // 기사: 가장 가까운 몬스터를 찾아 가서 벤다. 층이 다르면 뛰어오른다.
  if (knight.jump) {
    const j = knight.jump; j.t += dt / j.dur; const k = Math.min(1, j.t);
    knight.x = j.x0 + (j.x1 - j.x0) * k;
    knight.y = j.y0 + (j.y1 - j.y0) * k - Math.sin(Math.PI * k) * j.h;
    if (k >= 1) { knight.floor = j.to; knight.y = j.y1; knight.jump = null; knight.state = 'walk'; }
  } else {
    let best = null, bd = 1e9;
    for (const m of mobs) { if (m.dead) continue; const d = Math.abs(m.x - knight.x) + (m.floor === knight.floor ? 0 : 500) + Math.abs(m.y - knight.y) * 0.6; if (d < bd) { bd = d; best = m; } }
    knight.target = best;
    if (knight.atk > 0) {
      const before = knight.atk; knight.atk -= dt;
      if (before > 0.2 && knight.atk <= 0.2) {                              // 내려치는 순간
        for (const m of mobs) if (!m.dead && m.floor === knight.floor && (m.x - knight.x) * knight.dir > -30 && Math.abs(m.x - knight.x) < 175) {
          const dmg = 8 + weapon * 6 + Math.floor(Math.random() * 5); m.hp -= 1 + Math.floor(weapon / 3); m.hit = 0.18;
          nums.push({ x: m.x + (Math.random() - 0.5) * 50, y: m.y - 150 - Math.random() * 30, v: dmg, t: 0 });
          if (m.hp <= 0) { m.dead = 0.001; kills++; for (let i = 0; i < 9; i++) mist.push({ x: m.x + (Math.random() - 0.5) * 70, y: m.y - 20 - Math.random() * 110, vx: (Math.random() - 0.5) * 70, vy: -30 - Math.random() * 60, r: 22 + Math.random() * 30, t: 0, life: 0.7 + Math.random() * 0.5 }); }
        }
      }
      if (knight.atk <= 0) knight.state = 'walk';
    } else if (best) {
      if (best.floor !== knight.floor) {
        const f = FLOORS[best.floor]; const x1 = Math.max(f.x + 50, Math.min(f.x + f.w - 50, best.x - 90 * Math.sign(best.x - knight.x || 1)));
        if (Math.abs(x1 - knight.x) > 420) { knight.dir = Math.sign(x1 - knight.x); knight.x += knight.dir * 250 * dt; knight.state = 'walk'; }
        else { knight.dir = Math.sign(x1 - knight.x) || knight.dir; knight.state = 'jump'; knight.jump = { t: 0, dur: 0.55, x0: knight.x, y0: knight.y, x1, y1: f.y, h: 120 + Math.max(0, knight.y - f.y) * 0.25, to: best.floor }; }
      } else {
        const dx = best.x - knight.x; knight.dir = Math.sign(dx) || knight.dir;
        if (Math.abs(dx) > 130) { knight.x += knight.dir * 250 * dt; knight.state = 'walk'; }
        else { knight.state = 'attack'; knight.atk = 0.42; }
      }
    } else knight.state = 'idle';
  }
  knight.x = Math.max(60, Math.min(WORLD - 60, knight.x));
  cam += (Math.max(0, Math.min(WORLD - W, knight.x - W * 0.42)) - cam) * Math.min(1, dt * 4);
  for (const q of mist) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += 26 * dt; }
  for (let i = mist.length - 1; i >= 0; i--) if (mist[i].t > mist[i].life) mist.splice(i, 1);
  for (const n of nums) n.t += dt;
  while (nums.length && nums[0].t > 0.8) nums.shift();
}

function drawBack() {
  const bg = SET === '라' ? IMG.bg라 : IMG.bg; if (!bg.width) { ctx.fillStyle = '#16241a'; ctx.fillRect(0, 0, W, H); return; }
  const bw = bg.width * (H / bg.height), off = (cam * 0.25) % (bw * 2);
  for (let i = -1; i < 4; i++) {                                           // 그림과 뒤집은 그림을 번갈아 이어 붙인다
    const x = i * bw - off; if (x > W || x + bw < 0) continue;
    ctx.save();
    if (((i % 2) + 2) % 2 === 1) { ctx.translate(x + bw, 0); ctx.scale(-1, 1); ctx.drawImage(bg, 0, 0, bw + 1, H); }
    else ctx.drawImage(bg, x, 0, bw + 1, H);
    ctx.restore();
  }
            // 먼 배경을 한 톤 눌러 앞쪽이 살게 한다
  const md = IMG.mid라;                                                    // 가운데 겹: 큰 나무와 덤불. 먼 배경보다 빨리, 발판보다 느리게 흐른다
  if (SET === '라' && md && md.width) {
    const mw = md.width * (H / md.height), mo = (cam * 0.5) % (mw * 2);
    for (let i = -1; i < 4; i++) {
      const x = i * mw - mo; if (x > W || x + mw < 0) continue;
      ctx.save();
      if (((i % 2) + 2) % 2 === 1) { ctx.translate(x + mw, 0); ctx.scale(-1, 1); ctx.drawImage(md, 0, 0, mw + 1, H); }
      else ctx.drawImage(md, x, 0, mw + 1, H);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(18,30,24,0.28)'; ctx.fillRect(0, 0, W, H);       // 뒤쪽 두 겹을 한 톤 눌러 발판과 캐릭터가 살게 한다
  }
}
function drawPlats() {
  const T = TOP[SET];
  for (const p of PLATS) { const im = IMG[SET + p.img]; ctx.drawImage(im, p.x + (p.w - im.width) / 2 - cam, p.y - T[p.img]); }
  const g = IMG[SET + 'ground'], gw = g.width; if (!gw) return;
  for (let x = -((cam) % gw) - gw; x < W + gw; x += gw) ctx.drawImage(g, x, GROUND - T.ground);
  const fy = GROUND - T.ground + g.height - 34, fg = ctx.createLinearGradient(0, fy - 30, 0, fy + 10);   // 땅 그림의 들쭉날쭉한 아래쪽을 어둠으로 덮는다
  fg.addColorStop(0, 'rgba(10,9,7,0)'); fg.addColorStop(1, 'rgba(10,9,7,1)'); ctx.fillStyle = fg; ctx.fillRect(0, fy - 30, W, 40); ctx.fillStyle = 'rgb(10,9,7)'; ctx.fillRect(0, fy + 10, W, H);
}
function shadow(x, y, r) {                                                  // 발이 닿는 자리의 그림자: 가운데가 짙다
  const g = ctx.createRadialGradient(x, y, 2, x, y, r); g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.translate(0, y); ctx.scale(1, 0.26); ctx.translate(0, -y); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}

// 검은 무늬: 망각수에게 물든 표시. 그림을 다시 뽑지 않고, 몬스터 그림 위에 코드로 얹는다(그림의 모양 안쪽에만 칠해진다).
const STAIN = {};
function stained(key, level) {
  const id = key + level; if (STAIN[id]) return STAIN[id];
  const im = IMG[key], c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const g = c.getContext('2d');
  g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-atop';
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const u = Math.max(im.width, im.height) / 100;                            // 그림 크기에 맞춘 단위
  const sh = g.createLinearGradient(0, im.height * 0.35, 0, im.height);    // 아래쪽이 조금 어둡게 물든다
  sh.addColorStop(0, 'rgba(12,8,18,0)'); sh.addColorStop(1, 'rgba(12,8,18,' + (0.16 + level * 0.07) + ')'); g.fillStyle = sh; g.fillRect(0, 0, im.width, im.height);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const vein = (x, y, a, w, n) => {
    for (let i = 0; i < n && w > 0.3; i++) {
      const len = (5 + rnd() * 6) * u, nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len, mx = (x + nx) / 2 + (rnd() - 0.5) * 5 * u, my = (y + ny) / 2 + (rnd() - 0.5) * 5 * u;
      g.strokeStyle = 'rgba(14,10,22,0.78)'; g.lineWidth = w * u; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(mx, my, nx, ny); g.stroke();
      if (rnd() < 0.45) vein(nx, ny, a + (rnd() < 0.5 ? -1 : 1) * (0.6 + rnd() * 0.5), w * 0.6, n - i - 1);
      x = nx; y = ny; a += (rnd() - 0.5) * 0.9; w *= 0.8;
    }
  };
  for (let i = 0; i < 2 + level * 2; i++) vein(im.width * (0.2 + rnd() * 0.6), im.height * (0.55 + rnd() * 0.45), -Math.PI / 2 + (rnd() - 0.5) * 1.4, 1.5 + rnd(), 6);
  return STAIN[id] = c;
}
function drawMist() {
  for (const q of mist) {
    const a = (1 - q.t / q.life) * 0.5, x = q.x - cam, g = ctx.createRadialGradient(x, q.y, 0, x, q.y, q.r);
    g.addColorStop(0, 'rgba(14,10,22,' + a + ')'); g.addColorStop(1, 'rgba(14,10,22,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, q.y, q.r, 0, 7); ctx.fill();
  }
}
function drawMob(m) {
  const im = stained(SET + 'mob', 1), s = 0.48, bob = 0, sway = m.wait > 0 ? 0 : Math.sin(m.t * 9) * 0.07, sq = m.wait > 0 ? 1 + Math.sin(m.t * 3) * 0.02 : 1 + Math.sin(m.t * 18) * 0.04;
  const x = m.x - cam; if (x < -200 || x > W + 200) return;
  shadow(x, m.y, 46);
  ctx.save(); ctx.translate(x, m.y); ctx.rotate(sway);        // 발밑을 축으로 좌우로 기운다
  if (m.dead) { ctx.globalAlpha = Math.max(0, 1 - m.dead * 2.4); ctx.translate(0, m.dead * 14); ctx.rotate(m.dead * 0.9 * -m.dir); }   // 주저앉으며 흐려지고, 검은 무늬는 안개로 흩어진다
  ctx.scale(m.dir > 0 ? -s : s, s / sq * (m.hit > 0 ? 0.9 : 1));          // 그림은 왼쪽을 본다
  if (m.hit > 0) ctx.filter = 'brightness(2.2)';
  ctx.drawImage(im, -im.width / 2, -im.height);
  ctx.restore();
}

function part(key, pivot, ang) {
  const im = IMG[SET + key];
  if (!ang) { ctx.drawImage(im, 0, 0); return; }
  ctx.save(); ctx.translate(pivot[0], pivot[1]); ctx.rotate(ang); ctx.translate(-pivot[0], -pivot[1]); ctx.drawImage(im, 0, 0); ctx.restore();
}
// 등불: 기사 그림에 그려 넣지 않는다. 코드로 그려 허리에 달고, 걸을 때 흔들리고, 별을 모을수록 불빛이 커진다.
const LAMP = { x: 0, y: 0, on: false };
function drawLantern(hx, hy, ang, t) {
  const iron = '#2f271f', lit = 0.5 + stars / 14;
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang); ctx.scale(0.62, 0.62); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = iron; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.stroke();           // 허리끈에 건 고리
  ctx.beginPath(); ctx.arc(0, 33, 11, 0, 7); ctx.stroke();
  ctx.fillStyle = iron; ctx.beginPath(); ctx.moveTo(-36, 64); ctx.quadraticCurveTo(-8, 40, 0, 42); ctx.quadraticCurveTo(8, 40, 36, 64); ctx.closePath(); ctx.fill();   // 뚜껑
  const g = ctx.createRadialGradient(0, 104, 3, 0, 104, 50);                                                                // 유리 안의 불빛
  g.addColorStop(0, '#fff6d0'); g.addColorStop(0.35 + lit * 0.2, '#ffbb5a'); g.addColorStop(1, '#6b3d18');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-29, 64, 58, 78, 7); ctx.fill();
  const f = 1 + Math.sin(t * 9) * 0.08 + Math.sin(t * 23) * 0.05, fh = (20 + stars * 3.2) * f;                              // 깜빡이
  ctx.fillStyle = '#fffbe6'; ctx.beginPath(); ctx.moveTo(0, 118); ctx.quadraticCurveTo(-11 - stars, 112, 0, 118 - fh); ctx.quadraticCurveTo(11 + stars, 112, 0, 118); ctx.fill();
  ctx.strokeStyle = iron; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(-29, 64, 58, 78, 7); ctx.stroke();            // 쇠 테와 살
  ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(-10, 64); ctx.lineTo(-10, 142); ctx.moveTo(10, 64); ctx.lineTo(10, 142); ctx.stroke();
  ctx.fillStyle = iron; ctx.beginPath(); ctx.roundRect(-35, 140, 70, 13, 4); ctx.fill();                                    // 바닥
  const p = ctx.getTransform().transformPoint(new DOMPoint(0, 104)); LAMP.x = p.x; LAMP.y = p.y; LAMP.on = true;
  ctx.restore();
}
function drawLampGlow() {                 // 장면의 빛을 다 입힌 뒤에 더한다. 별 하나마다 한 단계 커진다
  if (!LAMP.on) return; LAMP.on = false;
  const t = knight.t, fl = 1 + Math.sin(t * 9) * 0.05 + Math.sin(t * 23) * 0.03, r = (64 + stars * 24) * fl, a = 0.30 + stars * 0.035;
  const g = ctx.createRadialGradient(LAMP.x, LAMP.y, 0, LAMP.x, LAMP.y, r);
  g.addColorStop(0, 'rgba(255,214,140,' + a + ')'); g.addColorStop(0.4, 'rgba(255,170,80,' + a * 0.45 + ')'); g.addColorStop(1, 'rgba(255,150,60,0)');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(LAMP.x, LAMP.y, r, 0, 7); ctx.fill(); ctx.restore();
}
function drawKnight() {
  K = KS[SET];
  const k = knight, t = k.t, walking = k.state === 'walk', air = !!k.jump;
  let leg = 0, bob = Math.sin(t * 2.4) * 3, lean = 0, sword = K.rest + Math.sin(t * 2.4) * 0.03, head = Math.sin(t * 2.4 + 0.6) * 0.02;
  if (walking) { leg = Math.sin(t * 13) * 0.42; bob = Math.abs(Math.sin(t * 13)) * 5; lean = 0.05; sword = K.rest + Math.sin(t * 13) * 0.1; head = Math.sin(t * 13) * 0.03; }
  if (air) { leg = 0.5; lean = 0.08; sword = K.rest + 0.9; head = -0.06; bob = 0; }
  if (k.atk > 0) {
    const p = 1 - k.atk / 0.42;                                             // 0→1
    sword = p < 0.45 ? K.rest + (p / 0.45) * 1.75 : K.rest + 1.75 - ((p - 0.45) / 0.3) * 2.9;
    if (p > 0.75) sword = K.rest - 1.15 + ((p - 0.75) / 0.25) * 1.15;
    lean = p < 0.45 ? -0.07 : 0.16; leg = 0.2; bob = p < 0.45 ? -6 : 6;
  }
  const drop = air ? 0 : K.leg * (1 - Math.cos(leg));                       // 다리 길이 213(그림 기준)
  const x = k.x - cam;
  shadow(x, air ? FLOORS[k.jump.to].y : k.y, 50);
  ctx.save(); ctx.translate(x, k.y); ctx.scale(k.dir * K.face * K.s, K.s); ctx.translate(-K.cx, -K.feet + drop);   // 그림은 왼쪽을 본다
  part('legL', K.hipL, leg); part('legR', K.hipR, -leg);

function frame(now) {
