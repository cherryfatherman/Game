<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>중세기사 키우기 · 몬스터 시안</title>
<style>
  body { margin: 0; padding: 24px; background: #e4d9bf; font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; color: #3b2a22; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  #grid { display: grid; grid-template-columns: repeat(5, 300px); gap: 16px; }
  .card { background: #efe6cf; border: 2px solid #3b2a22; border-radius: 10px; overflow: hidden; }
  .card canvas { width: 300px; height: 300px; display: block; }
  .card div { text-align: center; padding: 8px; font-size: 17px; font-weight: bold; border-top: 2px solid #3b2a22; }

<body>
<h1>몬스터 시안 10종 · 수채화 동화풍 (전부 코드로 그린 오리지널)</h1>
<div id="grid"></div>
<script>
'use strict';
const INK = '#3b2a22', TOOTH = '#f3edd5';
let c, rnd;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function E(cx, cy, rx, ry, rot = 0, n = 10) {
  const k = 1 / Math.cos(Math.PI / n), out = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;
    out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return out;
}
function path(pts, j, sharp, open) {
  const p = pts.map(q => [q[0] + (rnd() - 0.5) * j, q[1] + (rnd() - 0.5) * j]), n = p.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  c.beginPath();
  if (sharp) { p.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); return; }
  if (open) { c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < n - 1; i++) { const e = i === n - 2 ? p[n - 1] : m(p[i], p[i + 1]); c.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
    if (n === 2) c.lineTo(p[1][0], p[1][1]); return; }
  const s = m(p[n - 1], p[0]); c.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const e = m(p[i], p[(i + 1) % n]); c.quadraticCurveTo(p[i][0], p[i][1], e[0], e[1]); }
  c.closePath();
}
// 수채화처럼: 색을 칠하고, 빛·그늘·얼룩을 얹고, 살짝 어긋난 손그림 선을 긋는다
function sh(pts, color, o = {}) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), w = x1 - x0, h = y1 - y0;
  path(pts, 2.5, o.sharp); c.fillStyle = color; c.fill();
  c.save(); c.clip();
  let g = c.createRadialGradient(x0 + w * 0.3, y0 + h * 0.22, 0, x0 + w * 0.3, y0 + h * 0.22, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(255,250,225,0.42)'); g.addColorStop(1, 'rgba(255,250,225,0)'); c.fillStyle = g; c.fillRect(x0 - 5, y0 - 5, w + 10, h + 10);
  g = c.createLinearGradient(x0, y0, x0 + w * 0.35, y1);
  g.addColorStop(0.45, 'rgba(60,35,55,0)'); g.addColorStop(1, 'rgba(60,35,55,0.36)'); c.fillStyle = g; c.fillRect(x0 - 5, y0 - 5, w + 10, h + 10);
  for (let i = 0; i < 5; i++) { c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,240,0.07)' : 'rgba(40,30,50,0.06)';
    c.beginPath(); c.arc(x0 + rnd() * w, y0 + rnd() * h, 6 + rnd() * Math.max(w, h) * 0.3, 0, 7); c.fill(); }
  c.restore();
  if (o.line !== false) { c.strokeStyle = INK; c.lineJoin = c.lineCap = 'round';
    c.lineWidth = o.w || 3; path(pts, 1.5, o.sharp); c.stroke();
    c.globalAlpha = 0.3; c.lineWidth = 1.2; path(pts, 4, o.sharp); c.stroke(); c.globalAlpha = 1; }
}
function ln(pts, w = 2.6, color = INK) { c.strokeStyle = color; c.lineWidth = w; c.lineJoin = c.lineCap = 'round'; path(pts, 1.5, false, true); c.stroke(); }
function eye(x, y, r, pr, dx = 0, dy = 0, col = '#f3edd5') {
  sh(E(x, y, r, r * 1.05), col, { w: 2.2 });
  c.fillStyle = '#1e1418'; c.beginPath(); c.arc(x + dx, y + dy, pr, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(x + dx - pr * 0.35, y + dy - pr * 0.4, Math.max(0.8, pr * 0.3), 0, 7); c.fill();
}
function dot(x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); }
function wash(col) {
  c.fillStyle = '#efe6cf'; c.fillRect(0, 0, 360, 360);
  c.globalAlpha = 0.55; for (let i = 0; i < 4; i++) { path(E(180 + (rnd() - 0.5) * 40, 180 + (rnd() - 0.5) * 30, 140 + rnd() * 25, 125 + rnd() * 25, rnd()), 20); c.fillStyle = col; c.globalAlpha = 0.22; c.fill(); }
  c.globalAlpha = 0.22; c.fillStyle = '#3c2337'; c.beginPath(); c.ellipse(180, 332, 105, 11, 0, 0, 7); c.fill(); c.globalAlpha = 1;
}
function grain(cv) {
  const im = c.getImageData(0, 0, cv.width, cv.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8; }
  c.putImageData(im, 0, 0);
}
const mir = pts => pts.map(p => [360 - p[0], p[1]]);

    ln([[150, 78], [143, 60]], 2); ln([[166, 71], [164, 50]], 2); ln([[184, 72], [190, 54]], 2);

    ln([[132, 98], [160, 86]], 2); ln([[138, 90], [142, 100]], 1.6); ln([[148, 86], [152, 96]], 1.6);

  ['해골 병사', () => { const B = '#ece5cb'; wash('#c8b4be');

    sh([[146, 160], [214, 160], [204, 197], [156, 197]], '#ddd5b8'); sh(E(180, 120, 63, 58), B);
    sh(E(154, 122, 18, 22, 0.15), '#2e2230', { w: 2.2 }); sh(E(207, 122, 18, 22, -0.15), '#2e2230', { w: 2.2 });
    dot(158, 126, 4.5, '#ff8a5c'); dot(204, 124, 3, '#ff8a5c');

  ['돌 골렘', () => { const S = '#a5a596', M = '#7f9a5c'; wash('#b0c0aa');
    sh([[125, 270], [170, 270], [172, 332], [116, 332]], S, { sharp: 1 }); sh([[190, 270], [235, 270], [244, 332], [188, 332]], S, { sharp: 1 });
    sh([[48, 152], [100, 138], [106, 292], [42, 302]], S, { sharp: 1 }); sh([[260, 138], [312, 152], [318, 302], [254, 292]], S, { sharp: 1 });
    sh([[92, 110], [268, 110], [252, 286], [108, 286]], S, { sharp: 1 });
    sh([[144, 64], [216, 64], [222, 126], [138, 126]], '#b3b3a2', { sharp: 1 });
    sh([[154, 89], [206, 89], [206, 101], [154, 101]], '#2e2a30', { w: 2.2, sharp: 1 }); dot(192, 95, 4.5, '#8fe6c4'); dot(192, 95, 2, '#eafff5');
    sh(E(122, 114, 36, 13, 0.1), M, { w: 2.2 }); sh(E(240, 109, 22, 9), M, { w: 2.2 }); sh(E(180, 62, 26, 8), M, { w: 2.2 }); sh(E(70, 146, 20, 8, -0.2), M, { w: 2.2 });
    ln([[170, 150], [186, 182], [174, 206], [190, 234]], 2); ln([[230, 168], [219, 196]], 2); ln([[70, 220], [84, 246]], 2); ln([[135, 240], [150, 258]], 1.8); }],
  ['떠도는 유령', () => { const W = '#e9f0f0', D = '#2e2a3a'; wash('#8fa0ba');
    sh(E(86, 192, 14, 30, 0.6), W); sh(E(274, 192, 14, 30, -0.6), W);
    sh([[180, 58], [250, 90], [262, 200], [272, 302], [240, 278], [215, 312], [185, 282], [155, 314], [125, 280], [90, 304], [100, 200], [110, 90]], W);
    sh(E(151, 140, 16, 27, 0.22), D, { w: 2.2 }); sh(E(211, 142, 13, 24, -0.2), D, { w: 2.2 }); sh(E(181, 204, 9, 23), D, { w: 2.2 });
    dot(154, 148, 2.5, '#cfe0ff'); ln([[140, 172], [137, 190], [141, 206]], 1.6, '#8fa0ba'); ln([[218, 170], [222, 186]], 1.6, '#8fa0ba'); }],
  ['늪 트롤', () => { const T = '#88a5a1', N = '#7a9592'; wash('#c2c9a0');
    sh(E(150, 320, 27, 17), T); sh(E(206, 320, 27, 17), T); sh(E(148, 126, 10, 19, -0.5), T);
    sh(E(175, 222, 82, 86, 0.2), T);
    sh(E(94, 266, 20, 70, 0.1), T); sh(E(256, 270, 20, 68, -0.15), T); sh(E(92, 332, 23, 12), T); sh(E(262, 333, 23, 12), T);
    sh(E(200, 130, 53, 49, 0.1), T); sh(E(196, 86, 36, 13), '#6f8a50', { w: 2.2 });
    ln([[176, 80], [170, 54]], 2.4); ln([[194, 76], [196, 48]], 2.4); ln([[212, 80], [222, 56]], 2.4);
    sh([[204, 124], [233, 127], [264, 186], [241, 202], [211, 171]], N);
    eye(181, 118, 8.5, 2.4, 2, 1, '#e6e0a8'); eye(229, 113, 6.5, 2.2, 1, 1, '#e6e0a8');
    ln([[183, 166], [204, 174], [224, 169]]); sh([[194, 170], [199, 183], [205, 172]], TOOTH, { w: 1.6 });
    dot(250, 180, 2.5, '#66807c'); dot(140, 200, 3, '#6f8a50'); dot(215, 250, 3, '#6f8a50'); ln([[150, 190], [176, 200], [200, 192]], 1.8); }],
  ['거대 거미', () => { const P = '#66546f'; wash('#c8b8c6');
    for (let i = 0; i < 4; i++) { const L = [[150, 205 + i * 6], [96 - i * 10, 128 + i * 34], [50 - i * 4, 232 + i * 28]];
      for (const pts of [L, mir(L)]) { ln(pts, 10); ln(pts, 5.5, P); } }
    sh(E(180, 158, 80, 71), P); sh(E(180, 134, 20, 29), '#c8a24a', { w: 2.2 }); sh(E(180, 134, 7, 12), '#7e3540', { line: false });
    sh(E(180, 246, 50, 41), '#735f7c');

  ['버섯 요괴', () => { const K = '#ece2c6'; wash('#d6bc9c');
    sh(E(160, 324, 14, 10), K); sh(E(200, 324, 14, 10), K);
    ln([[140, 250], [118, 268], [112, 286]], 6); ln([[140, 250], [118, 268], [112, 286]], 3, K); ln([[222, 250], [244, 262], [252, 280]], 6); ln([[222, 250], [244, 262], [252, 280]], 3, K);

LIST.forEach(([name, draw], i) => {
  const card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = cv.height = 720;
  c = cv.getContext('2d'); c.scale(2, 2); rnd = rng(1234 + i * 77);
  draw(); c.setTransform(1, 0, 0, 1, 0, 0); grain(cv);
  const cap = document.createElement('div'); cap.textContent = name;
  card.append(cv, cap); document.getElementById('grid').append(card);
});
</script>
