<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>잊혀진 기사 키우기 · 1~3장 해 보는 판</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0c; overflow: hidden; font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; -webkit-user-select: none; user-select: none; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); font-size: calc(min(100vw, 177.78vh) / 100); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #bar { position: absolute; left: 1.5em; bottom: 1.4em; display: flex; gap: 0.8em; }
  button { font: inherit; font-weight: 700; color: #fbf1d3; background: rgba(20, 28, 22, 0.86); border: 0.18em solid #d9c890; border-radius: 0.9em; padding: 0.55em 1.1em; font-size: 1.7em; cursor: pointer; }
  button:active { background: rgba(60, 70, 50, 0.95); }
  button:disabled { opacity: 0.4; }
  button.go { background: rgba(150, 70, 30, 0.92); border-color: #ffd58a; }
  #panel { position: absolute; right: 1.5em; top: 7em; bottom: 1.4em; width: 44em; background: rgba(16, 22, 18, 0.94); border: 0.2em solid #d9c890; border-radius: 1.2em; color: #f3ecd6; display: none; flex-direction: column; }
  #panel h2 { margin: 0; padding: 0.7em 1em 0.5em; font-size: 2em; color: #ffe9a8; display: flex; justify-content: space-between; align-items: center; }
  #panel h2 button { font-size: 0.8em; padding: 0.2em 0.7em; }
  #body { overflow-y: auto; padding: 0 1.4em 1.2em; flex: 1; font-size: 1.55em; line-height: 1.5; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.6em 0; border-bottom: 0.08em solid rgba(217, 200, 144, 0.25); }
  .row button { font-size: 1em; white-space: nowrap; }
  .dim { color: #a9ad9a; font-size: 0.86em; }
  .gold { color: #ffd27a; } .gem { color: #9fd8ff; }
  .mobrow { display: flex; gap: 0.9em; padding: 0.7em 0; border-bottom: 0.08em solid rgba(217, 200, 144, 0.25); }
  .mobrow img { width: 4.4em; height: 4.4em; object-fit: contain; flex: none; }
  .mobrow.no img { filter: brightness(0); opacity: 0.5; }
  .loot { color: #ffe9a8; font-weight: 700; }
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3em 1.2em; margin-top: 0.6em; font-size: 0.88em; }
  .wgrid div.no { color: #6f7468; }
  #toast { position: absolute; left: 50%; top: 9em; transform: translateX(-50%); width: 52em; pointer-events: none; display: flex; flex-direction: column; gap: 0.6em; align-items: center; }
  .t { background: rgba(14, 18, 15, 0.9); border: 0.14em solid #d9c890; border-radius: 0.9em; color: #f6efd8; padding: 0.6em 1.2em; font-size: 1.6em; line-height: 1.45; text-align: center; animation: fade 6s forwards; }
  .t b { color: #ffe9a8; }
  @keyframes fade { 0% { opacity: 0; transform: translateY(-0.6em); } 6% { opacity: 1; transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
  #card { position: absolute; inset: 0; background: rgba(6, 8, 7, 0.78); display: none; align-items: flex-end; justify-content: center; cursor: pointer; }
  #cardbox { width: 70em; min-height: 11em; margin-bottom: 5em; background: rgba(18, 22, 19, 0.96); border: 0.2em solid #d9c890; border-radius: 1.2em; padding: 1.6em 2.2em; color: #f6efd8; }
  #who { font-size: 1.7em; color: #ffd58a; font-weight: 700; min-height: 1.4em; }
  #say { font-size: 2.2em; line-height: 1.55; margin-top: 0.3em; }
  #say.big { font-size: 3.6em; text-align: center; color: #ffe9a8; padding: 0.6em 0; }
  #say.em { color: #ffe9a8; font-weight: 700; }
  #skip { position: absolute; right: 2em; top: 2em; font-size: 1.4em; }
  #hint { position: absolute; right: 3em; bottom: 5.6em; font-size: 1.3em; color: #a9ad9a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1600" height="900"></canvas>
  <div id="bar">
    <button id="bUp">강화</button><button id="bWp">무기</button><button id="bBook">도감</button><button id="bGo" class="go" style="display:none">다음 스테이지 도전</button>
  </div>
  <div id="panel"><h2><span id="ptitle"></span><button id="pclose">닫기</button></h2><div id="body"></div></div>
  <div id="toast"></div>
  <div id="card"><button id="skip">건너뛰기</button><div id="cardbox"><div id="who"></div><div id="say"></div></div><div id="hint">누르면 넘어갑니다</div></div>
</div>
<script src="art/게임/자료.js"></script>
<script>
// 잊혀진 기사 키우기 · 1~3장을 실제로 해 보는 판.
// 그림과 글은 tools/게임자산.py 가 art/게임/ 에 모아 둔 것을 쓴다. 숫자는 아래 '값' 한 곳에 모았다(1차 값. 해 보고 고친다).
const W = 1600, H = 900, GROUND = 770, D = window.DATA, $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), IMG = {};
function load(key, src) { if (IMG[key]) return IMG[key].p; const im = new Image(); IMG[key] = im; im.p = new Promise(r => { im.onload = r; im.onerror = r; }); im.src = 'art/게임/' + src; return im.p; }

// ───────── 값 ─────────
const V = {
  stages: 30,                    // 지금 들어 있는 스테이지 수 (1-1 ~ 3-10)
  chMul: [3.2, 3.0, 2.8, 2.5, 2.3, 2.1, 2.0, 1.9, 1.8, 1.7],   // 한 장을 지나는 동안 기준 공격력이 몇 배가 되는가. 10장 끝에 약 3.8만
  atkPerLv: 0.03, hpPerLv: 0.08, lootBonus: 0.01, starBonus: 0.10,   // 보너스는 모두 더한다(곱하지 않는다)
  mobDef: 0.3, mobHp: 0.7, bossHp: 40, bossTime: 30,     // 우두머리는 기준 공격력의 6할쯤은 되어야 30초 안에 넘는다
  goal: 20, lootRate: 0.08, crit: 0.10, critMul: 1.5, lineCap: 999999,
  wStep: [0, 3, 5, 8],           // 한 장 안에서 무기 단계가 올라가야 하는 스테이지
  gemStage: 3, gemBoss: 15, gemStart: 5, gemKills: 40,      // 처음 깨면 3개, 우두머리 15개, 그리고 40마리마다 1개
  pullDrop: 0.5, pullSpan: 5,    // 뽑기: 한 단계 위일수록 절반만 나온다. 지금 필요한 단계보다 하나 위까지 나온다
};
const par = s => { let v = 10; for (let i = 0; i < s; i++) v *= Math.pow(V.chMul[Math.floor(i / 10)], 0.1); return v; };
const expect = s => 1 + (V.atkPerLv + V.lootBonus) * s + V.starBonus * Math.floor(s / 10);      // 그 스테이지쯤이면 갖췄을 보너스
const WATK = D.weapons.map((w, k) => { const s = Math.floor(k / 4) * 10 + V.wStep[k % 4]; return Math.max(1, Math.round(par(s) / expect(s))); });   // 그 단계가 필요해지는 스테이지의 기준 공격력에 맞춘다
const mobStat = s => { const p = par(s), boss = s % 10 === 9, hp = Math.max(3, Math.round(p * V.mobHp * (boss ? V.bossHp : 1)));
  return { hp, def: Math.floor(p * V.mobDef), atk: Math.max(2, Math.round(100 * (1 + V.hpPerLv * s) / 22 * (boss ? 1.6 : 1))), gold: Math.max(1, Math.round(p * V.mobHp / 4 * (boss ? 10 : 1))) }; };
const upCost = (lv, k) => { const s = Math.min(lv, V.stages - 1); return Math.max(k, Math.round(par(s) * V.mobHp / 4 * k * Math.pow(1.04, Math.max(0, lv - V.stages)))); };   // 그 레벨쯤의 스테이지 몬스터 k마리어치
const fmt = n => { n = Math.round(n); return n < 10000 ? n.toLocaleString('ko-KR') : (n / 10000).toFixed(n < 1e6 ? 1 : 0).replace(/\.0$/, '') + '만'; };

// ───────── 저장 ─────────
const SAVE = 'forgotten-knight-v1';
let S = { stage: 0, cleared: 0, auto: true, gold: 0, gems: V.gemStart, atkLv: 0, hpLv: 0, wc: D.weapons.map((w, i) => i ? 0 : 1), best: 0, loot: {}, stars: 0, seen: {} };
try { const j = JSON.parse(localStorage.getItem(SAVE) || 'null'); if (j && j.wc) S = Object.assign(S, j); } catch (e) {}
const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };
const lootKinds = () => Object.keys(S.loot).length;
const atk = () => WATK[S.best] * (1 + V.atkPerLv * S.atkLv + V.lootBonus * lootKinds() + V.starBonus * S.stars);
const maxHp = () => Math.round(100 * (1 + V.hpPerLv * S.hpLv));
const lvCap = () => S.cleared + 3;
const needStep = s => Math.min(D.weapons.length - 1, Math.floor(s / 10) * 4 + V.wStep.filter(x => x <= s % 10).length - 1);   // 그 스테이지에 맞는 무기 단계

// ───────── 스테이지 ─────────
const stageKey = s => (Math.floor(s / 10) + 1) + '-' + (s % 10 + 1), mobKey = s => (Math.floor(s / 10) + 1) + '-' + String(s % 10 + 1).padStart(2, '0');
let WORLD = 3000, PLATS = [], FLOORS = [], mobs = [], mist = [], nums = [], cam = 0, kills = 0, goal = V.goal, boss = null, timer = 0, phase = 'load', fade = 1, phaseT = 0, swing = 0;
const knight = { x: 300, y: GROUND, floor: 0, dir: 1, state: 'walk', t: 0, atk: 0, jump: null, target: null, hp: 100, hurt: 0 };
// 기사 인형(1024 그림 기준 좌표). 왼쪽을 보고 선 그림.
const K = { face: -1, s: 0.31, cx: 578, feet: 927, hipL: [498, 742], hipR: [662, 742], hipY: 742, leg: 185, hand: [703, 694], neck: [572, 458], swordLen: 600, grip: 100, rest: -0.405, lamp: [640, 668] };

function rng(seed) { let x = seed * 9301 + 49297; return () => (x = (x * 16807 + 11) % 2147483647) / 2147483647; }
async function enter(s) {
  phase = 'load'; S.stage = s; save();
  const ch = Math.floor(s / 10) + 1, isBoss = s % 10 === 9, key = stageKey(s);
  const need = [load('bg' + D.bg[key], 'bg/' + D.bg[key] + '.jpg'), load('ground' + ch, 'plat/땅-' + ch + '.png')];
  for (const p of D.plat[ch]) need.push(load('p' + p.img, 'plat/' + p.img));
  for (let i = 1; i <= 10; i++) { const k = ch + '-' + String(i).padStart(2, '0'); need.push(load('m' + k, 'mob/' + k + '.png')); }
  await Promise.all(need);
  WORLD = isBoss ? W : 3000; PLATS = []; mobs = []; mist = []; nums = []; kills = 0; goal = isBoss ? 1 : V.goal; boss = null; timer = V.bossTime; swing = 0;
  if (!isBoss) {
    const r = rng(s + 5), list = D.plat[ch];
    for (let i = 0; i < 4; i++) {
      const p = list[Math.floor(r() * list.length)], x = 520 + i * 600 + (r() - 0.5) * 200;
      const y = p.kind === 'float' ? [470, 540, 600][Math.floor(r() * 3)] : GROUND - (p.h - p.top) + 14;
      PLATS.push({ x, y, w: p.w, h: p.h, top: p.top, img: 'p' + p.img });
    }
  }
  FLOORS = [{ x: 0, y: GROUND, w: WORLD }].concat(PLATS.map(p => ({ x: p.x + p.w * 0.1, y: p.y, w: p.w * 0.8 })));
  Object.assign(knight, { x: isBoss ? 260 : 200, y: GROUND, floor: 0, dir: 1, state: 'walk', atk: 0, jump: null, hp: maxHp(), hurt: 0 }); cam = 0;
  if (isBoss) { boss = spawn(0, mobKey(s), s, 1150); boss.boss = true; } else fill(true);
  phase = 'play'; phaseT = 0; fade = 1; ui();
  const diary = D.story.diary[key]; if (diary && !S.seen['d' + key] && S.seen.opening) { S.seen['d' + key] = 1; toast(diary); }
}
function spawn(floor, key, s, x) {
  const f = FLOORS[floor], d = D.mob[key], st = mobStat(s);
  const m = { key, floor, x: x || f.x + 60 + Math.random() * Math.max(10, f.w - 120), y: f.y, dir: Math.random() < 0.5 ? -1 : 1, hp: st.hp, max: st.hp, def: st.def, atk: st.atk, gold: st.gold,
    t: Math.random() * 9, hit: 0, dead: 0, speed: d.sp * (0.8 + Math.random() * 0.4), wait: 0, cd: 0.6 + Math.random(), lunge: 0, h: d.h, w: d.w, fly: d.fly };
  mobs.push(m); return m;
}
function fill(first) {
  if (boss || phase === 'clear') return;
  const s = S.stage, base = Math.floor(s / 10) * 10;
  for (let i = 0; i < FLOORS.length; i++) {
    const want = i === 0 ? 6 : FLOORS[i].w > 300 ? 2 : 1;
    while (mobs.filter(m => m.floor === i && !m.dead).length < want) {
      const other = s > base && Math.random() < 0.25 ? base + Math.floor(Math.random() * (s - base)) : s;       // 넷에 하나는 앞 스테이지의 몬스터
      const m = spawn(i, mobKey(other), s); if (i === 0 && !first && Math.abs(m.x - knight.x) < 500) m.x = knight.x + (Math.random() < 0.5 ? -1 : 1) * (600 + Math.random() * 500);
      m.x = Math.max(FLOORS[i].x + 40, Math.min(FLOORS[i].x + FLOORS[i].w - 40, m.x));
    }
  }
}

function hitMob(m, mult, lines) {
  for (let i = 0; i < lines; i++) {
    const a = atk() * mult, c = Math.random() < V.crit; let dmg = Math.max(a * 0.1, a - m.def) * (0.9 + Math.random() * 0.2) * (c ? V.critMul : 1);
    dmg = Math.min(V.lineCap, Math.max(1, Math.round(dmg))); m.hp -= dmg;
    nums.push({ x: m.x + (Math.random() - 0.5) * 40, y: m.y - m.h * (m.fly ? 1.5 : 0.85) - i * 46, v: fmt(dmg), t: -i * 0.07, c: c ? '#ffd24a' : '#fff' });
  }
  m.hit = 0.18;
  if (m.hp <= 0 && !m.dead) {
    m.dead = 0.001; kills++; S.gold += m.gold; S.kc = (S.kc || 0) + 1; if (S.kc % V.gemKills === 0) { S.gems++; toast('<span class="gem">보석 +1</span> <span class="dim">(' + V.gemKills + '마리마다 하나)</span>'); } knight.hp = Math.min(maxHp(), knight.hp + maxHp() * 0.04);
    for (let i = 0; i < (m.boss ? 40 : 9); i++) mist.push({ x: m.x + (Math.random() - 0.5) * m.w, y: m.y - Math.random() * m.h, vx: (Math.random() - 0.5) * 70, vy: -30 - Math.random() * 60, r: 22 + Math.random() * 30, t: 0, life: 0.7 + Math.random() * 0.5 });
    if (m.boss || Math.random() < V.lootRate) getLoot(m.key);
    if (kills >= goal && phase === 'play') { phase = 'clear'; phaseT = 0; }
    ui();
  }
}
function getLoot(key) {
  const d = D.mob[key], first = !S.loot[key]; S.loot[key] = (S.loot[key] || 0) + 1;
  if (first) toast('<b>전리품 · ' + d.loot + '</b><br>' + d.lootText + '<br><span class="dim">도감 ' + lootKinds() + '종 · 공격력 +' + Math.round(V.lootBonus * 100) + '%</span>');
}
function fail() {                                                            // 쓰러지거나 우두머리 시간이 다 됐다: 한 스테이지 물러나서 힘을 기른다
  if (phase !== 'play') return; phase = 'fail'; phaseT = 0; S.auto = false; window.__dbg && window.__dbg.fails++;
  toast(boss && timer <= 0 ? '시간이 다 됐다. 한 걸음 물러나 힘을 기른다.' : '쓰러졌다. 한 걸음 물러나 힘을 기른다.');
}
function cleared() {
  const s = S.stage, first = s >= S.cleared, isBoss = s % 10 === 9;
  if (first) {
    S.cleared = s + 1; const g = isBoss ? V.gemBoss : V.gemStage; S.gems += g; if (isBoss) S.stars++;
    toast('<b>' + stageKey(s) + ' ' + (D.places[stageKey(s)] || '') + '</b> 을 지났다 · <span class="gem">보석 +' + g + '</span>');
    const sc = SCENES[stageKey(s)]; if (sc) { cards(sc, () => next(s)); save(); return; }
  }
  next(s);
}
function next(s) { save(); enter(S.auto && s + 1 < V.stages ? s + 1 : s); }

function update(dt) {
  knight.t += dt; phaseT += dt;
  if (knight.hurt > 0) knight.hurt -= dt;
  for (const q of mist) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.r += 26 * dt; }
  for (let i = mist.length - 1; i >= 0; i--) if (mist[i].t > mist[i].life) mist.splice(i, 1);
  for (const n of nums) n.t += dt;
  while (nums.length && nums[0].t > 0.9) nums.shift();
  if (phase === 'clear') { if (phaseT > (boss ? 1.6 : 0.7)) { phase = 'wait'; cleared(); } }
  if (phase === 'fail') { if (phaseT > 1.2) { phase = 'wait'; enter(Math.max(0, S.stage - 1)); } return; }
  if (phase !== 'play' && phase !== 'clear') return;
  if (boss && phase === 'play') { timer -= dt; if (timer <= 0) { fail(); return; } }
  for (const m of mobs) {
    m.t += dt; if (m.hit > 0) m.hit -= dt; if (m.lunge > 0) m.lunge -= dt;
    if (m.dead) { m.dead += dt; if (!m.boss) m.x -= knight.dir * -220 * dt; continue; }               // 무늬가 벗겨지면 달아난다
    const f = FLOORS[m.floor], dx = knight.x - m.x, near = m.floor === knight.floor && !knight.jump && Math.abs(dx) < 95 + m.w * 0.4;
    if (near && phase === 'play') {                                                                   // 기사가 닿는 곳에 있으면 덤빈다
      m.dir = Math.sign(dx) || m.dir; m.cd -= dt;
      if (m.cd <= 0) { m.cd = m.boss ? 1.5 : 1.3; m.lunge = 0.25; knight.hp -= m.atk; knight.hurt = 0.2; nums.push({ x: knight.x, y: knight.y - 250, v: '-' + fmt(m.atk), t: 0, c: '#ff8a7a' }); if (knight.hp <= 0) { knight.hp = 0; fail(); return; } }
      continue;
    }
    if (m.boss) { m.dir = Math.sign(dx) || m.dir; if (Math.abs(dx) > 200) m.x += m.dir * m.speed * dt; continue; }
    if (m.wait > 0) { m.wait -= dt; continue; }
    m.x += m.dir * m.speed * dt;
    if (m.x < f.x + 40) { m.x = f.x + 40; m.dir = 1; }
    if (m.x > f.x + f.w - 40) { m.x = f.x + f.w - 40; m.dir = -1; }
    if (Math.random() < dt * 0.25) m.wait = 0.5 + Math.random();
    if (Math.random() < dt * 0.15) m.dir *= -1;
  }
  for (let i = mobs.length - 1; i >= 0; i--) if (mobs[i].dead > (mobs[i].boss ? 9 : 0.6)) mobs.splice(i, 1);
  if (Math.random() < dt * 0.9) fill();

  // 기사: 가장 가까운 몬스터를 찾아 가서 벤다. 층이 다르면 뛰어오른다.
  if (knight.jump) {
    const j = knight.jump; j.t += dt / j.dur; const k = Math.min(1, j.t);
    knight.x = j.x0 + (j.x1 - j.x0) * k; knight.y = j.y0 + (j.y1 - j.y0) * k - Math.sin(Math.PI * k) * j.h;
    if (k >= 1) { knight.floor = j.to; knight.y = j.y1; knight.jump = null; knight.state = 'walk'; }
  } else {
    let best = null, bd = 1e9;
    for (const m of mobs) { if (m.dead) continue; const d = Math.abs(m.x - knight.x) + (m.floor === knight.floor ? 0 : 500) + Math.abs(m.y - knight.y) * 0.6; if (d < bd) { bd = d; best = m; } }
    knight.target = best;
    if (knight.atk > 0) {
      const before = knight.atk; knight.atk -= dt;
      if (before > 0.2 && knight.atk <= 0.2) {                                                       // 내려치는 순간. 다섯 번에 한 번은 연속 베기(세 줄)
        swing++; const skill = swing % 5 === 0;
        for (const m of mobs) if (!m.dead && m.floor === knight.floor && (m.x - knight.x) * knight.dir > -30 - m.w * 0.3 && Math.abs(m.x - knight.x) < 175 + m.w * 0.4) hitMob(m, skill ? 1.2 : 1, skill ? 3 : 1);
      }
      if (knight.atk <= 0) knight.state = 'walk';
    } else if (best) {
      if (best.floor !== knight.floor) {
        const f = FLOORS[best.floor], x1 = Math.max(f.x + 30, Math.min(f.x + f.w - 30, best.x - 90 * Math.sign(best.x - knight.x || 1)));

  D.weapons.forEach((w, k) => { const has = S.wc[k] > 0 || k <= S.best; h += '<div class="' + (has ? '' : 'no') + '">' + (has ? w.name : '???') + ' <span class="dim">' + w.grade + ' ' + w.step + ' · ' + fmt(WATK[k]) + (S.wc[k] ? ' · ' + S.wc[k] + '자루' : '') + '</span></div>'; });
  $('body').innerHTML = h + '</div>'; $('p1').onclick = () => pull(1); $('p10').onclick = () => pull(10);
}
function panelBook() {
  let h = '<p class="dim">전리품 ' + lootKinds() + ' / ' + V.stages + '종 · 한 종에 공격력 +1%</p>';
  for (let s = 0; s < V.stages; s++) { const k = mobKey(s), d = D.mob[k], met = s <= Math.max(S.cleared, S.stage), n = S.loot[k];
    h += '<div class="mobrow' + (met ? '' : ' no') + '"><img src="art/게임/mob/' + k + '.png"><div><b>' + stageKey(s) + ' ' + (met ? d.name : '???') + '</b>' + (met ? '<br><span class="dim">' + d.text + '</span>' : '') + (n ? '<br><span class="loot">' + d.loot + ' ×' + n + '</span><br>' + d.lootText : met ? '<br><span class="dim">전리품을 아직 얻지 못했다</span>' : '') + '</div></div>'; }
  $('body').innerHTML = h;
}
$('bUp').onclick = () => open('강화', panelUp); $('bWp').onclick = () => open('무기 뽑기', panelWp); $('bBook').onclick = () => open('도감', panelBook);

// ───────── 이야기 카드 ─────────
const CARD = { on: false, list: [], i: 0, done: null };
function cards(list, done) { CARD.list = list.filter(c => !c['작게'] || c.keep); CARD.i = 0; CARD.done = done; CARD.on = true; $('card').style.display = 'flex'; showCard(); }
function showCard() {
  const c = CARD.list[CARD.i]; if (!c) { CARD.on = false; $('card').style.display = 'none'; const d = CARD.done; CARD.done = null; if (d) d(); return; }
  $('who').textContent = c['말하는이'] || ''; const s = $('say'); s.className = c['제목카드'] ? 'big' : c['강조'] || c['얻음'] ? 'em' : ''; s.textContent = (c['글'] || '').replace(/\{이름\}/g, '루');
}
$('card').onclick = e => { if (e.target.id === 'skip') CARD.i = 1e9; else CARD.i++; showCard(); };
const T = (g, w) => w ? { '말하는이': w, '글': g } : { '글': g };
const SCENES = {
  '1-3': D.story.scene['밥상'], '1-10': D.story.scene['첫조각'],
  '2-10': [T('거인이 주저앉았다. 그래도 망토를 놓지 않는다.'), T('아저씨는 이름이 뭐야?', '하린'), T('거인은 대답하지 못한다.'), T('없으면 내가 지어 줄게.', '하린'),
    T('거인이 망토를 놓았다. 바람이 쏟아지고, 바람개비 수백 개가 한꺼번에 돈다.'), { '강조': true, '글': '두 번째 별, 이름의 별이 깨어났다. (별 2/7)' },
    T('…근데 넌 누구였지?', '하린'), T('이름을 잊어버리면 어때? 다시 물어보면 되잖아. 그럼 우리 다시 친구 하면 되겠다.', '하린')],
  '3-10': [T('이길 수 있는 순간에 검을 멈췄다.'), T('왜 검을 멈췄느냐?', '그림자 기사'), T('"기사는 이기려고만 검을 드는 게 아니니까요."'), T('왕은 좋은 분이었다. 그래서 아무도 왕을 막지 못했다.', '그림자 기사'),
    T('훈련 끝. 해산.', '그림자 기사'), T('그가 처음으로 말에서 내렸다. 녹이 부서져 떨어진다. 끝나지 않던 밤에 동이 튼다.'), { '강조': true, '글': '세 번째 별, 용기의 별이 깨어났다. (별 3/7)' },
    T('이름이 없구나. 나도 그렇다.', '그림자 기사'), T('그가 창을 어깨에 얹어 주었다. 잊힌 기사들이, 잊힌 수습기사를 기사로 세운다.'), { '글': '4장 오래된 정원은 준비하고 있어요.', '작게': true, keep: true }],
};

// ───────── 시작 ─────────
const boot = ['body', 'legL', 'legR', 'hand', 'head', 'headR'].map(k => load(k, 'knight/' + k + '.png')).concat(D.weapons.map((w, i) => load('w' + i, 'weapon/' + String(i).padStart(2, '0') + '.png')));
Promise.all(boot).then(async () => {
  await enter(Math.min(S.stage, V.stages - 1)); window.__ready = true; requestAnimationFrame(frame);
  if (!S.seen.opening) cards(D.story.opening, () => { S.seen.opening = 1; save(); const k = stageKey(S.stage), d = D.story.diary[k]; if (d && !S.seen['d' + k]) { S.seen['d' + k] = 1; toast(d); } });
  setInterval(save, 5000);
});
window.__dbg = { fails: 0, S, V, par, WATK, mobStat, atk, enter, pull, upCost, state: () => ({ phase, kills, goal, hp: knight.hp, mobs: mobs.length, boss: boss && boss.hp, timer }) };
</script>
